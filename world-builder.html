<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tiny World Builder · armá tu mundito</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4ede0;
    --panel: #ffffff;
    --panel-soft: #fbf6ec;
    --ink: #2a2722;
    --muted: #8a847a;
    --line: #ebe3d2;
    --line-soft: #f3ecdc;
    --gold: #d4a017;
    --red: #c84848;
    --green: #6fb442;
    --shadow: 0 18px 50px -20px rgba(50, 35, 10, 0.18), 0 2px 6px -2px rgba(50, 35, 10, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; z-index: 2; }
  canvas { display: block; cursor: grab; }
  canvas.placing { cursor: crosshair; }
  canvas.dragging { cursor: grabbing; }
  canvas.over-tile { cursor: pointer; }

  .brand {
    position: fixed;
    top: 22px; left: 26px;
    z-index: 10;
    pointer-events: none;
  }
  .brand .title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand .title em { font-style: italic; font-weight: 400; color: #a08454; }
  .brand .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  /* Counter chip top-right */
  .counter {
    position: fixed;
    top: 22px; right: 26px;
    z-index: 10;
    display: flex; gap: 8px;
  }
  .chip {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 6px;
  }
  .chip .ico { font-size: 14px; }
  .chip button {
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 0 0 0 6px;
    border-left: 1px solid var(--line);
    margin-left: 4px;
  }
  .chip button:hover { color: var(--ink); }

  /* Bottom dock */
  .dock {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 12;
    background: var(--panel);
    border-top: 1px solid var(--line);
    box-shadow: 0 -14px 40px -16px rgba(50, 35, 10, 0.18);
    padding: 10px 18px 14px;
  }
  .dock-items {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .dock-items::-webkit-scrollbar { height: 6px; }
  .dock-items::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .dock-item {
    flex: 0 0 96px;
    height: 110px;
    background: var(--line-soft);
    border: 1px solid transparent;
    border-radius: 14px;
    padding: 8px 4px 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    transition: background 0.12s, border-color 0.12s, transform 0.08s, box-shadow 0.15s;
  }
  .dock-item:hover { background: #faf3e0; }
  .dock-item:active { transform: translateY(1px); }
  .dock-item.active {
    background: #fff;
    border-color: var(--gold);
    box-shadow: 0 6px 18px -6px rgba(212, 160, 23, 0.45);
  }
  .dock-item.demolish.active { border-color: var(--red); box-shadow: 0 6px 18px -6px rgba(200, 72, 72, 0.45); }
  .dock-item .icon {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #faf3e2, #ebe0c4);
    box-shadow: inset 0 -3px 6px rgba(120, 90, 30, 0.08),
                inset 0 2px 4px rgba(255, 255, 255, 0.6);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    line-height: 1;
  }
  .dock-item.demolish .icon {
    background: radial-gradient(circle at 35% 30%, #fbe6e0, #e8b8ad);
  }
  .dock-item .name {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink);
    margin-top: 2px;
    letter-spacing: 0.01em;
  }

  /* Help text */
  .help {
    position: fixed;
    bottom: 138px; left: 50%; transform: translateX(-50%);
    z-index: 11;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    text-align: center;
    pointer-events: none;
  }
  .help kbd {
    background: var(--line-soft);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10.5px;
    font-family: inherit;
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="brand">
    <div class="title">Tiny <em>World Builder</em></div>
    <div class="sub">Elegí un edificio del dock y clickeá una baldosa para construir</div>
  </div>

  <div class="counter">
    <div class="chip" title="Cantidad de cosas que pusiste"><span class="ico">🏗️</span><span id="placedCount">0</span><button id="resetBtn" title="Limpiar todo">↺</button></div>
  </div>

  <div class="help">
    Click izquierdo: construir · Click derecho: demoler · Drag: mover · Scroll: zoom · <kbd>1</kbd>–<kbd>8</kbd> elegir
  </div>

  <div class="dock">
    <div class="dock-items" id="dockItems"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  // =====================================================================
  // Tiny World Builder — single-file 3D town painter.
  // Tile-based grid; pick a building from the dock and click a grass tile.
  // Right-click removes whatever's on a tile. Drag to pan, scroll to zoom.
  // No external state — your world persists in localStorage.
  // =====================================================================

  const GRID    = 16;
  const TILE    = 1.0;
  const TOP_H   = 0.16;
  const DIRT_H  = 0.12;
  const STORAGE_KEY = 'tinyWorldBuilder.v1';

  // ---------- scene / renderer ----------
  const container = document.getElementById('app');
  const canvasEl = document.createElement('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf4ede0);

  // ---------- camera (telephoto iso-ish) ----------
  const AZIMUTH = Math.PI * 0.25;
  let   POLAR   = Math.PI * 0.28;
  const FOV     = 24;
  let   viewSize = 11;
  const MIN_VIEW = 6, MAX_VIEW = 20;
  const target = new THREE.Vector3(0, 0, 0);
  const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.1, 200);
  function updateCamera() {
    const r = viewSize * 4.6;
    camera.position.x = target.x + r * Math.sin(POLAR) * Math.cos(AZIMUTH);
    camera.position.y = target.y + r * Math.cos(POLAR);
    camera.position.z = target.z + r * Math.sin(POLAR) * Math.sin(AZIMUTH);
    camera.lookAt(target);
  }
  updateCamera();

  // ---------- lights ----------
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb39879, 0.32));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(7, 14, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -18;
  sun.shadow.camera.right = 18;
  sun.shadow.camera.top = 18;
  sun.shadow.camera.bottom = -18;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 60;
  sun.shadow.bias = -0.0006;
  sun.shadow.radius = 3;
  scene.add(sun);

  // ---------- geometry helpers ----------
  function roundedBox(w, h, d, r = 0.05) {
    const shape = new THREE.Shape();
    const hw = w / 2, hd = d / 2;
    const rr = Math.min(r, hw - 0.001, hd - 0.001);
    shape.moveTo(-hw + rr, -hd);
    shape.lineTo(hw - rr, -hd);
    shape.quadraticCurveTo(hw, -hd, hw, -hd + rr);
    shape.lineTo(hw, hd - rr);
    shape.quadraticCurveTo(hw, hd, hw - rr, hd);
    shape.lineTo(-hw + rr, hd);
    shape.quadraticCurveTo(-hw, hd, -hw, hd - rr);
    shape.lineTo(-hw, -hd + rr);
    shape.quadraticCurveTo(-hw, -hd, -hw + rr, -hd);
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: h, bevelEnabled: true,
      bevelSegments: 1, bevelSize: 0.02, bevelThickness: 0.02, curveSegments: 3
    });
    geo.rotateX(-Math.PI / 2);
    return geo;
  }
  function roundedSlab(size, height, radius = 0.07) {
    return roundedBox(size, height, size, radius);
  }
  function castReceive(obj) {
    obj.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
    return obj;
  }

  // ---------- materials ----------
  const M = {
    grass:     new THREE.MeshLambertMaterial({ color: 0xb0d949 }),
    grassDk:   new THREE.MeshLambertMaterial({ color: 0x95c138 }),
    dirt:      new THREE.MeshLambertMaterial({ color: 0x7d4519 }),
    trunk:     new THREE.MeshLambertMaterial({ color: 0x5c3818 }),
    leaves:    new THREE.MeshLambertMaterial({ color: 0x86d139 }),
    leavesDk:  new THREE.MeshLambertMaterial({ color: 0x5fab26 }),
    pineDark:  new THREE.MeshLambertMaterial({ color: 0x2f6e2e }),
    pineLite:  new THREE.MeshLambertMaterial({ color: 0x4ea64a }),
    wallCream: new THREE.MeshLambertMaterial({ color: 0xf2dfb0 }),
    wallTrim:  new THREE.MeshLambertMaterial({ color: 0xe5cf99 }),
    foundation:new THREE.MeshLambertMaterial({ color: 0xa39c8c }),
    foundationD: new THREE.MeshLambertMaterial({ color: 0x756f63 }),
    roofTile:  new THREE.MeshLambertMaterial({ color: 0xc2643a }),  // terracotta
    roofTileD: new THREE.MeshLambertMaterial({ color: 0x8d4326 }),
    door:      new THREE.MeshLambertMaterial({ color: 0x6b4423 }),
    doorFrame: new THREE.MeshLambertMaterial({ color: 0x3e2510 }),
    winFrame:  new THREE.MeshLambertMaterial({ color: 0xf6f1e2 }),
    winGlass:  new THREE.MeshLambertMaterial({ color: 0x88c8ff }),
    chimney:   new THREE.MeshLambertMaterial({ color: 0xa55a3f }),  // brick
    chimneyCap:new THREE.MeshLambertMaterial({ color: 0x4e4540 }),
    knob:      new THREE.MeshLambertMaterial({ color: 0xc88a18 }),
    barnRed:   new THREE.MeshLambertMaterial({ color: 0xa83828 }),
    barnRedD:  new THREE.MeshLambertMaterial({ color: 0x7d2a1c }),
    barnRoof:  new THREE.MeshLambertMaterial({ color: 0x3a2418 }),
    barnRoofD: new THREE.MeshLambertMaterial({ color: 0x231510 }),
    barnTrim:  new THREE.MeshLambertMaterial({ color: 0xf2ece0 }),
    barnHay:   new THREE.MeshLambertMaterial({ color: 0xd4a04c }),
    barnPlank: new THREE.MeshLambertMaterial({ color: 0x8a2418 }),  // plank shadows
    weatherVane: new THREE.MeshLambertMaterial({ color: 0x2a2722 }),
    cabinWood: new THREE.MeshLambertMaterial({ color: 0x8a5a3b }),
    cabinDark: new THREE.MeshLambertMaterial({ color: 0x5c3818 }),
    cabinRoof: new THREE.MeshLambertMaterial({ color: 0x6e4528 }),
    cabinRoofD:new THREE.MeshLambertMaterial({ color: 0x4a2d18 }),
    cabinStone:new THREE.MeshLambertMaterial({ color: 0x9a9388 }),
    smoke:     new THREE.MeshLambertMaterial({ color: 0xf2eee4 }),
    smokeDk:   new THREE.MeshLambertMaterial({ color: 0xd8d2c3 }),
    leafGreen: new THREE.MeshLambertMaterial({ color: 0x5fab26 }),
    flowerBox: new THREE.MeshLambertMaterial({ color: 0x8a5a3b }),
    mat:       new THREE.MeshLambertMaterial({ color: 0xa55a3f }),
    millStone: new THREE.MeshLambertMaterial({ color: 0xe8dfc8 }),
    millStoneD:new THREE.MeshLambertMaterial({ color: 0xc4b893 }),
    millRoof:  new THREE.MeshLambertMaterial({ color: 0x8a3d2a }),
    millBlade: new THREE.MeshLambertMaterial({ color: 0xf2dfb0 }),
    millFrame: new THREE.MeshLambertMaterial({ color: 0x5c3818 }),
    water:     new THREE.MeshLambertMaterial({ color: 0x4aa3d8 }),
    waterDk:   new THREE.MeshLambertMaterial({ color: 0x2c81b8 }),
    sand:      new THREE.MeshLambertMaterial({ color: 0xf5e6b3 }),
    rock:      new THREE.MeshLambertMaterial({ color: 0xa9a49a }),
    rockDk:    new THREE.MeshLambertMaterial({ color: 0x7d7873 }),
    hover:     new THREE.MeshBasicMaterial({ color: 0x2a2722, transparent: true, opacity: 0.18, depthWrite: false }),
    hoverGood: new THREE.MeshBasicMaterial({ color: 0x6fb442, transparent: true, opacity: 0.28, depthWrite: false }),
    hoverBad:  new THREE.MeshBasicMaterial({ color: 0xc84848, transparent: true, opacity: 0.28, depthWrite: false }),
  };

  // ---------- tile factory ----------
  function makeTile() {
    const g = new THREE.Group();
    const dirt = new THREE.Mesh(roundedSlab(TILE * 0.98, DIRT_H, 0.06), M.dirt);
    dirt.position.y = -DIRT_H;
    g.add(dirt);
    const top = new THREE.Mesh(roundedSlab(TILE * 0.98, TOP_H, 0.06), M.grass);
    g.add(top);
    if (Math.random() < 0.22) {
      const fleck = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.04, 0.05), M.leavesDk);
      fleck.position.set((Math.random() - 0.5) * 0.6, TOP_H + 0.01, (Math.random() - 0.5) * 0.6);
      g.add(fleck);
    }
    castReceive(g);
    return g;
  }

  // ---------- building helpers ----------
  // Two slanted slabs that meet at the ridge to form a classic pitched roof.
  // `roofMat` is for the main pitched faces; `ridgeMat` (optional) caps the top.
  function pitchedRoof(width, depth, ridgeHeight, roofMat, ridgeMat, overhang = 0.06) {
    const g = new THREE.Group();
    const halfW = width / 2;
    const slope = Math.sqrt(halfW * halfW + ridgeHeight * ridgeHeight);
    const angle = Math.atan2(ridgeHeight, halfW);
    const t = 0.04;
    const slabL = slope + overhang;             // extends beyond the eave
    const slabD = depth + overhang * 1.6;
    // Left slope: tilted up-to-the-right. Its top-right edge lands exactly
    // at (0, ridgeHeight, 0); the bottom-left hangs past the wall as the eave.
    const left = new THREE.Mesh(new THREE.BoxGeometry(slabL, t, slabD), roofMat);
    left.rotation.z = angle;
    left.position.set(
      -(slabL / 2) * Math.cos(angle),
      ridgeHeight - (slabL / 2) * Math.sin(angle),
      0,
    );
    g.add(left);
    const right = new THREE.Mesh(new THREE.BoxGeometry(slabL, t, slabD), roofMat);
    right.rotation.z = -angle;
    right.position.set(
      (slabL / 2) * Math.cos(angle),
      ridgeHeight - (slabL / 2) * Math.sin(angle),
      0,
    );
    g.add(right);
    if (ridgeMat) {
      const ridge = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, 0.035, slabD * 0.96),
        ridgeMat,
      );
      ridge.position.y = ridgeHeight + 0.012;
      g.add(ridge);
    }
    return g;
  }
  // Triangular wall piece that fills the gable (the wall area under the roof).
  function gableWall(width, ridgeHeight, mat, thickness = 0.025) {
    const halfW = width / 2;
    const shape = new THREE.Shape();
    shape.moveTo(-halfW, 0);
    shape.lineTo(halfW, 0);
    shape.lineTo(0, ridgeHeight);
    shape.closePath();
    const geo = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false });
    geo.translate(0, 0, -thickness / 2);
    return new THREE.Mesh(geo, mat);
  }
  // A door with a darker frame around it.
  function makeFramedDoor(w, h, doorMat, frameMat) {
    const g = new THREE.Group();
    const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, h + 0.04, 0.025), frameMat);
    frame.position.z = 0;
    g.add(frame);
    const door = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.03), doorMat);
    door.position.z = 0.006;
    g.add(door);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.014, 8, 8), M.knob);
    knob.position.set(w * 0.32, -h * 0.04, 0.024);
    g.add(knob);
    return g;
  }
  // A window with a white frame and a cross mullion.
  function makeFramedWindow(w, h) {
    const g = new THREE.Group();
    const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.03, h + 0.03, 0.02), M.winFrame);
    g.add(frame);
    const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.018), M.winGlass);
    glass.position.z = 0.005;
    g.add(glass);
    // Cross mullion
    const vMul = new THREE.Mesh(new THREE.BoxGeometry(0.012, h, 0.022), M.winFrame);
    vMul.position.z = 0.008;
    g.add(vMul);
    const hMul = new THREE.Mesh(new THREE.BoxGeometry(w, 0.012, 0.022), M.winFrame);
    hMul.position.z = 0.008;
    g.add(hMul);
    return g;
  }

  // Palettes used to randomize the door + shutter colour per house, so each
  // placed house in the village looks subtly different.
  const HOUSE_PALETTES = [
    { door: 0xe87499, doorD: 0xb84e75, shutter: 0x6ab7d4 },  // pink + blue
    { door: 0x6ec07a, doorD: 0x408a4f, shutter: 0xe8a878 },  // mint + peach
    { door: 0x6ab7d4, doorD: 0x3a85a8, shutter: 0xe8a878 },  // blue + peach
    { door: 0xd4905a, doorD: 0xa86838, shutter: 0xb0d949 },  // orange + green
    { door: 0xc88adc, doorD: 0x9056a6, shutter: 0xffd56a },  // lilac + yellow
    { door: 0xf4a261, doorD: 0xb87435, shutter: 0xe5e0c0 },  // peach + cream
  ];
  const FLOWER_COLORS = [0xe87499, 0xffd56a, 0xff6b9d, 0xc88adc, 0xff7a4f, 0xffe89a];

  // A small wooden flowerbox sitting under a window, with cute spherical
  // flowers on top. Adds itself to `parent`.
  function addFlowerBox(parent, x, y, z) {
    const box = new THREE.Mesh(roundedBox(0.20, 0.05, 0.06, 0.018), M.flowerBox);
    box.position.set(x, y, z);
    parent.add(box);
    // Random flower picks for variety.
    const palette = [];
    for (let i = 0; i < 4; i++) {
      palette.push(FLOWER_COLORS[Math.floor(Math.random() * FLOWER_COLORS.length)]);
    }
    for (let i = 0; i < 4; i++) {
      const fx = x + (i - 1.5) * 0.048;
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.020, 8, 8), M.leafGreen);
      leaf.position.set(fx, y + 0.035, z);
      parent.add(leaf);
      const flower = new THREE.Mesh(
        new THREE.SphereGeometry(0.016, 8, 8),
        new THREE.MeshLambertMaterial({ color: palette[i] }),
      );
      flower.position.set(fx, y + 0.060, z);
      parent.add(flower);
    }
  }

  // Three puffy smoke balls rising from a chimney for that "casa con hogar
  // encendido" vibe.
  function addSmokeCurl(parent, x, y, z) {
    const s1 = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 10), M.smoke);
    s1.position.set(x - 0.01, y + 0.02, z + 0.01);
    parent.add(s1);
    const s2 = new THREE.Mesh(new THREE.SphereGeometry(0.045, 10, 10), M.smoke);
    s2.position.set(x + 0.04, y + 0.08, z - 0.02);
    parent.add(s2);
    const s3 = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 10), M.smokeDk);
    s3.position.set(x + 0.01, y + 0.13, z + 0.02);
    parent.add(s3);
  }

  // ---------- building builders ----------
  function makeHouse() {
    const g = new THREE.Group();
    const W = 0.70, D = 0.58, H = 0.38, RIDGE = 0.28;
    const baseY = 0.08;
    const pal = HOUSE_PALETTES[Math.floor(Math.random() * HOUSE_PALETTES.length)];
    const doorMat   = new THREE.MeshLambertMaterial({ color: pal.door });
    const doorDMat  = new THREE.MeshLambertMaterial({ color: pal.doorD });
    const shutterMat = new THREE.MeshLambertMaterial({ color: pal.shutter });

    // Soft rounded stone foundation
    const found = new THREE.Mesh(roundedBox(W + 0.08, 0.08, D + 0.08, 0.06), M.foundation);
    found.position.y = 0; g.add(found);
    // Chubby rounded walls
    const body = new THREE.Mesh(roundedBox(W, H, D, 0.07), M.wallCream);
    body.position.y = baseY; g.add(body);
    // Soft trim band at the top of the wall
    const trim = new THREE.Mesh(roundedBox(W + 0.025, 0.03, D + 0.025, 0.08), M.wallTrim);
    trim.position.y = baseY + H - 0.014; g.add(trim);
    // Triangular gables filling the wall up to the ridge
    const gF = gableWall(W, RIDGE, M.wallCream);
    gF.position.set(0, baseY + H, D / 2 - 0.012); g.add(gF);
    const gB = gableWall(W, RIDGE, M.wallCream);
    gB.position.set(0, baseY + H, -D / 2 + 0.012); g.add(gB);
    // Pitched roof with generous overhang
    const roof = pitchedRoof(W + 0.18, D, RIDGE, M.roofTile, M.roofTileD, 0.11);
    roof.position.y = baseY + H; g.add(roof);

    // Cute pill-shaped door (rounded all around) in a happy colour
    const doorH = 0.30;
    const doorFrame = new THREE.Mesh(roundedBox(0.22, doorH + 0.03, 0.025, 0.10), doorDMat);
    doorFrame.position.set(0, baseY + (doorH + 0.03) / 2 - 0.01, D / 2);

    // Two windows flanking the door, each with shutters and a flower box.
    function addWindowWithShutters(parent, x, y, z, w, h) {
      const win = makeFramedWindow(w, h);

      sR.position.set(x + (w / 2 + sw / 2 + 0.005), y, z + 0.012);
      parent.add(sR);
    }
    addWindowWithShutters(g, -0.22, baseY + 0.24, D / 2, 0.13, 0.13);
    addWindowWithShutters(g,  0.22, baseY + 0.24, D / 2, 0.13, 0.13);

    addFlowerBox(g, -0.22, baseY + 0.14, D / 2 + 0.04);
    addFlowerBox(g,  0.22, baseY + 0.14, D / 2 + 0.04);
    // Side window
    const winSide = makeFramedWindow(0.12, 0.13);
    winSide.rotation.y = Math.PI / 2;
    winSide.position.set(W / 2 + 0.005, baseY + 0.24, 0);
    g.add(winSide);

    // Brick chimney with rounded body + cap + smoke curl

    chimCap.position.set(chimX, baseY + H + 0.33, chimZ); g.add(chimCap);

    castReceive(g);

  function makeWindmill() {
    const g = new THREE.Group();
    // Foundation
    const found = new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.42, 0.06, 16), M.foundationD);
    found.position.y = 0.03; g.add(found);
    // Tapered stone tower
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.36, 0.78, 16), M.millStone);
    tower.position.y = 0.45; g.add(tower);
    // Mid-tower trim band (darker stone)
    const band = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.05, 16), M.millStoneD);
    band.position.y = 0.16; g.add(band);
    // Window slits (4 around the tower)
    for (let i = 0; i < 4; i++) {
      const slit = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.10, 0.04), M.winFrame);
      const a = (i / 4) * Math.PI * 2;
      slit.position.set(Math.cos(a) * 0.30, 0.52, Math.sin(a) * 0.30);
      slit.rotation.y = a;
      g.add(slit);
    }
    // Door
    const door = makeFramedDoor(0.14, 0.22, M.cabinDark, M.cabinRoofD);
    door.position.set(0, 0.18, 0.30);
    g.add(door);
    // Conical roof + cap
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.30, 0.26, 16), M.millRoof);
    roof.position.y = 0.97; g.add(roof);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 8), M.weatherVane);
    cap.position.y = 1.12; g.add(cap);
    // Blade hub at the front of the cone
    const bladePivot = new THREE.Group();
    bladePivot.position.set(0, 0.84, 0.30);
    g.add(bladePivot);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.06, 12), M.millFrame);
    hub.rotation.x = Math.PI / 2;
    bladePivot.add(hub);
    // Four blades: each is a wooden frame with an off-white sail
    for (let i = 0; i < 4; i++) {
      const arm = new THREE.Group();
      // Frame spar
      const spar = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.62, 0.03), M.millFrame);
      spar.position.y = 0.34;
      arm.add(spar);
      // Cross braces
      const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.018, 0.02), M.millFrame);
      c1.position.y = 0.18; arm.add(c1);
      const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.018, 0.02), M.millFrame);
      c2.position.y = 0.46; arm.add(c2);
      // Sail panel (canvas)
      const sail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.50, 0.018), M.millBlade);
      sail.position.set(0.07, 0.34, 0.005);
      arm.add(sail);
      arm.rotation.z = (i / 4) * Math.PI * 2;
      bladePivot.add(arm);
    }
    castReceive(g);
    g.userData = { kind: 'windmill', bladePivot };
    return g;
  }

  function makePond() {
    const g = new THREE.Group();
    // Square water slab sitting ON TOP of the grass tile so it reads as a
    // shallow body of water. Full TILE width with no rounding means adjacent
    // ponds merge into one continuous surface.
    const H = 0.07;
    const water = new THREE.Mesh(
      new THREE.BoxGeometry(TILE, H, TILE),
      M.water,
    );
    water.position.y = H / 2;             // bottom flush with grass top
    g.add(water);

    // One small surface shimmer in a random spot for life, sized so it
    // doesn't bleed past the tile (and break the merged look).
    const shimmerMat = new THREE.MeshBasicMaterial({
      color: 0xeaf6ff, transparent: true, opacity: 0.7,
    });
    const sx = (Math.random() - 0.5) * 0.55;
    const sz = (Math.random() - 0.5) * 0.55;
    const sw = 0.08 + Math.random() * 0.10;
    const sd = 0.022 + Math.random() * 0.018;
    const shimmer = new THREE.Mesh(
      new THREE.BoxGeometry(sw, 0.006, sd),
      shimmerMat,
    );
    shimmer.position.set(sx, H + 0.001, sz);
    g.add(shimmer);
    return g;
  }

  // ---------- building catalog ----------
  const BUILDINGS = {
    house:    { id: 'house',    label: 'Casa',      icon: '🏠', build: makeHouse },
    cabin:    { id: 'cabin',    label: 'Cabaña',    icon: '🛖', build: makeCabin },
    barn:     { id: 'barn',     label: 'Granero',   icon: '🚜', build: makeBarn },
    windmill: { id: 'windmill', label: 'Molino',    icon: '🌬️', build: makeWindmill },
    tree:     { id: 'tree',     label: 'Árbol',     icon: '🌳', build: makeTree },
    pine:     { id: 'pine',     label: 'Pino',      icon: '🌲', build: makePine },
    pond:     { id: 'pond',     label: 'Laguna',    icon: '💧', build: makePond },
    rocks:    { id: 'rocks',    label: 'Piedras',   icon: '🪨', build: makeRocks },
  };
  const TOOL_LIST = ['house', 'cabin', 'barn', 'windmill', 'tree', 'pine', 'pond', 'rocks'];

  // ---------- world state ----------
  // Build the world grid (tiles).
  const world = [];
  const worldGroup = new THREE.Group();
  scene.add(worldGroup);
  for (let x = 0; x < GRID; x++) {
    world[x] = [];
    for (let z = 0; z < GRID; z++) {
      const tile = makeTile();
      tile.position.set((x - (GRID - 1) / 2) * TILE, 0, (z - (GRID - 1) / 2) * TILE);
      worldGroup.add(tile);
      world[x][z] = { tile, placed: null /* { id, mesh } */ };
    }
  }

  function tilePos(x, z) {
    return new THREE.Vector3(
      (x - (GRID - 1) / 2) * TILE,
      0,
      (z - (GRID - 1) / 2) * TILE,
    );
  }

  // Hover preview tile.
  const hoverMesh = new THREE.Mesh(roundedSlab(TILE * 0.96, 0.05, 0.06), M.hoverGood);
  hoverMesh.position.y = TOP_H + 0.005;
  hoverMesh.visible = false;
  worldGroup.add(hoverMesh);

  // Ghost preview of the building under cursor.
  let ghost = null;
  let ghostToolId = null;
  function disposeGhost(g) {
    g.traverse(n => {
      if (n.isMesh && n.material) {
        if (Array.isArray(n.material)) n.material.forEach(m => m.dispose());
        else n.material.dispose();
      }
    });
  }
  function buildGhost(toolId) {
    const cfg = BUILDINGS[toolId];
    if (!cfg) return null;
    const g = cfg.build();
    g.traverse(n => {
      if (n.isMesh && n.material) {
        const tone = m => {
          const c = m.clone();
          c.transparent = true;
          c.opacity = 0.55;
          c.depthWrite = false;
          return c;
        };
        n.material = Array.isArray(n.material) ? n.material.map(tone) : tone(n.material);
        n.castShadow = false;
        n.receiveShadow = false;
      }
    });
    g.position.y = TOP_H;
    return g;
  }
  function ensureGhost() {
    if (STATE.selectedTool === ghostToolId) return ghost;
    if (ghost) { scene.remove(ghost); disposeGhost(ghost); ghost = null; }
    if (STATE.selectedTool && STATE.selectedTool !== 'demolish') {
      ghost = buildGhost(STATE.selectedTool);
      if (ghost) { ghost.visible = false; scene.add(ghost); }
    }
    ghostToolId = STATE.selectedTool;
    return ghost;
  }
  function setGhostOpacity(g, op) {
    if (!g || g.userData._lastOp === op) return;
    g.userData._lastOp = op;
    g.traverse(n => {
      if (n.isMesh && n.material) {
        const apply = m => { m.opacity = op; };
        if (Array.isArray(n.material)) n.material.forEach(apply);
        else apply(n.material);
      }
    });
  }

  // ---------- game state ----------
  const STATE = {
    selectedTool: null,
    placedCount: 0,
    windmills: [],
  };

  // ---------- placement / removal ----------
  function placeBuilding(toolId, x, z) {
    if (toolId === 'demolish') { demolish(x, z); return; }
    const cfg = BUILDINGS[toolId];
    if (!cfg) return;
    if (!world[x][z]) return;
    if (world[x][z].placed) return; // already occupied
    const mesh = cfg.build();
    const p = tilePos(x, z);
    mesh.position.set(p.x, TOP_H, p.z);
    // small random rotation for variety on non-symmetric objects
    if (toolId !== 'pond') mesh.rotation.y = (Math.random() - 0.5) * 0.4;
    // drop-in animation
    mesh.position.y = TOP_H + 1.0;
    mesh.userData._dropFrom = mesh.position.y;
    mesh.userData._dropT = 0;
    scene.add(mesh);
    world[x][z].placed = { id: toolId, mesh };
    STATE.placedCount++;
    if (toolId === 'windmill') STATE.windmills.push(mesh);
    updateCounter();
    saveWorld();
  }
  function demolish(x, z) {
    const cell = world[x][z];
    if (!cell || !cell.placed) return;
    const { id, mesh } = cell.placed;
    scene.remove(mesh);
    mesh.traverse(n => {
      if (n.isMesh && n.geometry && n.geometry.dispose && !sharedGeom(n.geometry)) n.geometry.dispose();
    });
    if (id === 'windmill') STATE.windmills = STATE.windmills.filter(m => m !== mesh);
    cell.placed = null;
    STATE.placedCount = Math.max(0, STATE.placedCount - 1);
    updateCounter();
    saveWorld();
  }
  function sharedGeom() { return false; } // every mesh creates its own geom in this build — safe to dispose.

  // ---------- persistence ----------
  function saveWorld() {
    const data = [];
    for (let x = 0; x < GRID; x++) {
      for (let z = 0; z < GRID; z++) {
        const c = world[x][z];
        if (c.placed) data.push([x, z, c.placed.id]);
      }
    }
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
  }
  function loadWorld() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      for (const [x, z, id] of data) {
        if (!BUILDINGS[id] || !world[x] || !world[x][z]) continue;
        const cfg = BUILDINGS[id];
        const mesh = cfg.build();
        const p = tilePos(x, z);
        mesh.position.set(p.x, TOP_H, p.z);
        // Pond should stay axis-aligned so adjacent water tiles read as one body.
        if (id !== 'pond') mesh.rotation.y = (Math.random() - 0.5) * 0.4;
        scene.add(mesh);
        world[x][z].placed = { id, mesh };
        if (id === 'windmill') STATE.windmills.push(mesh);
        STATE.placedCount++;
      }
      updateCounter();
    } catch {}
  }
  function clearWorld() {
    for (let x = 0; x < GRID; x++) {
      for (let z = 0; z < GRID; z++) {
        const c = world[x][z];
        if (c.placed) {
          scene.remove(c.placed.mesh);
          c.placed = null;
        }
      }
    }
    STATE.placedCount = 0;
    STATE.windmills = [];
    updateCounter();
    saveWorld();
  }

  // ---------- HUD ----------
  function updateCounter() {
    document.getElementById('placedCount').textContent = STATE.placedCount;
  }
  document.getElementById('resetBtn').addEventListener('click', () => {
    if (STATE.placedCount === 0) return;
    if (confirm('¿Borrar todo lo que construiste?')) clearWorld();
  });

  // ---------- dock UI ----------
  function buildDock() {
    const items = document.getElementById('dockItems');
    items.innerHTML = '';
    for (const id of TOOL_LIST) {
      const cfg = BUILDINGS[id];
      const btn = document.createElement('button');
      btn.className = 'dock-item';
      btn.dataset.tool = id;
      btn.innerHTML = `
        <div class="icon">${cfg.icon}</div>
        <div class="name">${cfg.label}</div>
      `;
      btn.addEventListener('click', () => selectTool(id));
      items.appendChild(btn);
    }
    // Demolish tool at the end.
    const dem = document.createElement('button');
    dem.className = 'dock-item demolish';
    dem.dataset.tool = 'demolish';
    dem.innerHTML = `
      <div class="icon">🧨</div>
      <div class="name">Demoler</div>
    `;
    dem.addEventListener('click', () => selectTool('demolish'));
    items.appendChild(dem);
  }
  function selectTool(id) {
    STATE.selectedTool = (STATE.selectedTool === id) ? null : id;
    document.querySelectorAll('.dock-item').forEach(it => {
      it.classList.toggle('active', it.dataset.tool === STATE.selectedTool);
    });
    renderer.domElement.classList.toggle('placing', !!STATE.selectedTool);
    // Refresh ghost / hover.
    ensureGhost();
    if (_lastPointer.x != null) updateHover(_lastPointer.x, _lastPointer.y);
  }

  // ---------- input: pan + zoom + click ----------
  const raycaster = new THREE.Raycaster();
  const pickPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -TOP_H);
  function pickGround(clientX, clientY) {
    const rect = renderer.domElement.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((clientX - rect.left) / rect.width) * 2 - 1,
      -((clientY - rect.top) / rect.height) * 2 + 1,
    );
    raycaster.setFromCamera(ndc, camera);
    const v = new THREE.Vector3();
    return raycaster.ray.intersectPlane(pickPlane, v) ? v : null;
  }
  function pickTile(clientX, clientY) {
    const w = pickGround(clientX, clientY);
    if (!w) return null;
    const x = Math.round(w.x / TILE + (GRID - 1) / 2);
    const z = Math.round(w.z / TILE + (GRID - 1) / 2);
    if (x < 0 || x >= GRID || z < 0 || z >= GRID) return null;
    return { x, z };
  }

  const _lastPointer = { x: null, y: null };
  let dragging = false, dragLast = null, dragMoved = false;
  const _panAnchor = { world: new THREE.Vector3(), target: new THREE.Vector3(), valid: false };

  renderer.domElement.addEventListener('pointerdown', e => {
    // Right click = demolish whatever's under the cursor (regardless of tool).
    if (e.button === 2) {
      const cell = pickTile(e.clientX, e.clientY);
      if (cell) demolish(cell.x, cell.z);
      return;
    }
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true;
    dragMoved = false;
    dragLast = { x: e.clientX, y: e.clientY };
    const w = pickGround(e.clientX, e.clientY);
    if (w) {
      _panAnchor.world.copy(w);
      _panAnchor.target.copy(target);
      _panAnchor.valid = true;
    } else _panAnchor.valid = false;
    renderer.domElement.classList.add('dragging');
    renderer.domElement.setPointerCapture(e.pointerId);
  });
  renderer.domElement.addEventListener('pointermove', e => {
    if (dragging) {
      const dx = e.clientX - dragLast.x, dy = e.clientY - dragLast.y;
      if (Math.hypot(dx, dy) > 4) dragMoved = true;
      if (dragMoved && _panAnchor.valid) {
        target.copy(_panAnchor.target);
        updateCamera();
        const cur = pickGround(e.clientX, e.clientY);
        if (cur) {
          target.x = _panAnchor.target.x + (_panAnchor.world.x - cur.x);
          target.z = _panAnchor.target.z + (_panAnchor.world.z - cur.z);
          const lim = GRID * 0.5;
          target.x = Math.max(-lim, Math.min(lim, target.x));
          target.z = Math.max(-lim, Math.min(lim, target.z));
          updateCamera();
        }
      }
    }
    updateHover(e.clientX, e.clientY);
  });
  renderer.domElement.addEventListener('pointerup', e => {
    if (dragging) {
      const wasMoved = dragMoved;
      dragging = false;
      dragMoved = false;
      _panAnchor.valid = false;
      renderer.domElement.classList.remove('dragging');
      try { renderer.domElement.releasePointerCapture(e.pointerId); } catch {}
      if (!wasMoved) handleClick(e.clientX, e.clientY);
    }
  });
  renderer.domElement.addEventListener('pointercancel', () => {
    dragging = false; dragMoved = false; _panAnchor.valid = false;
    renderer.domElement.classList.remove('dragging');
  });
  renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
  renderer.domElement.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = Math.sign(e.deltaY);
    const newView = Math.max(MIN_VIEW, Math.min(MAX_VIEW, viewSize + delta * 0.6));
    if (newView === viewSize) return;
    const before = pickGround(e.clientX, e.clientY);
    viewSize = newView;
    onResize();
    const after = before ? pickGround(e.clientX, e.clientY) : null;
    if (before && after) {
      target.x += (before.x - after.x);
      target.z += (before.z - after.z);
      const lim = GRID * 0.5;
      target.x = Math.max(-lim, Math.min(lim, target.x));
      target.z = Math.max(-lim, Math.min(lim, target.z));
      updateCamera();
    }
  }, { passive: false });

  function updateHover(clientX, clientY) {
    _lastPointer.x = clientX; _lastPointer.y = clientY;
    ensureGhost();
    const cell = pickTile(clientX, clientY);
    const overTile = !!cell;
    renderer.domElement.classList.toggle('over-tile', overTile && !!cell && !!world[cell.x][cell.z].placed && !STATE.selectedTool);
    if (!STATE.selectedTool) {
      hoverMesh.visible = false;
      if (ghost) ghost.visible = false;
      return;
    }
    if (!cell) {
      hoverMesh.visible = false;
      if (ghost) ghost.visible = false;
      return;
    }
    const p = tilePos(cell.x, cell.z);
    const occupied = !!world[cell.x][cell.z].placed;
    if (STATE.selectedTool === 'demolish') {
      hoverMesh.material = occupied ? M.hoverGood : M.hoverBad;
      hoverMesh.position.set(p.x, TOP_H + 0.005, p.z);
      hoverMesh.visible = true;
      if (ghost) ghost.visible = false;
      return;
    }
    const valid = !occupied;
    hoverMesh.material = valid ? M.hoverGood : M.hoverBad;
    hoverMesh.position.set(p.x, TOP_H + 0.005, p.z);
    hoverMesh.visible = true;
    if (ghost) {
      ghost.visible = true;
      ghost.position.set(p.x, TOP_H, p.z);
      setGhostOpacity(ghost, valid ? 0.55 : 0.20);
    }
  }
  function handleClick(clientX, clientY) {
    const cell = pickTile(clientX, clientY);
    if (!cell) return;
    if (!STATE.selectedTool) return;
    if (STATE.selectedTool === 'demolish') {
      demolish(cell.x, cell.z);
      // Refresh hover so the empty tile reads correctly.
      updateHover(clientX, clientY);
      return;
    }
    if (world[cell.x][cell.z].placed) return; // can't stack
    placeBuilding(STATE.selectedTool, cell.x, cell.z);
    updateHover(clientX, clientY);
  }

  // ---------- keyboard shortcuts ----------
  window.addEventListener('keydown', e => {
    if (e.repeat) return;
    if (e.key >= '1' && e.key <= '8') {
      const idx = parseInt(e.key, 10) - 1;
      const id = TOOL_LIST[idx];
      if (id) selectTool(id);
    } else if (e.key.toLowerCase() === 'd') {
      selectTool('demolish');
    } else if (e.key === 'Escape') {
      if (STATE.selectedTool) selectTool(STATE.selectedTool);
    }
  });

  // ---------- resize ----------
  function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    updateCamera();
  }
  window.addEventListener('resize', onResize);

  // ---------- animation loop ----------
  let prevT = 0;
  function animate(now) {
    requestAnimationFrame(animate);
    const t = now / 1000;
    const dt = prevT ? Math.min(t - prevT, 0.05) : 0;
    prevT = t;

    // Windmill blades spin.
    for (const m of STATE.windmills) {
      if (m.userData.bladePivot) m.userData.bladePivot.rotation.z = t * 0.8;
    }
    // Drop-in animation for newly placed buildings.
    scene.traverse(obj => {
      if (obj.userData && obj.userData._dropT != undefined) {
        obj.userData._dropT += dt;
        const T = 0.4;
        const k = Math.min(1, obj.userData._dropT / T);
        const ease = 1 - Math.pow(1 - k, 3);
        obj.position.y = TOP_H + (obj.userData._dropFrom - TOP_H) * (1 - ease);
        if (k >= 1) { delete obj.userData._dropT; delete obj.userData._dropFrom; }
      }
    });

    renderer.render(scene, camera);
  }

  // ---------- boot ----------
  buildDock();
  loadWorld();
  requestAnimationFrame(animate);
  </script>
</body>
</html>
