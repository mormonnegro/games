<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tiny World Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4ede0;
    --panel: #ffffff;
    --ink: #2a2722;
    --muted: #8a847a;
    --line: #ebe3d2;
    --line-soft: #f3ecdc;
    --accent: #3a72c8;
    --shadow: 0 18px 50px -20px rgba(50, 35, 10, 0.18), 0 2px 6px -2px rgba(50, 35, 10, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { position: fixed; inset: 0; z-index: 2; }
  canvas { display: block; cursor: grab; }
  canvas.placing { cursor: crosshair; }
  canvas.dragging { cursor: grabbing; }

  .brand {
    position: fixed;
    top: 26px; left: 28px;
    pointer-events: none;
    z-index: 10;
  }
  .brand .title {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 28px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand .title em {
    font-style: italic;
    font-weight: 400;
    color: #a08454;
  }
  .brand .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.02em;
  }

  /* -------- Sims-style bottom dock -------- */
  .dock {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 12;
    background: var(--panel);
    border-top: 1px solid var(--line);
    box-shadow: 0 -14px 40px -16px rgba(50, 35, 10, 0.18);
    display: flex;
    flex-direction: column;
    user-select: none;
  }
  .dock-tabs {
    display: flex;
    gap: 2px;
    padding: 8px 18px 0;
    border-bottom: 1px solid var(--line-soft);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .dock-tabs::-webkit-scrollbar { display: none; }
  .dock-tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 10px 16px 11px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    white-space: nowrap;
  }
  .dock-tab:hover { color: var(--ink); }
  .dock-tab.active {
    color: var(--ink);
    border-bottom-color: #d4a017;
  }
  .dock-items {
    display: flex;
    gap: 10px;
    padding: 12px 18px 14px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  .dock-item {
    position: relative;
    flex: 0 0 88px;
    height: 108px;
    background: var(--line-soft);
    border: 1px solid transparent;
    border-radius: 12px;
    padding: 6px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    transition: background 0.12s, border-color 0.12s, transform 0.08s, box-shadow 0.15s;
    font-family: inherit;
  }
  .dock-item:hover { background: #faf3e0; }
  .dock-item:active { transform: translateY(1px); }
  .dock-item.active {
    background: #fff;
    border-color: #d4a017;
    box-shadow: 0 6px 18px -6px rgba(212, 160, 23, 0.45);
  }
  .dock-item.disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .dock-item .disc {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #faf3e2, #ebe0c4);
    box-shadow: inset 0 -3px 6px rgba(120, 90, 30, 0.08),
                inset 0 2px 4px rgba(255, 255, 255, 0.6);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .dock-item canvas {
    width: 100%; height: 100%;
    display: block;
  }
  .dock-item .name {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink);
    margin-top: 4px;
    letter-spacing: 0.01em;
    line-height: 1.1;
  }
  .dock-item .cost {
    position: absolute;
    top: 4px; right: 5px;
    background: rgba(255,255,255,0.95);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 6px;
    font-size: 10px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .dock-item .cost.cant { color: #c84848; border-color: #e8c8c8; }
  .dock-item .limit {
    position: absolute;
    top: 4px; left: 5px;
    background: rgba(255,255,255,0.95);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 1px 6px;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .dock-item .limit.full { color: #c84848; border-color: #e8c8c8; }
  .dock-item.eraser .disc {
    background:
      repeating-linear-gradient(45deg,
        transparent, transparent 4px,
        rgba(120, 90, 30, 0.25) 4px, rgba(120, 90, 30, 0.25) 8px),
      radial-gradient(circle at 35% 30%, #faf3e2, #ebe0c4);
  }
  .dock-item.eraser canvas { display: none; }

  /* legacy .controls/.btn removed — Reset/Clear now live inside the HUD */

  /* -------- Combat mode -------- */
  .combat-btn {
    position: fixed;
    top: 26px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 11;
    background: #c84848;
    color: #fff;
    border: none;
    padding: 11px 22px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 8px 22px -8px rgba(200, 72, 72, 0.7), 0 1px 0 rgba(0,0,0,0.04);
    transition: transform 0.12s, background 0.15s, box-shadow 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .combat-btn .icon { font-size: 16px; }
  .combat-btn:hover { background: #b03c3c; transform: translateX(-50%) translateY(-1px); }
  .combat-btn:active { transform: translateX(-50%) translateY(1px); }
  body.combat .combat-btn { display: none; }

  .crosshair {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
    font-size: 28px;
    line-height: 1;
    pointer-events: none;
    z-index: 50;
    font-weight: 300;
    display: none;
  }
  body.combat .crosshair { display: block; }
  body.combat #app canvas { cursor: crosshair !important; }

  .combat-hud {
    position: fixed;
    top: 26px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 11;
    background: rgba(42, 39, 34, 0.92);
    color: #fff;
    border-radius: 14px;
    padding: 10px 16px;
    display: none;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }
  body.combat .combat-hud { display: flex; }
  .hearts { display: flex; gap: 3px; font-size: 18px; line-height: 1; }
  .heart.lost { opacity: 0.25; filter: grayscale(0.9); }
  .heart.bump { animation: heart-pop 0.4s ease-out; }
  @keyframes heart-pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .combat-stats {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .combat-stats b { font-weight: 700; }
  .cs-sep { opacity: 0.35; }
  .combat-exit {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: none;
    padding: 5px 11px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s;
  }
  .combat-exit:hover { background: rgba(255,255,255,0.22); }

  /* Hide farming UI while in combat */
  body.combat .missions,
  body.combat .dock,
  body.combat .help,
  body.combat .hud { display: none !important; }

  /* Damage vignette flashes red briefly when player gets hit */
  .damage-vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(200, 30, 30, 0.55) 100%);
    opacity: 0;
    z-index: 40;
    transition: opacity 0.12s;
  }
  .damage-vignette.flash { opacity: 1; transition: opacity 0.05s; }

  /* Game over */
  .game-over {
    position: fixed;
    inset: 0;
    background: rgba(20, 18, 14, 0.7);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .game-over.show { display: flex; }
  .game-over-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 36px;
    min-width: 320px;
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.4);
    text-align: center;
  }
  .game-over-card h2 {
    margin: 0 0 18px;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 32px;
    color: var(--ink);
    letter-spacing: -0.02em;
  }
  .go-stat {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-top: 1px solid var(--line-soft);
    font-size: 14px;
  }
  .go-stat span { color: var(--muted); }
  .go-stat b {
    font-size: 18px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .go-actions {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .go-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 11px 18px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.12s, transform 0.08s;
  }
  .go-btn:hover { background: #faf5ea; }
  .go-btn:active { transform: translateY(1px); }
  .go-btn.primary {
    background: #c84848;
    color: #fff;
    border-color: transparent;
  }
  .go-btn.primary:hover { background: #b03c3c; }


  .help {
    position: fixed;
    bottom: 178px; right: 28px;
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    line-height: 1.7;
    z-index: 10;
    pointer-events: none;
    opacity: 0.7;
  }
  @media (max-height: 760px) { .help { display: none; } }
  .help kbd {
    display: inline-block;
    padding: 1.5px 5px;
    border-radius: 4px;
    background: var(--panel);
    border: 1px solid var(--line);
    font-size: 10.5px;
    font-family: inherit;
    color: var(--ink);
    box-shadow: 0 1px 0 rgba(0,0,0,0.03);
  }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: multiply;
    z-index: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.3 0 0 0 0 0.15 0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* -------- HUD: top-right resource bar -------- */
  .hud {
    position: fixed;
    top: 26px;
    right: 28px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px 12px;
    z-index: 10;
    box-shadow: var(--shadow);
    min-width: 240px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .hud-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .hud-actions {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .hud-icon-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s, transform 0.08s;
    font-family: inherit;
  }
  .hud-icon-btn:hover { background: #faf5ea; color: var(--ink); }
  .hud-icon-btn:active { transform: translateY(1px); }
  .hud .res-row { display: flex; gap: 14px; justify-content: space-between; align-items: baseline; }
  .hud .res {
    display: flex;
    align-items: baseline;
    gap: 3px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    transition: color 0.2s;
  }
  .hud .res .ico { font-size: 13px; margin-right: 2px; }
  .hud .res .cap { color: var(--muted); font-weight: 500; font-size: 12px; }
  .hud .res.bump { animation: bump 0.3s ease-out; }
  @keyframes bump {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .hud .xp-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .hud .xp-bar {
    height: 6px;
    background: var(--line-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  .hud .xp-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #d4a017, #f0c641);
    transition: width 0.4s ease;
    border-radius: 3px;
  }
  .hud .xp-label {
    font-size: 10px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }

  /* -------- Missions panel (left side) -------- */
  .missions {
    position: fixed;
    top: 110px;
    left: 28px;
    width: 280px;
    max-height: calc(100vh - 320px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px 12px;
    z-index: 10;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
  }
  .missions-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .missions-header h3 {
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .missions-header h3 em {
    font-style: italic;
    font-weight: 400;
    color: #d4a017;
  }
  .missions-counter {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .missions-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .mission {
    position: relative;
    background: var(--line-soft);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 10px 12px;
    transition: opacity 0.25s, transform 0.25s, background 0.18s, border-color 0.18s;
  }
  .mission.locked {
    opacity: 0.55;
  }
  .mission.active {
    background: #fff8e6;
    border-color: #f0d97a;
    box-shadow: 0 4px 14px -8px rgba(212, 160, 23, 0.55);
  }
  .mission.completing {
    opacity: 0;
    transform: translateX(-12px);
  }
  .mission-row {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .mission-icon {
    font-size: 20px;
    line-height: 1;
    flex-shrink: 0;
  }
  .mission-body { flex: 1; min-width: 0; }
  .mission-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.25;
    letter-spacing: 0.005em;
  }
  .mission-hint {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.3;
    display: none;
  }
  .mission.active .mission-hint { display: block; }
  .mission-bar {
    height: 4px;
    background: rgba(0,0,0,0.05);
    border-radius: 2px;
    margin-top: 7px;
    overflow: hidden;
  }
  .mission-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #6fb442, #a8d96a);
    transition: width 0.4s ease;
    border-radius: 2px;
  }
  .mission-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 5px;
    font-size: 10.5px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .mission-progress { font-weight: 600; }
  .mission-reward {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    background: rgba(212, 160, 23, 0.12);
    color: #8a6610;
    padding: 1px 6px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 10px;
  }
  .mission.locked .mission-bar,
  .mission.locked .mission-meta { display: none; }
  .mission .lock-icon {
    color: var(--muted);
    font-size: 11px;
    margin-left: auto;
  }

  /* Floating placement feedback */
  .float-text {
    position: fixed;
    pointer-events: none;
    font-size: 14px;
    font-weight: 700;
    color: #6fb442;
    text-shadow: 0 1px 2px rgba(255,255,255,0.8), 0 0 8px rgba(255,255,255,0.5);
    z-index: 60;
    transform: translate(-50%, 0);
    animation: float-up 1s ease-out forwards;
    font-variant-numeric: tabular-nums;
  }
  @keyframes float-up {
    0%   { transform: translate(-50%, 0) scale(0.9); opacity: 0; }
    15%  { transform: translate(-50%, -8px) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -55px) scale(0.95); opacity: 0; }
  }

  /* Goal/milestone toasts */
  .toasts {
    position: fixed;
    top: 90px; left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    pointer-events: none;
  }
  .toast {
    background: var(--ink);
    color: #fff;
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    box-shadow: var(--shadow);
    animation: toast-in 0.3s ease-out, toast-out 0.4s ease-in 2.6s forwards;
    white-space: nowrap;
  }
  .toast .icon { margin-right: 8px; font-size: 14px; }
  @keyframes toast-in {
    from { transform: translateY(-12px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  @keyframes toast-out {
    to { transform: translateY(-12px); opacity: 0; }
  }

  @media (max-width: 600px) {
    .brand .title { font-size: 22px; }
    .help { display: none; }
    .brand { top: 16px; left: 16px; }
    .brand .sub { display: none; }
    .hud { top: 16px; right: 16px; left: auto; min-width: 0; padding: 8px 10px 10px; }
    .hud-actions { display: none; }
    .hud .res { font-size: 12.5px; }
    .missions { top: auto; bottom: 200px; left: 16px; right: 16px; width: auto; max-height: 35vh; padding: 10px 12px; }
    .missions .mission { padding: 8px 10px; }
    .missions-header h3 { font-size: 15px; }
    .toasts { top: auto; bottom: 200px; }
    .dock-tabs { padding: 6px 12px 0; }
    .dock-tab { padding: 8px 10px 9px; font-size: 12px; }
    .dock-items { padding: 10px 12px 12px; gap: 8px; }
    .dock-item { flex: 0 0 78px; height: 100px; }
    .dock-item .disc { width: 54px; height: 54px; }
    .dock-item .name { font-size: 10.5px; }
  }
  /* Old catalog selectors kept as no-ops in case external markup lingers. */
  .catalog, .catalog-toggle, .catalog-backdrop { display: none !important; }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="brand">
    <div class="title">Tiny World <em>Builder</em></div>
    <div class="sub">Click to place · drag to orbit · scroll to zoom</div>
  </div>

  <div class="toolbar" id="toolbar" style="display:none"></div>

  <!-- Combat mode UI -->
  <button class="combat-btn" id="combatBtn" title="Enter combat mode">
    <span class="icon">⚔️</span> Combat
  </button>
  <div class="crosshair" id="crosshair">+</div>
  <div class="damage-vignette" id="damageVignette"></div>
  <div class="combat-hud" id="combatHud">
    <div class="hearts" id="hearts"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
  /* =====================================================================
     Tiny World Builder — single-file Three.js scene + tile editor
     ===================================================================== */

  // Helper defensivo para añadir listeners (evita TypeError si el elemento
  // no existe en el DOM). Lo declaramos primero para que todo el resto del
  // script lo pueda usar.
  function on(id, event, handler) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(event, handler);
  }

  // Wrappear getElementById para que NUNCA devuelva null. Si el elemento no
  // existe, devolvemos un proxy no-op que absorbe addEventListener, classList,
  // setPointerCapture y demás métodos comunes sin fallar. Esto evita que un
  // listener colgante a un elemento eliminado del DOM rompa todo el script.
  const _getById = document.getElementById.bind(document);
  const noopEl = new Proxy({}, {
    get(_t, prop) {
      if (prop === 'classList') return { add(){}, remove(){}, toggle(){}, contains(){ return false; } };
      if (prop === 'style') return new Proxy({}, { set(){ return true; }, get(){ return ''; } });
      if (prop === 'dataset') return {};
      // Cualquier método devuelve una función no-op; cualquier propiedad escalar devuelve ''
      return typeof prop === 'string' ? () => {} : undefined;
    },
    set() { return true; },
  });
  document.getElementById = function(id) {
    return _getById(id) || noopEl;
  };

  // -------- constants --------
  const GRID = 16;
  const TILE = 1;
  const TOP_H = 0.18;     // grass slab thickness
  const DIRT_H = 0.55;    // dirt block height (visible side)

  // -------- scene / renderer --------
  const container = document.getElementById('app');
  const canvasEl = document.createElement('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf4ede0);

  // -------- camera (perspective) --------
  let viewSize = 13;
  const aspect0 = window.innerWidth / window.innerHeight;
  // narrow FOV + far distance gives the "miniature/telephoto" look that
  // sits closest to the iso aesthetic while still showing real depth.
  const persCam = new THREE.PerspectiveCamera(28, aspect0, 0.1, 200);
  const camera = persCam;

  // orbit state — `azimuth`/`polar` son el valor renderizado actual,
  // `targetAzimuth`/`targetPolar` son el objetivo que el usuario está arrastrando.
  // Cada frame el valor renderizado se interpola hacia el objetivo con un
  // factor de damping, lo que da una sensación suave en vez de saltos directos.
  let azimuth = Math.PI * 0.25;
  let polar   = Math.PI * 0.32;
  let targetAzimuth = azimuth;
  let targetPolar   = polar;
  let targetViewSize;                 // se inicializa después de declarar viewSize
  const ORBIT_DAMPING = 0.18;         // 0 = no se mueve, 1 = salto inmediato
  const ZOOM_DAMPING  = 0.35;
  const target = new THREE.Vector3(0, 0, 0);

  function updateCamera() {
    // radius scales with viewSize so wheel-zoom moves the camera in/out.
    const r = viewSize * 4.2;
    camera.position.x = target.x + r * Math.sin(polar) * Math.cos(azimuth);
    camera.position.y = target.y + r * Math.cos(polar);
    camera.position.z = target.z + r * Math.sin(polar) * Math.sin(azimuth);
    camera.lookAt(target);
  }
  updateCamera();

  // -------- modo walk: tercera persona con personaje --------
  // Personaje estilo bloky a juego con la estética del mundo. Lo construimos
  // como un Group con sub-meshes nombrados para poder animarlos (caminar,
  // saltar). Origen del grupo: en los pies, mirando -z.
  const playerMats = {
    skin:  new THREE.MeshLambertMaterial({ color: 0xf2c8a0 }),
    shirt: new THREE.MeshLambertMaterial({ color: 0x4a90e2 }),
    pants: new THREE.MeshLambertMaterial({ color: 0x6b4423 }),
    hair:  new THREE.MeshLambertMaterial({ color: 0x3a2418 }),
    shoes: new THREE.MeshLambertMaterial({ color: 0x2a1e14 }),
  };

  function makePlayer() {
    const p = new THREE.Group();

    // Piernas: cada una es un grupo cuyo origen está en la CADERA (arriba),
    // con el mesh de la pierna colgando hacia abajo desde ahí. Así al rotar
    // el grupo, la pierna oscila como un péndulo desde la cadera.
    function makeLeg() {
      const leg = new THREE.Group();
      const legMesh = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.22, 0.10), playerMats.pants);
      legMesh.position.y = -0.11;          // cuelga 0.11 hacia abajo desde el origen
      leg.add(legMesh);
      const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.14), playerMats.shoes);
      shoe.position.set(0, -0.245, 0.02);  // bajo la pierna
      leg.add(shoe);
      return leg;
    }
    const legL = makeLeg(); legL.position.set(-0.06, 0.22, 0); p.add(legL);
    const legR = makeLeg(); legR.position.set( 0.06, 0.22, 0); p.add(legR);

    // Torso (origen en el centro del torso)
    const torso = new THREE.Mesh(roundedBox(0.26, 0.28, 0.16, 0.03), playerMats.shirt);
    torso.position.set(0, 0.36, 0); p.add(torso);

    // Brazos: mismo principio que las piernas — pivote en el HOMBRO.
    function makeArm() {
      const arm = new THREE.Group();
      const armMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.24, 0.08), playerMats.shirt);
      armMesh.position.y = -0.12;
      arm.add(armMesh);
      const hand = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.08), playerMats.skin);
      hand.position.y = -0.27;
      arm.add(hand);
      return arm;
    }
    const armL = makeArm(); armL.position.set(-0.17, 0.50, 0); p.add(armL);
    const armR = makeArm(); armR.position.set( 0.17, 0.50, 0); p.add(armR);

    // Cabeza
    const head = new THREE.Mesh(roundedBox(0.22, 0.22, 0.22, 0.03), playerMats.skin);
    head.position.set(0, 0.62, 0); p.add(head);

    // Pelo (gorra simple)
    const hair = new THREE.Mesh(roundedBox(0.24, 0.08, 0.24, 0.03), playerMats.hair);
    hair.position.set(0, 0.74, 0); p.add(hair);

    // Ojos
    const eyeGeo = new THREE.BoxGeometry(0.025, 0.025, 0.01);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x1a1410 });
    const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.05, 0.64, -0.111); p.add(eyeL);
    const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set( 0.05, 0.64, -0.111); p.add(eyeR);

    // Sombra circular
    const shadowGeo = new THREE.CircleGeometry(0.18, 16);
    const shadowMat = new THREE.MeshBasicMaterial({
      color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false
    });
    const shadow = new THREE.Mesh(shadowGeo, shadowMat);
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.005;
    p.add(shadow);

    p.traverse(c => {
      if (c.isMesh && c !== shadow) { c.castShadow = true; c.receiveShadow = true; }
    });

    p.userData = { legL, legR, armL, armR, shadow };
    return p;
  }

  const player = makePlayer();
  player.visible = false;
  scene.add(player);

  const fpsCam = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
  let fpsActive = false;
  const fpsState = {
    pos: new THREE.Vector3(0, 0, 0),         // posición del personaje (pies)
    yaw: Math.PI,                            // dirección del personaje (rad)
    velocityY: 0,                            // velocidad vertical (para salto)
    onGround: true,
    // La cámara orbita alrededor del personaje
    camYaw: Math.PI,                         // dirección horizontal de la cámara
    camPitch: 0.55,                          // ángulo vertical (hacia abajo)
    camDistance: 3.2,                        // distancia detrás del personaje
    height: 0,                               // altura sobre el TOP_H del tile (0 = pies en el suelo)
    radius: 0.18,
    moveSpeed: 2.6,
    runMul: 1.7,
    jumpSpeed: 4.0,
    gravity: -12.0,
    keys: { w: false, a: false, s: false, d: false, shift: false },
    touchMove: { x: 0, y: 0 },
    touchLook: { dx: 0, dy: 0 },             // delta acumulado del frame
    lookSensitivity: 0.0035,
    walkPhase: 0,                            // para animación de caminar
  };

  // -------- lighting --------
  // Neutral hemisphere — warm sky was dyeing everything cream-yellow.
  const hemi = new THREE.HemisphereLight(0xffffff, 0xb39879, 0.30);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffffff, 1.0);
  sun.position.set(7, 12, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -18;
  sun.shadow.camera.right = 18;
  sun.shadow.camera.top = 18;
  sun.shadow.camera.bottom = -18;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 50;
  sun.shadow.bias = -0.0006;
  sun.shadow.radius = 3;
  scene.add(sun);
  // No ambient — hemi handles fill, ambient just compresses contrast & saturation.

  // -------- geometry helpers --------
  // A rounded extruded slab — used for tile pieces.
  function roundedSlab(size, height, radius = 0.07) {
    const w = size / 2;
    const r = Math.min(radius, w - 0.01);
    const shape = new THREE.Shape();
    shape.moveTo(-w + r, -w);
    shape.lineTo(w - r, -w);
    shape.quadraticCurveTo(w, -w, w, -w + r);
    shape.lineTo(w, w - r);
    shape.quadraticCurveTo(w, w, w - r, w);
    shape.lineTo(-w + r, w);
    shape.quadraticCurveTo(-w, w, -w, w - r);
    shape.lineTo(-w, -w + r);
    shape.quadraticCurveTo(-w, -w, -w + r, -w);

    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: height,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 0.04,
      bevelThickness: 0.04,
      curveSegments: 4
    });
    geo.rotateX(-Math.PI / 2);
    // After rotation Y spans [0, height]
    return geo;
  }

  // A rounded box — for some objects we want a softer cube look.
  function roundedBox(w, h, d, r = 0.05) {
    const shape = new THREE.Shape();
    const hw = w / 2, hd = d / 2;
    const rr = Math.min(r, hw - 0.001, hd - 0.001);
    shape.moveTo(-hw + rr, -hd);
    shape.lineTo(hw - rr, -hd);
    shape.quadraticCurveTo(hw, -hd, hw, -hd + rr);
    shape.lineTo(hw, hd - rr);
    shape.quadraticCurveTo(hw, hd, hw - rr, hd);
    shape.lineTo(-hw + rr, hd);
    shape.quadraticCurveTo(-hw, hd, -hw, hd - rr);
    shape.lineTo(-hw, -hd + rr);
    shape.quadraticCurveTo(-hw, -hd, -hw + rr, -hd);
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: h,
      bevelEnabled: true,
      bevelSegments: 1,
      bevelSize: 0.02,
      bevelThickness: 0.02,
      curveSegments: 3
    });
    geo.rotateX(-Math.PI / 2);
    geo.translate(0, 0, 0);
    return geo;
  }

  // -------- materials --------
  // Lambert (not Standard): non-PBR diffuse only, much more direct color response.
  // Stylized low-poly looks better with flat shading than physical energy conservation.
  const M = {
    grass:     new THREE.MeshLambertMaterial({ color: 0xb0d949 }),
    grassEdge: new THREE.MeshLambertMaterial({ color: 0x95c138 }),
    dirt:      new THREE.MeshLambertMaterial({ color: 0x7d4519 }),
    dirtRich:  new THREE.MeshLambertMaterial({ color: 0x462b15 }),
    path:      new THREE.MeshLambertMaterial({ color: 0xf2d29c }),
    water:     new THREE.MeshLambertMaterial({ color: 0x3a8fcc }),

    trunk:     new THREE.MeshLambertMaterial({ color: 0x5c3818 }),
    leaves:    new THREE.MeshLambertMaterial({ color: 0x86d139 }),
    leavesDk:  new THREE.MeshLambertMaterial({ color: 0x5fab26 }),

    wallCream: new THREE.MeshLambertMaterial({ color: 0xf2dfb0 }),
    wallTrim:  new THREE.MeshLambertMaterial({ color: 0xe5cf99 }),
    roofBlue:  new THREE.MeshLambertMaterial({ color: 0x2a6dd1 }),
    roofBlueD: new THREE.MeshLambertMaterial({ color: 0x1d4d9c }),
    door:      new THREE.MeshLambertMaterial({ color: 0x7a4a2e }),
    woodTrim:  new THREE.MeshLambertMaterial({ color: 0x5c3818 }),
    windowB:   new THREE.MeshLambertMaterial({ color: 0x2a6dd1 }),
    chimney:   new THREE.MeshLambertMaterial({ color: 0xc9c4ba }),
    step:      new THREE.MeshLambertMaterial({ color: 0xa9a49a }),
    knob:      new THREE.MeshLambertMaterial({ color: 0xe8c050 }),

    fence:     new THREE.MeshLambertMaterial({ color: 0x7d4519 }),
    cropLeaf:  new THREE.MeshLambertMaterial({ color: 0x96d943 }),
    cropStem:  new THREE.MeshLambertMaterial({ color: 0x5e9c2e }),

    millStone: new THREE.MeshLambertMaterial({ color: 0xe8dfc8 }),
    millStoneD:new THREE.MeshLambertMaterial({ color: 0xc4b893 }),
    millRoof:  new THREE.MeshLambertMaterial({ color: 0x8a3d2a }),
    millBlade: new THREE.MeshLambertMaterial({ color: 0xf2dfb0 }),
    millFrame: new THREE.MeshLambertMaterial({ color: 0x5c3818 }),

    barnRed:   new THREE.MeshLambertMaterial({ color: 0xa83828 }),
    barnRedD:  new THREE.MeshLambertMaterial({ color: 0x7d2a1c }),
    barnRoof:  new THREE.MeshLambertMaterial({ color: 0x3a2418 }),
    barnRoofD: new THREE.MeshLambertMaterial({ color: 0x251610 }),
    barnTrim:  new THREE.MeshLambertMaterial({ color: 0xf2ece0 }),
    barnHay:   new THREE.MeshLambertMaterial({ color: 0xd4a04c }),

    hover:     new THREE.MeshBasicMaterial({ color: 0x2a2722, transparent: true, opacity: 0.18, depthWrite: false }),
    hoverErase:new THREE.MeshBasicMaterial({ color: 0xb84838, transparent: true, opacity: 0.28, depthWrite: false }),
  };

  function castReceive(obj) {
    obj.traverse(c => {
      if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
    });
    return obj;
  }

  // -------- tile factory --------
  function makeTile(terrain) {
    const g = new THREE.Group();
    g.userData = { kind: 'tile', terrain };

    // dirt block (sides + bottom of tile)
    const dirt = new THREE.Mesh(roundedSlab(TILE * 0.98, DIRT_H, 0.06), M.dirt);
    dirt.position.y = -DIRT_H;
    g.add(dirt);

    // top cap
    let topMat = M.grass;
    if (terrain === 'path')  topMat = M.path;
    if (terrain === 'water') topMat = M.water;
    if (terrain === 'dirt')  topMat = M.dirtRich;

    const top = new THREE.Mesh(roundedSlab(TILE * 0.98, TOP_H, 0.06), topMat);
    top.position.y = 0;
    g.add(top);

    // tiny grass details on grass tiles (very subtle)
    if (terrain === 'grass' && Math.random() < 0.18) {
      const fleck = new THREE.Mesh(
        new THREE.BoxGeometry(0.05, 0.04, 0.05),
        M.leavesDk
      );
      fleck.position.set((Math.random() - 0.5) * 0.6, TOP_H + 0.01, (Math.random() - 0.5) * 0.6);
      g.add(fleck);
    }

    // path scuff: little dimple on path tiles
    if (terrain === 'path') {
      const scuff = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.02, 0.08),
        new THREE.MeshStandardMaterial({ color: 0xd4be8c, roughness: 0.95 })
      );
      scuff.position.set((Math.random() - 0.5) * 0.4, TOP_H + 0.005, (Math.random() - 0.5) * 0.4);
      g.add(scuff);
    }

    castReceive(g);
    return g;
  }

  // -------- object factories --------
  function makeTree() {
    const g = new THREE.Group();

    const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.5, 0.18), M.trunk);
    trunk.position.y = 0.25;
    g.add(trunk);

    const lower = new THREE.Mesh(roundedBox(0.62, 0.42, 0.62, 0.08), M.leaves);
    lower.position.y = 0.5;
    g.add(lower);

    const upper = new THREE.Mesh(roundedBox(0.42, 0.32, 0.42, 0.06), M.leaves);
    upper.position.y = 0.92;
    g.add(upper);

    const tip = new THREE.Mesh(roundedBox(0.22, 0.18, 0.22, 0.04), M.leaves);
    tip.position.y = 1.18;
    g.add(tip);

    g.userData = { kind: 'tree', swayPhase: Math.random() * Math.PI * 2 };
    castReceive(g);
    return g;
  }

  // -------- house primitives + assembler --------
  // The house is decomposed into reusable parts. A "house plan" describes
  // which face each cell of a cluster presents (gable door at one end,
  // side doors elsewhere) and the assembler builds the geometry from
  // primitive parts. Both solo and cluster houses go through the same path,
  // so adding new shapes (L-cluster, square, etc.) only needs new plans.

  const H = {
    WALL_W: 0.82,        // short-axis wall width
    WALL_H: 0.55,        // wall height to eaves
    PEAK_Y: 0.87,        // ridge apex
    T:      0.06,        // roof slab thickness
    ROOF_OVERHANG: 0.3,  // roof depth = WALL_D + this (extends past long-axis ends)
  };

  const Parts = {
    // Wall volume — rounded box covering the cluster's long-axis extent.
    walls(WALL_D) {
      return new THREE.Mesh(roundedBox(H.WALL_W, H.WALL_H, WALL_D, 0.04), M.wallCream);
    },

    // Triangular gable panel (in XY plane, 0.04 thick in z). Caller positions.
    gable() {
      const shape = new THREE.Shape();
      shape.moveTo(-H.WALL_W / 2, H.WALL_H);
      shape.lineTo( H.WALL_W / 2, H.WALL_H);
      shape.lineTo(0, H.PEAK_Y);
      shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.04, bevelEnabled: false, curveSegments: 1 });
      return new THREE.Mesh(geo, M.wallCream);
    },

    // Pitched roof: two slabs whose bottom faces sit along the gable hypotenuse,
    // plus a ridge cap. Origin at house centre. Front/back overhang can be set
    // asymmetrically — composite wings pass backOverhang=0 so the wing's inside
    // end doesn't poke through the main wing's roof.
    pitchedRoof(WALL_D, frontOverhang = 0.15, backOverhang = 0.15) {
      const g = new THREE.Group();
      const halfW = H.WALL_W / 2;
      const ROOF_DEPTH = WALL_D + frontOverhang + backOverhang;
      const ROOF_Z     = (frontOverhang - backOverhang) / 2; // shift centre when asymmetric
      const rise = H.PEAK_Y - H.WALL_H;
      const slabLen   = Math.sqrt(halfW * halfW + rise * rise);
      const slabAngle = Math.atan2(rise, halfW);
      const sa = Math.sin(slabAngle), ca = Math.cos(slabAngle);
      const slabGeo = new THREE.BoxGeometry(slabLen, H.T, ROOF_DEPTH);

      const slabL = new THREE.Mesh(slabGeo, M.roofBlue);
      slabL.position.set(-halfW / 2 - (H.T / 2) * sa, (H.WALL_H + H.PEAK_Y) / 2 + (H.T / 2) * ca, ROOF_Z);
      slabL.rotation.z = slabAngle;
      g.add(slabL);

      const slabR = new THREE.Mesh(slabGeo, M.roofBlue);
      slabR.position.set( halfW / 2 + (H.T / 2) * sa, (H.WALL_H + H.PEAK_Y) / 2 + (H.T / 2) * ca, ROOF_Z);
      slabR.rotation.z = -slabAngle;
      g.add(slabR);

      const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.06, ROOF_DEPTH + 0.02), M.roofBlueD);
      ridge.position.set(0, H.PEAK_Y + (H.T / 2) * ca + 0.005, ROOF_Z);
      g.add(ridge);
      return g;
    },

    // Hipped (pyramidal) roof — 4 triangular slabs meeting at a central apex.
    // Used for square / 2x2 footprints. Origin at base centre, base at y=0,
    // apex at y=rise. Built as a BufferGeometry pyramid with computed normals.
    hippedRoof(width, depth, rise) {
      const halfW = width / 2;
      const halfD = depth / 2;
      const verts = new Float32Array([
        0,      rise, 0,        // 0: apex
        -halfW, 0,    -halfD,   // 1: NW
         halfW, 0,    -halfD,   // 2: NE
         halfW, 0,     halfD,   // 3: SE
        -halfW, 0,     halfD,   // 4: SW
      ]);
      // CCW winding from outside (verified by cross-product: each face's outward
      // normal points away from the apex with the correct sign).
      const indices = new Uint16Array([
        0, 2, 1,  // north face (apex, ne, nw) — outward normal -z
        0, 3, 2,  // east face  (apex, se, ne) — outward normal +x
        0, 4, 3,  // south face (apex, sw, se) — outward normal +z
        0, 1, 4,  // west face  (apex, nw, sw) — outward normal -x
      ]);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
      geo.setIndex(new THREE.BufferAttribute(indices, 1));
      geo.computeVertexNormals();
      return new THREE.Mesh(geo, M.roofBlue);
    },

    // Door + arches + knob. orientation:
    //   'gable' — door faces +z, outer face at z=0 of the part's local frame.
    //   'side'  — door faces +x, outer face at x=0.
    // Origin is at GROUND LEVEL beneath the door's outer face centre, so callers
    // place a door by setting its position to where the door's centre projects on the floor.
    door(orientation) {
      const g = new THREE.Group();
      if (orientation === 'gable') {
        const door = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.48, 0.04), M.door);
        door.position.set(0, 0.24, 0); g.add(door);
        const aL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.48, 0.04), M.woodTrim); aL.position.set(-0.10, 0.24, 0.01); g.add(aL);
        const aR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.48, 0.04), M.woodTrim); aR.position.set( 0.10, 0.24, 0.01); g.add(aR);
        const aT = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.04, 0.04), M.woodTrim); aT.position.set(0,     0.50, 0.01); g.add(aT);
        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), M.knob);
        knob.position.set(0.08, 0.24, 0.03); g.add(knob);
      } else {
        const door = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.48, 0.2), M.door);
        door.position.set(0, 0.24, 0); g.add(door);
        const aL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.48, 0.04), M.woodTrim); aL.position.set(0.01, 0.24, -0.10); g.add(aL);
        const aR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.48, 0.04), M.woodTrim); aR.position.set(0.01, 0.24,  0.10); g.add(aR);
        const aT = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.24), M.woodTrim); aT.position.set(0.01, 0.50,  0   ); g.add(aT);
        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), M.knob);
        knob.position.set(0.03, 0.24, 0.05); g.add(knob);
      }
      return g;
    },

    // Window with frame, glass and cross trims, layered along the outer-face axis.
    // Origin at the FRAME CENTRE; callers place by setting position to where the
    // frame's centre should sit on the wall surface.
    window(orientation, size = 'large') {
      const g = new THREE.Group();
      const f = size === 'small' ? 0.20 : 0.24; // frame
      const p = size === 'small' ? 0.14 : 0.17; // glass / cross length
      if (orientation === 'gable') {
        const wf = new THREE.Mesh(new THREE.BoxGeometry(f, f, 0.04),       M.woodTrim); wf.position.set(0, 0, 0);     g.add(wf);
        const wg = new THREE.Mesh(new THREE.BoxGeometry(p, p, 0.04),       M.windowB);  wg.position.set(0, 0, 0.015); g.add(wg);
        const cH = new THREE.Mesh(new THREE.BoxGeometry(p, 0.012, 0.04),   M.woodTrim); cH.position.set(0, 0, 0.025); g.add(cH);
        const cV = new THREE.Mesh(new THREE.BoxGeometry(0.012, p, 0.04),   M.woodTrim); cV.position.set(0, 0, 0.025); g.add(cV);
      } else {
        const wf = new THREE.Mesh(new THREE.BoxGeometry(0.04, f, f),       M.woodTrim); wf.position.set(0,     0, 0); g.add(wf);
        const wg = new THREE.Mesh(new THREE.BoxGeometry(0.04, p, p),       M.windowB);  wg.position.set(0.015, 0, 0); g.add(wg);
        const cH = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.012, p),   M.woodTrim); cH.position.set(0.025, 0, 0); g.add(cH);
        const cV = new THREE.Mesh(new THREE.BoxGeometry(0.04, p, 0.012),   M.woodTrim); cV.position.set(0.025, 0, 0); g.add(cV);
      }
      return g;
    },

    // Chimney stack. Origin at chimney CENTRE in y (so a position of y=0.85 puts
    // the bottom inside the wall and the top at y=1.15).
    chimney() {
      return new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.6, 0.14), M.chimney);
    },

    // Doorstep slab. Origin at step CENTRE.
    step(orientation) {
      return orientation === 'side'
        ? new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.26), M.step)
        : new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.06, 0.12), M.step);
    },

    // External staircase — chunky stylized stair climbing toward -z and +y
    // from the part's origin (placed at the bottom-front of the lowest step).
    // 6 steps; each step is full stepRise tall (no y overlap) but 1.4x wide
    // in depth so consecutive steps visually overlap in z.
    externalStairs(rise) {
      const g = new THREE.Group();
      const N = 6;
      const stepRise = rise / N;
      const stepRun  = 0.10;
      const width    = 0.22;
      for (let i = 0; i < N; i++) {
        const s = new THREE.Mesh(
          new THREE.BoxGeometry(width, stepRise, stepRun * 1.4),
          M.step
        );
        s.position.set(0, stepRise * (i + 0.5), -i * stepRun);
        g.add(s);
      }
      return g;
    },

    // Upper-floor door reached by external stairs. Same geometry as the side
    // door but smaller, intended to sit on a +x face.
    upperDoor() {
      const g = new THREE.Group();
      const door = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.42, 0.18), M.door);
      door.position.set(0, 0.21, 0); g.add(door);
      const aL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.42, 0.04), M.woodTrim); aL.position.set(0.01, 0.21, -0.09); g.add(aL);
      const aR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.42, 0.04), M.woodTrim); aR.position.set(0.01, 0.21,  0.09); g.add(aR);
      const aT = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.04, 0.22), M.woodTrim); aT.position.set(0.01, 0.44, 0   ); g.add(aT);
      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.020, 8, 8), M.knob);
      knob.position.set(0.03, 0.21, 0.05); g.add(knob);
      return g;
    },
  };

  // A linear (1xN) plan: south-end cell uses the gable-end door, the rest use side
  // doors on the +x face, chimneys alternate forward/back per cell for visual rhythm.
  // For length 1 the chimney offset matches the original solo cottage.
  function linearHousePlan(length) {
    const cells = [];
    for (let i = 0; i < length; i++) {
      const isSouthEnd = (i === length - 1);
      const chimneyOffset = (length === 1) ? -0.05 : (i % 2 === 0 ? -0.15 : 0.15);
      cells.push({ face: isSouthEnd ? 'gable' : 'side', chimneyOffset });
    }
    return cells;
  }

  // Assemble a house from a cell plan. orientation: 'z' (long-axis along z, no
  // rotation) or 'x' (long-axis along x, geometry rotated +π/2 around Y).
  // floors: 1 (default), 2, 3 — walls stretch upward, per-floor windows added,
  // and at floors === 2 an exterior staircase appears against the +x face
  // leading to an upper door (floors >= 3 implies internal stairs and the
  // exterior set is removed). opts.{frontOverhang, backOverhang} let composite
  // wings trim the inside end of the roof so it doesn't poke through the main
  // wing's roof — pass backOverhang=0 to disable the inside overhang. opts.
  // suppressBackGable hides the -z gable triangle (used for composite wings,
  // since their back gable would be coplanar with the main wing's outer wall
  // and cause z-fighting / redundant geometry).
  function buildHouse(cells, orientation = 'z', floors = 1, opts = {}) {
    const { frontOverhang = 0.15, backOverhang = 0.15, suppressBackGable = false } = opts;
    const g = new THREE.Group();
    const length = cells.length;
    // Solo cottage keeps its original slimmer depth. Clusters fill the cells.
    const WALL_D = (length === 1) ? 0.7 : length * TILE - 0.18;
    const halfW = H.WALL_W / 2;
    const halfD = WALL_D / 2;
    const wallHTotal = H.WALL_H * floors;
    const roofLift   = (floors - 1) * H.WALL_H;

    // Walls — stretched in Y for upper floors. roundedBox extrudes from y=0
    // upward, so no y-shift is needed: bottom sits at ground, top at wallHTotal.
    const walls = new THREE.Mesh(roundedBox(H.WALL_W, wallHTotal, WALL_D, 0.04), M.wallCream);
    g.add(walls);

    // Gables sit above the top floor's wall top. Composite wings suppress the
    // back gable since it's coplanar with the main wing's outer wall.
    const gF = Parts.gable(); gF.position.set(0, roofLift, halfD - 0.04); g.add(gF);
    if (!suppressBackGable) {
      const gB = Parts.gable(); gB.position.set(0, roofLift, -halfD); g.add(gB);
    }

    // Roof — pitched roof raised by roofLift. backOverhang/frontOverhang let
    // composite wings trim the inside end so it doesn't poke through the main
    // wing's roof.
    const roof = Parts.pitchedRoof(WALL_D, frontOverhang, backOverhang);
    roof.position.y = roofLift;
    g.add(roof);

    // Per-floor windows for any floor above the ground floor — small windows on
    // both long sides AND on both gable faces (so tall houses don't have blank
    // gable walls).
    for (let f = 1; f < floors; f++) {
      const yOff = f * H.WALL_H;
      for (let i = 0; i < length; i++) {
        const cellZ = -((length - 1) / 2) + i;
        const wR = Parts.window('side', 'small');
        wR.position.set( halfW + 0.005, 0.32 + yOff, cellZ); g.add(wR);
        const wL = Parts.window('side', 'small');
        wL.position.set(-halfW - 0.005, 0.32 + yOff, cellZ);
        wL.rotation.y = Math.PI;
        g.add(wL);
      }
      // Gable-face upper windows at cluster's two ends
      const wGF = Parts.window('gable', 'small');
      wGF.position.set(0, 0.32 + yOff, halfD + 0.005); g.add(wGF);
      const wGB = Parts.window('gable', 'small');
      wGB.position.set(0, 0.32 + yOff, -halfD - 0.005);
      wGB.rotation.y = Math.PI;
      g.add(wGB);
    }

    // Per-cell ground-floor decorations (door, window, chimney, step) — same as before.
    const chimneyTopsLocal = [];
    for (let i = 0; i < length; i++) {
      const cell = cells[i];
      const cellZ = -((length - 1) / 2) + i;

      if (cell.face === 'gable') {
        const door = Parts.door('gable');
        door.position.set(-0.12, 0, halfD + 0.01); g.add(door);
        const win = Parts.window('gable');
        win.position.set(0.2, 0.32, halfD + 0.01); g.add(win);
        const step = Parts.step('gable');
        step.position.set(-0.12, 0.03, halfD + 0.08); g.add(step);
      } else if (cell.face === 'side') {
        const dx = halfW + 0.005;
        const door = Parts.door('side');
        door.position.set(dx, 0, cellZ - 0.1); g.add(door);
        const win = Parts.window('side');
        win.position.set(dx, 0.32, cellZ + 0.18); g.add(win);
        const step = Parts.step('side');
        step.position.set(dx + 0.06, 0.03, cellZ - 0.1); g.add(step);
        const bwin = Parts.window('side', 'small');
        bwin.position.set(-halfW - 0.005, 0.32, cellZ);
        bwin.rotation.y = Math.PI;
        g.add(bwin);
      }

      // Chimney — bottom hides at the top floor's wall top, top sits 0.30
      // above the wall top regardless of floors.
      const chim = Parts.chimney();
      const chimX = -0.28;
      const chimZ = cellZ + (cell.chimneyOffset || 0);
      chim.position.set(chimX, wallHTotal + 0.30, chimZ); g.add(chim);
      chimneyTopsLocal.push(new THREE.Vector3(chimX, wallHTotal + 0.60, chimZ));
    }

    // External staircase + upper door — only when there's exactly 2 floors.
    // Stairs sit alongside the +x face, climbing from south (bottom) to north
    // (top); the upper door sits at the top, on the +x wall at floor 2 height.
    if (floors === 2) {
      const stairsBottomZ = halfD - 0.10;
      const stairsX = halfW + 0.13;
      const stairsTopZ = stairsBottomZ - 5 * 0.10; // 5 steps further north (z=-)
      const stairs = Parts.externalStairs(H.WALL_H);
      stairs.position.set(stairsX, 0, stairsBottomZ);
      g.add(stairs);
      const upd = Parts.upperDoor();
      upd.position.set(halfW + 0.005, H.WALL_H, stairsTopZ);
      g.add(upd);
    }

    castReceive(g);

    let chimneyTops;
    if (orientation === 'x') {
      g.rotation.y = Math.PI / 2;
      const ax = new THREE.Vector3(0, 1, 0);
      chimneyTops = chimneyTopsLocal.map(v => v.clone().applyAxisAngle(ax, Math.PI / 2));
    } else {
      chimneyTops = chimneyTopsLocal;
    }
    g.userData = { kind: 'house', chimneyTops };
    return g;
  }

  function makeHouse(floors = 1) {
    return buildHouse(linearHousePlan(1), 'z', floors);
  }

  function makeStretchedHouse(length, orientation, floors = 1) {
    return buildHouse(linearHousePlan(length), orientation, floors);
  }

  // Square (2x2) farmhouse — single rectangular footprint with a hipped
  // (pyramidal) roof. Door + window pair at the +z face, exterior stairs at
  // floors === 2 on the +x side.
  function buildSquareHouse(floors = 1) {
    const g = new THREE.Group();
    const SIDE = 2 * TILE - 0.18; // 1.82
    const halfSide = SIDE / 2;
    const wallH = H.WALL_H * floors;

    // Walls — roundedBox extrudes from y=0 upward, so no y-shift needed.
    const walls = new THREE.Mesh(roundedBox(SIDE, wallH, SIDE, 0.04), M.wallCream);
    g.add(walls);

    // Hipped roof at the top of the wall stack
    const roof = Parts.hippedRoof(SIDE, SIDE, 0.65);
    roof.position.y = wallH;
    g.add(roof);

    // Roof eave trim — a thin dark rim around the roof base for visual punch
    const eaveR = new THREE.Mesh(new THREE.BoxGeometry(SIDE + 0.04, 0.04, SIDE + 0.04), M.roofBlueD);
    eaveR.position.y = wallH + 0.02;
    g.add(eaveR);

    // Door + window pair on +z face
    const door = Parts.door('gable');
    door.position.set(0, 0, halfSide + 0.01); g.add(door);
    const winR = Parts.window('gable');
    winR.position.set( 0.45, 0.32, halfSide + 0.01); g.add(winR);
    const winL = Parts.window('gable');
    winL.position.set(-0.45, 0.32, halfSide + 0.01); g.add(winL);
    const step = Parts.step('gable');
    step.position.set(0, 0.03, halfSide + 0.08); g.add(step);

    // Side windows along -x and back -z faces (one per side, ground floor)
    const wB = Parts.window('side');
    wB.position.set(-halfSide - 0.005, 0.32, 0); g.add(wB);
    wB.rotation.y = Math.PI;
    const wRside = Parts.window('side');
    wRside.position.set( halfSide + 0.005, 0.32, -0.45); g.add(wRside);

    // Per-floor windows on all 4 faces for upper floors
    for (let f = 1; f < floors; f++) {
      const yOff = f * H.WALL_H;
      const upperWindows = [
        { x: -0.45, z:  halfSide + 0.005, rot: 0 },
        { x:  0.45, z:  halfSide + 0.005, rot: 0 },
        { x: -0.45, z: -halfSide - 0.005, rot: Math.PI },
        { x:  0.45, z: -halfSide - 0.005, rot: Math.PI },
        { x:  halfSide + 0.005, z:  0.45, rot: 0,        side: true },
        { x:  halfSide + 0.005, z: -0.45, rot: 0,        side: true },
        { x: -halfSide - 0.005, z:  0.45, rot: Math.PI,  side: true },
        { x: -halfSide - 0.005, z: -0.45, rot: Math.PI,  side: true },
      ];
      for (const p of upperWindows) {
        const w = Parts.window(p.side ? 'side' : 'gable', 'small');
        w.position.set(p.x, 0.32 + yOff, p.z);
        w.rotation.y = p.rot;
        g.add(w);
      }
    }

    // Two chimneys for visual interest, on opposite corners
    const chimneyTopsLocal = [];
    [
      { x: -0.55, z: -0.55 },
      { x:  0.55, z:  0.55 },
    ].forEach(c => {
      const chim = Parts.chimney();
      chim.position.set(c.x, wallH + 0.30, c.z); g.add(chim);
      chimneyTopsLocal.push(new THREE.Vector3(c.x, wallH + 0.60, c.z));
    });

    // External stairs on +x face when floors === 2
    if (floors === 2) {
      const stairsBottomZ = halfSide - 0.10;
      const stairsX = halfSide + 0.13;
      const stairsTopZ = stairsBottomZ - 5 * 0.10;
      const stairs = Parts.externalStairs(H.WALL_H);
      stairs.position.set(stairsX, 0, stairsBottomZ);
      g.add(stairs);
      const upd = Parts.upperDoor();
      upd.position.set(halfSide + 0.005, H.WALL_H, stairsTopZ);
      g.add(upd);
    }

    castReceive(g);
    g.userData = { kind: 'house', chimneyTops: chimneyTopsLocal };
    return g;
  }

  // Composite house — a main wing (linear stretched house) plus 1+ single-cell
  // perpendicular side wings. Each side wing is a length-1 house oriented and
  // rotated to face away from the main wing; positioned so the wing's gable
  // touches the main wing's outer wall (no visible gap). Junction geometry
  // overlaps slightly which is hidden by Z-buffer / matching wall material.
  function buildCompositeHouse(topology, floors = 1) {
    const { mainOrientation, mainCells, branches, bbox } = topology;
    const composite = new THREE.Group();
    const allChimneyTops = [];

    const bboxCX = (bbox.xMin + bbox.xMax) / 2;
    const bboxCZ = (bbox.zMin + bbox.zMax) / 2;

    // Main wing: positioned at its run's centre, in composite-local coords.
    const mainLength = mainCells.length;
    const first = mainCells[0], last = mainCells[mainCells.length - 1];
    const mainCX = mainOrientation === 'z' ? first.x          : (first.x + last.x) / 2;
    const mainCZ = mainOrientation === 'z' ? (first.z + last.z) / 2 : first.z;
    const mainOX = mainCX - bboxCX;
    const mainOZ = mainCZ - bboxCZ;

    const mainWing = buildHouse(linearHousePlan(mainLength), mainOrientation, floors);
    mainWing.position.set(mainOX, 0, mainOZ);
    composite.add(mainWing);
    for (const top of (mainWing.userData.chimneyTops || [])) {
      allChimneyTops.push(new THREE.Vector3(top.x + mainOX, top.y, top.z + mainOZ));
    }

    // Side wings (always 1 cell each, only render external stairs once on the
    // main wing — pass floors=floors but suppress stairs for wings by passing 1).
    const SHIFT = 0.18;
    const ax = new THREE.Vector3(0, 1, 0);
    for (const br of branches) {
      let wingX = br.x - bboxCX;
      let wingZ = br.z - bboxCZ;
      if      (br.axis === '+x') wingX -= SHIFT;
      else if (br.axis === '-x') wingX += SHIFT;
      else if (br.axis === '+z') wingZ -= SHIFT;
      else                       wingZ += SHIFT;

      const wingOrientation = (br.axis === '+x' || br.axis === '-x') ? 'x' : 'z';
      // Wings trim their inside-end overhang AND suppress their back gable so
      // the roof clips cleanly at the main wing's outer wall without redundant
      // / coplanar geometry. The "back" of a wing (pre-rotation -z gable, no
      // door) is always the side facing the main wing.
      const wing = buildHouse(linearHousePlan(1), wingOrientation, floors, {
        backOverhang: 0,
        suppressBackGable: true,
      });
      const flip = (br.axis === '-x' || br.axis === '-z');
      if (flip) wing.rotation.y += Math.PI;
      wing.position.set(wingX, 0, wingZ);
      composite.add(wing);

      for (const top of (wing.userData.chimneyTops || [])) {
        const r = flip ? top.clone().applyAxisAngle(ax, Math.PI) : top;
        allChimneyTops.push(new THREE.Vector3(r.x + wingX, r.y, r.z + wingZ));
      }
    }

    composite.userData = { kind: 'house', chimneyTops: allChimneyTops };
    return composite;
  }

  function makeFence(neighbors) {
    neighbors = neighbors || { n: false, s: false, e: false, w: false };
    const g = new THREE.Group();
    const postGeo = new THREE.BoxGeometry(0.09, 0.32, 0.09);

    // Drop a corner post if either of its two adjacent sides has a fence neighbour
    // (the neighbour cell's own corner post sits right next to it, so we'd get
    // chunky double-posts at every cell boundary in a run).
    const corners = [
      [-0.4, -0.4, neighbors.n || neighbors.w], // NW
      [ 0.4, -0.4, neighbors.n || neighbors.e], // NE
      [-0.4,  0.4, neighbors.s || neighbors.w], // SW
      [ 0.4,  0.4, neighbors.s || neighbors.e], // SE
    ];
    for (const [px, pz, drop] of corners) {
      if (drop) continue;
      const p = new THREE.Mesh(postGeo, M.fence);
      p.position.set(px, 0.16, pz);
      g.add(p);
    }

    // Rails on each side, skipped where a neighbour exists (run merges cleanly).
    const railH = new THREE.BoxGeometry(0.72, 0.06, 0.06); // along x (north/south sides)
    const railV = new THREE.BoxGeometry(0.06, 0.06, 0.72); // along z (west/east sides)
    if (!neighbors.n) {
      const a = new THREE.Mesh(railH, M.fence); a.position.set(0, 0.24, -0.4); g.add(a);
      const b = new THREE.Mesh(railH, M.fence); b.position.set(0, 0.08, -0.4); g.add(b);
    }
    if (!neighbors.s) {
      const a = new THREE.Mesh(railH, M.fence); a.position.set(0, 0.24,  0.4); g.add(a);
      const b = new THREE.Mesh(railH, M.fence); b.position.set(0, 0.08,  0.4); g.add(b);
    }
    if (!neighbors.w) {
      const a = new THREE.Mesh(railV, M.fence); a.position.set(-0.4, 0.24, 0); g.add(a);
      const b = new THREE.Mesh(railV, M.fence); b.position.set(-0.4, 0.08, 0); g.add(b);
    }
    if (!neighbors.e) {
      const a = new THREE.Mesh(railV, M.fence); a.position.set( 0.4, 0.24, 0); g.add(a);
      const b = new THREE.Mesh(railV, M.fence); b.position.set( 0.4, 0.08, 0); g.add(b);
    }

    g.userData = { kind: 'fence' };
    castReceive(g);
    return g;
  }

  function makeCrop() {
    const g = new THREE.Group();
    const positions = [[-0.22, -0.22], [0.22, -0.22], [-0.22, 0.22], [0.22, 0.22]];
    positions.forEach(([x, z], i) => {
      const stem = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.08), M.cropStem);
      stem.position.set(x, 0.06, z);
      g.add(stem);
      const leaf = new THREE.Mesh(roundedBox(0.18, 0.16, 0.18, 0.04), M.cropLeaf);
      leaf.position.set(x, 0.16, z);
      leaf.rotation.y = i * 0.4;
      g.add(leaf);
    });
    g.userData = { kind: 'crop', bobPhase: Math.random() * Math.PI * 2 };
    castReceive(g);
    return g;
  }

  // -------- BARN (gambrel-roof building, configurable footprint) --------
  // Footprint escala con la cantidad de celdas del cluster, igual que las casas:
  //   length=1, width=1  →  granero compacto cuadrado (1 tile)
  //   length=N, width=1  →  granero alargado (1xN tiles)
  //   length=N, width=2  →  granero ancho (2xN tiles, gambrel orientado a lo largo)
  // Dimensiones:
  // - ancho W (eje X) = width === 1 ? 0.82 : (width * TILE - 0.18)
  // - largo L (eje Z) = length * TILE - 0.18
  // - alero bajo H1 = 0.55, quiebre del gambrel a H2 = 0.95, apex H3 = 1.20
  function makeBarn(length = 1, width = 1) {
    const g = new THREE.Group();
    const W = width === 1 ? 0.82 : (width * TILE - 0.18);
    const L = length * TILE - 0.18;
    const halfW = W / 2, halfL = L / 2;
    const H1 = 0.55, H2 = 0.95, H3 = 1.20;
    const T  = 0.06;          // grosor del slab del techo
    const OVERHANG = 0.12;    // alero front/back

    // Breakpoint horizontal del gambrel (donde cambia la pendiente).
    // En el granero original era W/4; lo escalamos para anchos mayores.
    const BREAK_X = W * 0.25;

    // -------- paredes (caja redondeada hasta H1) --------
    const walls = new THREE.Mesh(roundedBox(W, H1, L, 0.04), M.barnRed);
    g.add(walls);

    // Trim horizontal corriendo a lo largo del alero (cuatro lados a H1)
    const trimLong = new THREE.BoxGeometry(W + 0.04, 0.04, 0.05);
    const trimShort = new THREE.BoxGeometry(0.05, 0.04, L + 0.04);
    const tF = new THREE.Mesh(trimLong, M.barnTrim);  tF.position.set(0, H1, halfL + 0.005); g.add(tF);
    const tB = new THREE.Mesh(trimLong, M.barnTrim);  tB.position.set(0, H1, -halfL - 0.005); g.add(tB);
    const tR = new THREE.Mesh(trimShort, M.barnTrim); tR.position.set( halfW + 0.005, H1, 0); g.add(tR);
    const tL = new THREE.Mesh(trimShort, M.barnTrim); tL.position.set(-halfW - 0.005, H1, 0); g.add(tL);

    // -------- frontones (paneles pentagonales en +z y -z) --------
    // El frontón se construye un poco MÁS PEQUEÑO que el contorno del techo,
    // empujando los vértices superiores hacia adentro. Pero además lo hacemos
    // muy fino (extrude depth = 0.02) y lo metemos completamente dentro del
    // cuerpo del granero, así no asoma por ningún lado bajo el techo.
    const INSET = 0.05;
    function offsetIn(prev, cur, next, amount) {
      // Calcula la dirección de bisectriz hacia adentro en `cur` entre los
      // segmentos prev→cur y cur→next, y devuelve cur desplazado por `amount`
      // a lo largo de esa bisectriz.
      const v1 = new THREE.Vector2(cur[0] - prev[0], cur[1] - prev[1]).normalize();
      const v2 = new THREE.Vector2(next[0] - cur[0], next[1] - cur[1]).normalize();
      // Normales hacia adentro (rotación 90° antihoraria de la dirección del borde)
      const n1 = new THREE.Vector2(-v1.y, v1.x);
      const n2 = new THREE.Vector2(-v2.y, v2.x);
      const bis = n1.add(n2).normalize();
      return [cur[0] + bis.x * amount, cur[1] + bis.y * amount];
    }

    const apex      = [0, H3];
    const breakR    = [ BREAK_X, H2];
    const breakL    = [-BREAK_X, H2];
    const eaveR     = [ halfW, H1];
    const eaveL     = [-halfW, H1];
    // Vértices en orden CCW empezando por la esquina inferior izquierda.
    const ringRaw = [eaveL, breakL, apex, breakR, eaveR];
    // Solo recortamos los vértices superiores (apex y break points). Los aleros
    // los dejamos donde están porque la pared inferior los cubre y queremos
    // que el frontón llegue exactamente hasta el alero.
    const breakLIn  = offsetIn(eaveL, breakL, apex, INSET);
    const apexIn    = offsetIn(breakL, apex, breakR, INSET);
    const breakRIn  = offsetIn(apex, breakR, eaveR, INSET);

    const gableShape = new THREE.Shape();
    gableShape.moveTo(eaveL[0], eaveL[1]);
    gableShape.lineTo(breakLIn[0], breakLIn[1]);
    gableShape.lineTo(apexIn[0], apexIn[1]);
    gableShape.lineTo(breakRIn[0], breakRIn[1]);
    gableShape.lineTo(eaveR[0], eaveR[1]);
    gableShape.closePath();
    const gableGeo = new THREE.ExtrudeGeometry(gableShape, { depth: 0.04, bevelEnabled: false, curveSegments: 1 });

    // Pentágono "tapón" del color del techo, del tamaño exacto del frontón
    // recortado. Va pegado al frontón pero por fuera (más cerca del techo),
    // para que cubra la franja roja que asoma entre el frontón y los slabs.
    const gableCoverShape = new THREE.Shape();
    gableCoverShape.moveTo(eaveL[0], eaveL[1]);
    gableCoverShape.lineTo(breakLIn[0], breakLIn[1]);
    gableCoverShape.lineTo(apexIn[0], apexIn[1]);
    gableCoverShape.lineTo(breakRIn[0], breakRIn[1]);
    gableCoverShape.lineTo(eaveR[0], eaveR[1]);
    gableCoverShape.closePath();
    const gableCoverGeo = new THREE.ExtrudeGeometry(gableCoverShape, { depth: 0.02, bevelEnabled: false, curveSegments: 1 });

    // Construimos la parte del frontón que va por debajo del alero (rectángulo
    // entre H1 y H2) en rojo para que coincida con la pared, y la parte del
    // gambrel (encima de H2, donde se ven las líneas problemáticas) la pintamos
    // del color del techo para que se confunda con el material del techo y
    // ningún borde rojo asome bajo los slabs.
    const gableShapeUpper = new THREE.Shape();
    gableShapeUpper.moveTo(-BREAK_X, H2);
    gableShapeUpper.lineTo(breakLIn[0], breakLIn[1]);
    gableShapeUpper.lineTo(apexIn[0], apexIn[1]);
    gableShapeUpper.lineTo(breakRIn[0], breakRIn[1]);
    gableShapeUpper.lineTo( BREAK_X, H2);
    gableShapeUpper.closePath();
    const gableGeoUpper = new THREE.ExtrudeGeometry(gableShapeUpper, { depth: 0.04, bevelEnabled: false, curveSegments: 1 });

    const gableFront = new THREE.Mesh(gableGeo, M.barnRed);
    gableFront.position.z = halfL - 0.08;
    g.add(gableFront);

    const gableBack = new THREE.Mesh(gableGeo, M.barnRed);
    gableBack.position.z = -halfL + 0.04;
    g.add(gableBack);

    // Tapón color techo justo afuera del frontón rojo, para que el rojo no se
    // vea entre el frontón y los slabs del techo. Va levemente por fuera del
    // frontón rojo en z, así su cara externa coincide con donde estaba el
    // borde rojo problemático.
    const gableCoverFront = new THREE.Mesh(gableCoverGeo, M.barnRoof);
    gableCoverFront.position.z = halfL - 0.05;
    g.add(gableCoverFront);

    const gableCoverBack = new THREE.Mesh(gableCoverGeo, M.barnRoof);
    gableCoverBack.position.z = -halfL + 0.03;
    g.add(gableCoverBack);

    // -------- techo de gambrel --------
    // 4 slabs (2 por lado). Cada slab cubre un segmento del frontón.
    // Los slabs se alargan ligeramente (EXTEND) más allá del segmento del
    // pentágono que cubren, y se desplazan más de medio grosor hacia afuera
    // (OFFSET), para garantizar que el borde rojo del frontón quede oculto
    // bajo el techo en todos los anchos. Sin esto, en graneros anchos
    // (width=2) la pendiente alta es muy vertical y deja ver el borde del
    // pentágono entre los dos slabs del ápice.
    const roofDepth = L + OVERHANG * 2;
    const SLAB_EXTEND = 0.06;
    const SLAB_OFFSET = T * 0.9;
    function pitchSlab(x1, y1, x2, y2, mirror) {
      const dx = x2 - x1, dy = y2 - y1;
      const slabLen = Math.sqrt(dx * dx + dy * dy) + SLAB_EXTEND * 2;
      const angle = Math.atan2(dy, dx);
      const cx = (x1 + x2) / 2;
      const cy = (y1 + y2) / 2;
      const slab = new THREE.Mesh(new THREE.BoxGeometry(slabLen, T, roofDepth), M.barnRoof);
      let finalAngle = angle;
      let finalCx = cx;
      if (mirror) { finalAngle = Math.PI - angle; finalCx = -cx; }
      slab.rotation.z = finalAngle;
      const px = -Math.sin(finalAngle) * SLAB_OFFSET;
      const py =  Math.cos(finalAngle) * SLAB_OFFSET;
      slab.position.set(finalCx + px, cy + py, 0);
      return slab;
    }

    // Lado +x
    g.add(pitchSlab( halfW, H1, BREAK_X, H2, false));
    g.add(pitchSlab( BREAK_X, H2,     0, H3, false));
    // Lado -x
    g.add(pitchSlab( halfW, H1, BREAK_X, H2, true));
    g.add(pitchSlab( BREAK_X, H2,     0, H3, true));

    // Cumbrera oscura en el ápice. La hacemos un poco más ancha para que
    // cubra cualquier gap entre los slabs del techo en el centro — esto es
    // crítico para graneros anchos donde la pendiente alta es más vertical
    // y los slabs no se solapan tan bien en el ápice.
    const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.08, roofDepth + 0.02), M.barnRoofD);
    ridge.position.set(0, H3 + 0.02, 0);
    g.add(ridge);

    // -------- frente: puertas grandes con la X blanca --------
    // Anchura de las puertas: la mayor parte del frente, dejando un margen
    // a ambos lados para el marco blanco. El granero compacto y el alargado
    // usan el mismo ancho frontal.
    const doorW = 0.56;
    const doorH = 0.5;
    const doorZ = halfL + 0.025;

    // Marco blanco alrededor de la puerta
    const frameT = 0.05;
    const frameOuterW = doorW + frameT * 2;
    const frameOuterH = doorH + frameT;
    const frameTop = new THREE.Mesh(new THREE.BoxGeometry(frameOuterW, frameT, 0.03), M.barnTrim);
    frameTop.position.set(0, doorH + frameT / 2, doorZ + 0.005); g.add(frameTop);
    const frameLeft = new THREE.Mesh(new THREE.BoxGeometry(frameT, frameOuterH, 0.03), M.barnTrim);
    frameLeft.position.set(-doorW / 2 - frameT / 2, frameOuterH / 2, doorZ + 0.005); g.add(frameLeft);
    const frameRight = new THREE.Mesh(new THREE.BoxGeometry(frameT, frameOuterH, 0.03), M.barnTrim);
    frameRight.position.set(doorW / 2 + frameT / 2, frameOuterH / 2, doorZ + 0.005); g.add(frameRight);

    // Dos hojas de puerta (rojo más oscuro)
    const halfDoor = new THREE.BoxGeometry(doorW / 2 - 0.01, doorH, 0.04);
    const doorL = new THREE.Mesh(halfDoor, M.barnRedD);
    doorL.position.set(-doorW / 4, doorH / 2, doorZ); g.add(doorL);
    const doorR = new THREE.Mesh(halfDoor, M.barnRedD);
    doorR.position.set( doorW / 4, doorH / 2, doorZ); g.add(doorR);

    // La "X" blanca clásica del granero — dos diagonales por hoja + travesaños
    function addXOnPanel(centerX) {
      const panelW = doorW / 2 - 0.04;
      const diagLen = Math.sqrt(panelW * panelW + doorH * doorH);
      const diagAngle = Math.atan2(doorH, panelW);
      const trimZ = doorZ + 0.025;
      const t1 = new THREE.Mesh(new THREE.BoxGeometry(diagLen, 0.035, 0.02), M.barnTrim);
      t1.position.set(centerX, doorH / 2, trimZ); t1.rotation.z =  diagAngle; g.add(t1);
      const t2 = new THREE.Mesh(new THREE.BoxGeometry(diagLen, 0.035, 0.02), M.barnTrim);
      t2.position.set(centerX, doorH / 2, trimZ); t2.rotation.z = -diagAngle; g.add(t2);
      const tTop = new THREE.Mesh(new THREE.BoxGeometry(panelW, 0.035, 0.02), M.barnTrim);
      tTop.position.set(centerX, doorH - 0.04, trimZ); g.add(tTop);
      const tBot = new THREE.Mesh(new THREE.BoxGeometry(panelW, 0.035, 0.02), M.barnTrim);
      tBot.position.set(centerX, 0.04, trimZ); g.add(tBot);
    }
    addXOnPanel(-doorW / 4);
    addXOnPanel( doorW / 4);

    // -------- ventana del henil (círculo en la parte alta del frontón) --------
    const henilY = (H2 + H3) / 2;
    const henilFrame = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.04, 14), M.barnTrim);
    henilFrame.rotation.x = Math.PI / 2;
    henilFrame.position.set(0, henilY, halfL + 0.005); g.add(henilFrame);
    const henilGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.04, 14), M.windowB);
    henilGlass.rotation.x = Math.PI / 2;
    henilGlass.position.set(0, henilY, halfL + 0.015); g.add(henilGlass);
    const henilCrossH = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.018, 0.025), M.barnTrim);
    henilCrossH.position.set(0, henilY, halfL + 0.03); g.add(henilCrossH);
    const henilCrossV = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.22, 0.025), M.barnTrim);
    henilCrossV.position.set(0, henilY, halfL + 0.03); g.add(henilCrossV);

    // Heno asomando por el henil
    const hay = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.04), M.barnHay);
    hay.position.set(0, henilY - 0.06, halfL + 0.035);
    hay.rotation.z = 0.15;
    g.add(hay);

    // -------- ventanas laterales pequeñas --------
    // Para granero de 1 celda: una ventana centrada por lado.
    // Para granero de 2+ celdas: una ventana por celda (centrada en cada tile).
    function addSideWindow(side) {
      const x = side === 'r' ? halfW + 0.005 : -halfW - 0.005;
      const rot = side === 'r' ? 0 : Math.PI;
      const offsets = [];
      if (length === 1) {
        offsets.push(0);
      } else {
        for (let i = 0; i < length; i++) {
          offsets.push(-((length - 1) / 2) + i);
        }
      }
      for (const zOff of offsets) {
        const w = Parts.window('side', 'small');
        w.position.set(x, 0.32, zOff);
        w.rotation.y = rot;
        // Reemplazamos el marco oscuro por trim blanco
        w.traverse(c => {
          if (c.isMesh && c.material === M.woodTrim) c.material = M.barnTrim;
        });
        g.add(w);
      }
    }
    addSideWindow('r');
    addSideWindow('l');

    castReceive(g);
    g.userData = { kind: 'barn' };
    return g;
  }

  // Composite barn — main wing (linear corrida) + 1+ single-cell perpendicular
  // wings. Reutilizamos la misma topología que las casas (tryComposite).
  function buildCompositeBarn(topology) {
    const { mainOrientation, mainCells, branches, bbox } = topology;
    const composite = new THREE.Group();
    const bboxCX = (bbox.xMin + bbox.xMax) / 2;
    const bboxCZ = (bbox.zMin + bbox.zMax) / 2;

    // Main wing
    const mainLength = mainCells.length;
    const first = mainCells[0], last = mainCells[mainCells.length - 1];
    const mainCX = mainOrientation === 'z' ? first.x          : (first.x + last.x) / 2;
    const mainCZ = mainOrientation === 'z' ? (first.z + last.z) / 2 : first.z;
    const mainOX = mainCX - bboxCX;
    const mainOZ = mainCZ - bboxCZ;

    const mainWing = makeBarn(mainLength, 1);
    if (mainOrientation === 'x') mainWing.rotation.y = Math.PI / 2;
    mainWing.position.set(mainOX, 0, mainOZ);
    composite.add(mainWing);

    // Branches (siempre 1 celda)
    const SHIFT = 0.18;
    for (const br of branches) {
      let wingX = br.x - bboxCX;
      let wingZ = br.z - bboxCZ;
      if      (br.axis === '+x') wingX -= SHIFT;
      else if (br.axis === '-x') wingX += SHIFT;
      else if (br.axis === '+z') wingZ -= SHIFT;
      else                       wingZ += SHIFT;

      const wingOrientation = (br.axis === '+x' || br.axis === '-x') ? 'x' : 'z';
      const wing = makeBarn(1, 1);
      if (wingOrientation === 'x') wing.rotation.y = Math.PI / 2;
      const flip = (br.axis === '-x' || br.axis === '-z');
      if (flip) wing.rotation.y += Math.PI;
      wing.position.set(wingX, 0, wingZ);
      composite.add(wing);
    }

    composite.userData = { kind: 'barn' };
    return composite;
  }

  function makeWindmill() {
    const g = new THREE.Group();

    // Base de piedra — cilindro ligeramente cónico (más ancho abajo)
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.36, 0.95, 14), M.millStone);
    base.position.y = 0.475;
    g.add(base);

    // Bandas de piedra más oscura para textura
    const band1 = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.32, 0.04, 14), M.millStoneD);
    band1.position.y = 0.18;
    g.add(band1);
    const band2 = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.28, 0.04, 14), M.millStoneD);
    band2.position.y = 0.62;
    g.add(band2);

    // Ventanita en el cuerpo
    const winFrame = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.03), M.woodTrim);
    winFrame.position.set(0, 0.55, 0.265);
    g.add(winFrame);
    const winGlass = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.04), M.windowB);
    winGlass.position.set(0, 0.55, 0.28);
    g.add(winGlass);
    const winCrossH = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.012, 0.04), M.woodTrim);
    winCrossH.position.set(0, 0.55, 0.29);
    g.add(winCrossH);
    const winCrossV = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.12, 0.04), M.woodTrim);
    winCrossV.position.set(0, 0.55, 0.29);
    g.add(winCrossV);

    // Puerta en la base
    const door = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.32, 0.04), M.door);
    door.position.set(0, 0.16, 0.27);
    g.add(door);
    const doorArchL = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.32, 0.04), M.woodTrim);
    doorArchL.position.set(-0.08, 0.16, 0.28); g.add(doorArchL);
    const doorArchR = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.32, 0.04), M.woodTrim);
    doorArchR.position.set( 0.08, 0.16, 0.28); g.add(doorArchR);
    const doorArchT = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.04, 0.04), M.woodTrim);
    doorArchT.position.set(0, 0.34, 0.28); g.add(doorArchT);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.018, 8, 8), M.knob);
    knob.position.set(0.06, 0.16, 0.30); g.add(knob);

    // Techo cónico
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.34, 14), M.millRoof);
    roof.position.y = 1.12;
    g.add(roof);

    // Eje horizontal donde se montan las aspas — sale del frente del techo
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.18, 8), M.millFrame);
    axle.rotation.x = Math.PI / 2;
    axle.position.set(0, 1.0, 0.32);
    g.add(axle);

    // Las aspas van en un grupo propio para rotar como una pieza única
    const blades = new THREE.Group();
    blades.position.set(0, 1.0, 0.40);

    // Buje central
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.06, 10), M.millFrame);
    hub.rotation.x = Math.PI / 2;
    blades.add(hub);

    // 4 aspas en cruz. Cada aspa = travesaño de madera + lona clara encima
    for (let i = 0; i < 4; i++) {
      const blade = new THREE.Group();
      blade.rotation.z = i * Math.PI / 2;

      // Travesaño de madera (eje del aspa)
      const beam = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.62, 0.04), M.millFrame);
      beam.position.y = 0.34;
      blade.add(beam);

      // Lona / tela del aspa — rectángulo ligeramente desplazado al lado
      const sail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.5, 0.02), M.millBlade);
      sail.position.set(0.11, 0.36, 0.03);
      blade.add(sail);

      // Listones internos de la lona (líneas oscuras)
      const slat1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.012, 0.025), M.millFrame);
      slat1.position.set(0.11, 0.24, 0.04); blade.add(slat1);
      const slat2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.012, 0.025), M.millFrame);
      slat2.position.set(0.11, 0.48, 0.04); blade.add(slat2);

      blades.add(blade);
    }
    g.add(blades);

    castReceive(g);
    g.userData = {
      kind: 'windmill',
      blades,                                  // referencia para animar la rotación
