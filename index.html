      spinSpeed: 0.7 + Math.random() * 0.3,    // ligera variación por molino
    };
    return g;
  }

  function makeTuft() {
    const g = new THREE.Group();
    const positions = [[0, 0], [0.08, 0.06], [-0.07, 0.04], [0.03, -0.08], [-0.04, -0.05]];
    positions.forEach(([x, z]) => {
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1 + Math.random() * 0.04, 0.05), M.leaves);
      blade.position.set(x, blade.geometry.parameters.height / 2, z);
      g.add(blade);
    });
    g.userData = { kind: 'tuft' };
    castReceive(g);
    return g;
  }

  // -------- world data --------
  // world[x][z] stores intent: terrain + the kind of object on it (string or null).
  // cellMeshes[key] stores the rendered meshes (tile + object). The object mesh
  // is rebuilt from world state + neighbor context, so adjacency-aware kinds
  // (fences, houses) re-render when a neighbor changes.
  const world = [];
  const cellMeshes = {}; // 'x,z' -> { tile, object }

  for (let x = 0; x < GRID; x++) {
    world[x] = [];
    for (let z = 0; z < GRID; z++) world[x][z] = { terrain: 'grass', kind: null, floors: 1 };
  }

  const MAX_FLOORS = 3;

  const worldGroup = new THREE.Group();
  scene.add(worldGroup);

  function tilePos(x, z) {
    return new THREE.Vector3(x - GRID / 2 + 0.5, 0, z - GRID / 2 + 0.5);
  }

  // -------- drop-in animation system --------
  // Each tile/object that wants to "land" gets pushed into dropAnims with a delay,
  // then ticks toward its target Y per frame. While landing, obj.userData.landing
  // is set so other position-Y animations (crop bob, smoke origin) yield to it.
  const dropAnims = [];
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeOutBack = t => {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  };
  function animateDrop(obj, distance, dur, delay, easing) {
    const baseY = obj.position.y;
    obj.position.y = baseY + distance;
    obj.userData.landing = true;
    dropAnims.push({ obj, baseY, distance, t: -delay, dur, easing });
  }
  function tickDropAnims(dt) {
    for (let i = dropAnims.length - 1; i >= 0; i--) {
      const a = dropAnims[i];
      a.t += dt;
      if (a.t < 0) continue;
      const u = Math.min(1, a.t / a.dur);
      a.obj.position.y = a.baseY + a.distance * (1 - a.easing(u));
      if (u >= 1) {
        a.obj.position.y = a.baseY;
        a.obj.userData.landing = false;
        dropAnims.splice(i, 1);
      }
    }
  }

  // -------- adjacency helpers --------
  function getFenceNeighbors(x, z) {
    return {
      n: z > 0          && world[x][z - 1].kind === 'fence',
      s: z < GRID - 1   && world[x][z + 1].kind === 'fence',
      e: x < GRID - 1   && world[x + 1][z].kind === 'fence',
      w: x > 0          && world[x - 1][z].kind === 'fence',
    };
  }

  // Composite del granero: encuentra la corrida lineal más larga del cluster
  // como main wing, y trata cada celda restante como una rama single-cell
  // adyacente al main. A diferencia de tryComposite (casas), permite que las
  // ramas se toquen entre sí — basta con que cada una toque alguna celda del
  // main. Devuelve null si no encuentra un main wing válido o si alguna celda
  // del cluster no toca el main.
  function tryBarnComposite(cluster) {
    if (cluster.length < 2) return null;

    const xs = cluster.map(c => c.x), zs = cluster.map(c => c.z);
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const zMin = Math.min(...zs), zMax = Math.max(...zs);
    const cellSet = new Set(cluster.map(c => c.x + ',' + c.z));

    // Buscamos la corrida lineal contigua más larga (en x o en z) dentro del
    // cluster. Tiene que tener al menos longitud 2 (sino no es composite).
    let bestRun = null;
    function consider(orientation, cells) {
      if (cells.length < 2) return;
      if (!bestRun || cells.length > bestRun.cells.length) {
        bestRun = { orientation, cells };
      }
    }
    // Corridas en x (mismo z, x consecutivos)
    for (let z = zMin; z <= zMax; z++) {
      let run = [];
      for (let x = xMin; x <= xMax + 1; x++) {
        if (x <= xMax && cellSet.has(x + ',' + z)) {
          run.push({ x, z });
        } else {
          consider('x', run);
          run = [];
        }
      }
    }
    // Corridas en z (mismo x, z consecutivos)
    for (let x = xMin; x <= xMax; x++) {
      let run = [];
      for (let z = zMin; z <= zMax + 1; z++) {
        if (z <= zMax && cellSet.has(x + ',' + z)) {
          run.push({ x, z });
        } else {
          consider('z', run);
          run = [];
        }
      }
    }
    if (!bestRun) return null;

    // Las celdas que no están en el main son branches. Cada branch DEBE ser
    // adyacente a alguna celda del main (sino el composite no tiene sentido).
    const mainSet = new Set(bestRun.cells.map(c => c.x + ',' + c.z));
    const branches = [];
    for (const c of cluster) {
      if (mainSet.has(c.x + ',' + c.z)) continue;
      const adjacentMain = bestRun.cells.find(mc =>
        Math.abs(mc.x - c.x) + Math.abs(mc.z - c.z) === 1
      );
      if (!adjacentMain) return null;
      let axis;
      if      (c.x === adjacentMain.x + 1) axis = '+x';
      else if (c.x === adjacentMain.x - 1) axis = '-x';
      else if (c.z === adjacentMain.z + 1) axis = '+z';
      else                                 axis = '-z';
      branches.push({ x: c.x, z: c.z, axis });
    }

    const sorted = [...cluster].sort((a, b) => a.x - b.x || a.z - b.z);
    return {
      mainOrientation: bestRun.orientation,
      mainCells: bestRun.cells,
      branches,
      bbox: { xMin, xMax, zMin, zMax },
      anchorX: sorted[0].x,
      anchorZ: sorted[0].z,
    };
  }

  // Cluster del granero — mismas topologías que las casas:
  //   solo:      1 celda
  //   linear:    corrida 1xN o Nx1 (lineal pura, sin vecinos perpendiculares)
  //   square:    2x2 sólido
  //   composite: main wing lineal + ramas single-cell perpendiculares (L o T)
  //
  // CUALQUIER otra topología (3x2, 4x2, L-shape grande con ramas de 2+ celdas,
  // etc.) hace fallback a "solo" para todas las celdas. Esto es deliberado —
  // mantenemos las formas válidas chicas y predecibles.
  function findBarnCluster(x, z) {
    // 1) Probar corrida lineal pura primero (igual que las casas)
    let xMin = x, xMax = x;
    while (xMin > 0          && world[xMin - 1][z].kind === 'barn') xMin--;
    while (xMax < GRID - 1   && world[xMax + 1][z].kind === 'barn') xMax++;
    let zMin = z, zMax = z;
    while (zMin > 0          && world[x][zMin - 1].kind === 'barn') zMin--;
    while (zMax < GRID - 1   && world[x][zMax + 1].kind === 'barn') zMax++;
    const xLen = xMax - xMin + 1, zLen = zMax - zMin + 1;

    if (xLen > 1 && zLen === 1) {
      let pure = true;
      for (let i = xMin; i <= xMax && pure; i++) {
        if ((z > 0        && world[i][z - 1].kind === 'barn') ||
            (z < GRID - 1 && world[i][z + 1].kind === 'barn')) pure = false;
      }
      if (pure) return { kind: 'linear', isAnchor: x === xMin, length: xLen,
                          orientation: 'x', anchorX: xMin, anchorZ: z };
    }
    if (zLen > 1 && xLen === 1) {
      let pure = true;
      for (let j = zMin; j <= zMax && pure; j++) {
        if ((x > 0        && world[x - 1][j].kind === 'barn') ||
            (x < GRID - 1 && world[x + 1][j].kind === 'barn')) pure = false;
      }
      if (pure) return { kind: 'linear', isAnchor: z === zMin, length: zLen,
                          orientation: 'z', anchorX: x, anchorZ: zMin };
    }

    // 2) Lineal falló → flood fill del cluster y probar 2x2 sólido o composite
    const cluster = bfsBarnCluster(x, z);

    // 2a) Square 2x2 (igual que las casas)
    const square = trySquare(cluster);
    if (square) {
      return { kind: 'square',
               isAnchor: x === square.anchorX && z === square.anchorZ,
               anchorX: square.anchorX, anchorZ: square.anchorZ };
    }

    // 2b) Composite con main wing lineal + ramas. Reglas más permisivas que
    //     las casas: las ramas pueden tocar otras ramas mientras todas estén
    //     adyacentes al main. Esto permite formas como 2x2+1, U, escalones,
    //     etc., siempre que cada celda no-main toque alguna celda del main.
    const composite = tryBarnComposite(cluster);
    if (composite) {
      return { kind: 'composite',
               isAnchor: x === composite.anchorX && z === composite.anchorZ,
               anchorX: composite.anchorX, anchorZ: composite.anchorZ,
               topology: composite };
    }

    // 3) Topología no soportada → cada celda como solo
    return { kind: 'solo', isAnchor: true, anchorX: x, anchorZ: z };
  }

  // Detect a "composite" topology — a long main wing plus 1+ single-cell
  // perpendicular branches (L-shape, T-shape, +-shape). Returns null if the
  // cluster doesn't fit this shape (e.g. solid 2x2 square, multi-cell branches).
  function tryComposite(cluster) {
    if (cluster.length < 2) return null;
    const xs = cluster.map(c => c.x), zs = cluster.map(c => c.z);
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const zMin = Math.min(...zs), zMax = Math.max(...zs);

    const rowCounts = {}, colCounts = {};
    for (const c of cluster) {
      rowCounts[c.z] = (rowCounts[c.z] || 0) + 1;
      colCounts[c.x] = (colCounts[c.x] || 0) + 1;
    }
    const maxRowCount = Math.max(...Object.values(rowCounts));
    const maxColCount = Math.max(...Object.values(colCounts));

    let mainOrientation, mainAxisCoord, mainCells;
    if (maxColCount >= maxRowCount && maxColCount >= 2) {
      mainOrientation = 'z';
      let bestX = null;
      for (const x of Object.keys(colCounts).map(Number).sort((a, b) => a - b)) {
        if (colCounts[x] === maxColCount) { bestX = x; break; }
      }
      mainAxisCoord = bestX;
      mainCells = cluster.filter(c => c.x === bestX).sort((a, b) => a.z - b.z);
    } else if (maxRowCount >= 2) {
      mainOrientation = 'x';
      let bestZ = null;
      for (const z of Object.keys(rowCounts).map(Number).sort((a, b) => a - b)) {
        if (rowCounts[z] === maxRowCount) { bestZ = z; break; }
      }
      mainAxisCoord = bestZ;
      mainCells = cluster.filter(c => c.z === bestZ).sort((a, b) => a.x - b.x);
    } else {
      return null;
    }

    // Main wing must be a contiguous run.
    for (let i = 1; i < mainCells.length; i++) {
      const prev = mainCells[i - 1], cur = mainCells[i];
      if (mainOrientation === 'z' && cur.z !== prev.z + 1) return null;
      if (mainOrientation === 'x' && cur.x !== prev.x + 1) return null;
    }

    // Side cells = everything not in the main run. Each must be a single-cell
    // branch attached to a main cell with no neighbouring side cell (no L-tail
    // or 2-cell branches in this version).
    const sideCells = cluster.filter(c =>
      mainOrientation === 'z' ? c.x !== mainAxisCoord : c.z !== mainAxisCoord
    );
    const branches = [];
    for (const sc of sideCells) {
      const adjacentMain = mainCells.find(mc =>
        Math.abs(mc.x - sc.x) + Math.abs(mc.z - sc.z) === 1
      );
      if (!adjacentMain) return null;
      const adjacentSide = sideCells.find(o =>
        o !== sc && Math.abs(o.x - sc.x) + Math.abs(o.z - sc.z) === 1
      );
      if (adjacentSide) return null;
      let axis;
      if      (sc.x === adjacentMain.x + 1) axis = '+x';
      else if (sc.x === adjacentMain.x - 1) axis = '-x';
      else if (sc.z === adjacentMain.z + 1) axis = '+z';
      else                                  axis = '-z';
      branches.push({ x: sc.x, z: sc.z, axis });
    }

    // Anchor: the cluster cell with smallest (x, then z). Used so only one
    // cell renders the composite mesh; others render nothing.
    const sorted = [...cluster].sort((a, b) => a.x - b.x || a.z - b.z);
    const anchorX = sorted[0].x, anchorZ = sorted[0].z;

    return {
      mainOrientation,
      mainCells,
      branches,
      bbox: { xMin, xMax, zMin, zMax },
      anchorX,
      anchorZ,
    };
  }

  // Walk ± along x and z from (x,z) over contiguous houses. Tries linear first,
  // then composite (L/T-shapes), then falls back to solo. Returns:
  //   { kind: 'linear',    isAnchor, length, orientation, anchorX, anchorZ }
  //   { kind: 'composite', isAnchor, topology }
  //   { kind: 'solo',      isAnchor: true,   anchorX, anchorZ }
  function findHouseCluster(x, z) {
    let xMin = x, xMax = x;
    while (xMin > 0          && world[xMin - 1][z].kind === 'house') xMin--;
    while (xMax < GRID - 1   && world[xMax + 1][z].kind === 'house') xMax++;
    let zMin = z, zMax = z;
    while (zMin > 0          && world[x][zMin - 1].kind === 'house') zMin--;
    while (zMax < GRID - 1   && world[x][zMax + 1].kind === 'house') zMax++;
    const xLen = xMax - xMin + 1, zLen = zMax - zMin + 1;

    if (xLen > 1 && zLen === 1) {
      let pure = true;
      for (let i = xMin; i <= xMax && pure; i++) {
        if ((z > 0        && world[i][z - 1].kind === 'house') ||
            (z < GRID - 1 && world[i][z + 1].kind === 'house')) pure = false;
      }
      if (pure) return { kind: 'linear', isAnchor: x === xMin, length: xLen, orientation: 'x', anchorX: xMin, anchorZ: z };
    }
    if (zLen > 1 && xLen === 1) {
      let pure = true;
      for (let j = zMin; j <= zMax && pure; j++) {
        if ((x > 0        && world[x - 1][j].kind === 'house') ||
            (x < GRID - 1 && world[x + 1][j].kind === 'house')) pure = false;
      }
      if (pure) return { kind: 'linear', isAnchor: z === zMin, length: zLen, orientation: 'z', anchorX: x, anchorZ: zMin };
    }

    // Linear failed → try square (2x2) first, then L/T composite.
    const cluster = bfsHouseCluster(x, z);

    const square = trySquare(cluster);
    if (square) {
      return {
        kind: 'square',
        isAnchor: x === square.anchorX && z === square.anchorZ,
        anchorX: square.anchorX,
        anchorZ: square.anchorZ,
      };
    }

    const composite = tryComposite(cluster);
    if (composite) {
      return {
        kind: 'composite',
        isAnchor: x === composite.anchorX && z === composite.anchorZ,
        anchorX: composite.anchorX,
        anchorZ: composite.anchorZ,
        topology: composite,
      };
    }

    return { kind: 'solo', isAnchor: true, anchorX: x, anchorZ: z };
  }

  // Detect a 2x2 solid square cluster — 4 cells forming a perfect 2x2 block,
  // anchored at the (xMin, zMin) corner. Returns null otherwise.
  function trySquare(cluster) {
    if (cluster.length !== 4) return null;
    const xs = cluster.map(c => c.x), zs = cluster.map(c => c.z);
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const zMin = Math.min(...zs), zMax = Math.max(...zs);
    if (xMax - xMin !== 1 || zMax - zMin !== 1) return null;
    const cells = new Set(cluster.map(c => c.x + ',' + c.z));
    for (let i = xMin; i <= xMax; i++) {
      for (let j = zMin; j <= zMax; j++) {
        if (!cells.has(i + ',' + j)) return null;
      }
    }
    return { anchorX: xMin, anchorZ: zMin };
  }

  // 4-neighbour flood fill over connected houses, used to find every cell
  // potentially affected when a placement adds/removes a connection.
  function bfsHouseCluster(x, z) {
    return bfsKindCluster(x, z, 'house');
  }
  function bfsBarnCluster(x, z) {
    return bfsKindCluster(x, z, 'barn');
  }
  function bfsKindCluster(x, z, kind) {
    const result = [];
    const seen = new Set();
    const queue = [{ x, z }];
    while (queue.length) {
      const c = queue.shift();
      const k = c.x + ',' + c.z;
      if (seen.has(k)) continue;
      seen.add(k);
      if (c.x < 0 || c.x >= GRID || c.z < 0 || c.z >= GRID) continue;
      if (world[c.x][c.z].kind !== kind) continue;
      result.push(c);
      queue.push({ x: c.x + 1, z: c.z });
      queue.push({ x: c.x - 1, z: c.z });
      queue.push({ x: c.x, z: c.z + 1 });
      queue.push({ x: c.x, z: c.z - 1 });
    }
    return result;
  }

  // -------- low-level renderers (build the actual meshes from world state) --------
  function renderCellTile(x, z, opts) {
    const { animate = true, delay = 0 } = opts || {};
    const key = x + ',' + z;
    let entry = cellMeshes[key];
    if (!entry) entry = cellMeshes[key] = { tile: null, object: null };
    if (entry.tile) {
      worldGroup.remove(entry.tile);
      disposeGroup(entry.tile);
    }
    const tile = makeTile(world[x][z].terrain);
    const p = tilePos(x, z);
    tile.position.copy(p);
    tile.userData.gx = x;
    tile.userData.gz = z;
    worldGroup.add(tile);
    entry.tile = tile;
    if (animate) animateDrop(tile, 2.4, 0.42, delay, easeOutCubic);
  }

  function renderCellObject(x, z, opts) {
    const { animate = false, delay = 0 } = opts || {};
    const key = x + ',' + z;
    let entry = cellMeshes[key];
    if (!entry) entry = cellMeshes[key] = { tile: null, object: null };
    // Siempre limpiamos primero el mesh viejo. Si la celda no debe renderizar
    // nada (no-anchor en un cluster, kind=null, etc.), el limpiar igual es
    // necesario — sino quedan meshes huérfanos cuando una celda deja de ser
    // anchor o cambia de kind.
    if (entry.object) {
      worldGroup.remove(entry.object);
      disposeGroup(entry.object);
      entry.object = null;
    }

    const kind = world[x][z].kind;
    if (!kind) return;

    let mesh = null;
    let posX = null, posZ = null;
    let setGridUserData = true;

    if      (kind === 'tree')     mesh = makeTree();
    else if (kind === 'tuft')     mesh = makeTuft();
    else if (kind === 'crop')     mesh = makeCrop();
    else if (kind === 'windmill') mesh = makeWindmill();
    else if (kind === 'fence')    mesh = makeFence(getFenceNeighbors(x, z));
    else if (kind === 'barn') {
      // Sin sistema de cluster — cada granero ocupa exactamente 1 tile.
      mesh = makeBarn(1, 1);
    }
    else if (kind === 'house') {
      const cluster = findHouseCluster(x, z);
      if (!cluster.isAnchor) return;          // non-anchor cluster cells render nothing
      const floors = world[x][z].floors || 1;
      if (cluster.kind === 'solo') {
        mesh = makeHouse(floors);
      } else if (cluster.kind === 'linear') {
        mesh = makeStretchedHouse(cluster.length, cluster.orientation, floors);
        // Position at cluster CENTRE (not the anchor cell), so the visible house
        // spans the run cleanly. Skip gx/gz so pickTile falls through to whichever
        // tile is actually under the cursor.
        const a = tilePos(cluster.anchorX, cluster.anchorZ);
        posX = a.x; posZ = a.z;
        if (cluster.orientation === 'x') posX += (cluster.length - 1) * TILE / 2;
        else                              posZ += (cluster.length - 1) * TILE / 2;
        setGridUserData = false;
      } else if (cluster.kind === 'composite') {
        mesh = buildCompositeHouse(cluster.topology, floors);
        // Position at cluster bounding-box centre so wings fall in place.
        const t = cluster.topology;
        posX = (t.bbox.xMin + t.bbox.xMax) / 2 - GRID / 2 + 0.5;
        posZ = (t.bbox.zMin + t.bbox.zMax) / 2 - GRID / 2 + 0.5;
        setGridUserData = false;
      } else if (cluster.kind === 'square') {
        mesh = buildSquareHouse(floors);
        // Centre the 2x2 mesh between the four cells.
        posX = (cluster.anchorX + 0.5) - GRID / 2 + 0.5;
        posZ = (cluster.anchorZ + 0.5) - GRID / 2 + 0.5;
        setGridUserData = false;
      }
    } else return;

    if (!mesh) return;
    if (posX === null) {
      const p = tilePos(x, z);
      posX = p.x; posZ = p.z;
    }
    mesh.position.set(posX, TOP_H, posZ);
    if (setGridUserData) {
      mesh.userData.gx = x;
      mesh.userData.gz = z;
    }
    mesh.userData.baseY = TOP_H;
    worldGroup.add(mesh);
    entry.object = mesh;
    if (animate) animateDrop(mesh, 2.0, 0.5, delay, easeOutBack);
  }

  function setCell(x, z, opts) {
    const { terrain, kind = null, floors, tileDelay = 0, objectDelay = 0, animate = true, forceTile = false } = opts;
    const prev = world[x][z] || { terrain: null, kind: null, floors: 1 };
    const terrainChanged = prev.terrain !== terrain;
    const kindChanged    = (prev.kind || null) !== (kind || null);
    // floors default: when placing a fresh kind, start at 1; when preserving the
    // same kind without specifying, keep the previous value.
    const newFloors = (floors !== undefined) ? floors
                    : (kindChanged ? 1 : (prev.floors || 1));
    const floorsChanged = (prev.floors || 1) !== newFloors;
    world[x][z] = { terrain, kind: kind || null, floors: newFloors };

    // For house clusters, every cell shares the floors count. Propagate to all.
    if (kind === 'house' && floorsChanged) {
      for (const c of bfsHouseCluster(x, z)) {
        if (c.x !== x || c.z !== z) world[c.x][c.z].floors = newFloors;
      }
    }

    if (terrainChanged || forceTile) {
      renderCellTile(x, z, { animate, delay: tileDelay });
    }
    if (!kindChanged && !floorsChanged) return;

    // The "primary" cell is whichever cell's mesh visually represents the change.
    // For house placements that join/extend a cluster, that's the cluster anchor —
    // not the click cell, since the click cell may render nothing.
    let primaryX = x, primaryZ = z;
    if (kind === 'house') {
      const c = findHouseCluster(x, z);
      primaryX = c.anchorX; primaryZ = c.anchorZ;
    }

    // Collect every cell whose rendered mesh might need to change: this cell,
    // its 4 neighbours, AND every house connected to those (so a cluster
    // split across multiple cells refreshes correctly).
    const toRefresh = new Map();
    toRefresh.set(x + ',' + z, { x, z });
    if (world[x][z].kind === 'house') {
      for (const c of bfsHouseCluster(x, z)) toRefresh.set(c.x + ',' + c.z, c);
    }
    for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, nz = z + dz;
      if (nx < 0 || nx >= GRID || nz < 0 || nz >= GRID) continue;
      const nk = world[nx][nz].kind;
      if (nk === 'fence') {
        toRefresh.set(nx + ',' + nz, { x: nx, z: nz });
      } else if (nk === 'house') {
        for (const c of bfsHouseCluster(nx, nz)) toRefresh.set(c.x + ',' + c.z, c);
      }
    }

    for (const c of toRefresh.values()) {
      const isPrimary = c.x === primaryX && c.z === primaryZ;
      renderCellObject(c.x, c.z, {
        animate: animate && isPrimary,
        delay:   isPrimary ? objectDelay : 0,
      });
    }
  }

  function disposeGroup(group) {
    group.traverse(o => {
      if (o.geometry) o.geometry.dispose();
    });
  }

  // -------- initial scene (matches the reference image) --------
  function loadInitialScene() {
    // Wipe any existing meshes + animation state so a Reset re-plays the drop.
    for (const key in cellMeshes) {
      const e = cellMeshes[key];
      if (e.tile) { worldGroup.remove(e.tile); disposeGroup(e.tile); }
      if (e.object) { worldGroup.remove(e.object); disposeGroup(e.object); }
    }
    for (const k of Object.keys(cellMeshes)) delete cellMeshes[k];
    for (let x = 0; x < GRID; x++)
      for (let z = 0; z < GRID; z++)
        world[x][z] = { terrain: null, kind: null, floors: 1 };
    dropAnims.length = 0;

    // Build the layout in one shot so each cell only animates once.
    const layout = {};
    for (let x = 0; x < GRID; x++)
      for (let z = 0; z < GRID; z++)
        layout[x + ',' + z] = { terrain: 'grass', kind: null };

    layout['2,3'] = { terrain: 'grass', kind: 'house' };
    for (let z = 4; z < GRID; z++) layout['2,' + z] = { terrain: 'path', kind: null };
    layout['0,5'] = { terrain: 'grass', kind: 'tree' };
    layout['5,1'] = { terrain: 'grass', kind: 'tree' };
    for (let cx = 5; cx <= 6; cx++)
      for (let cz = 4; cz <= 5; cz++)
        layout[cx + ',' + cz] = { terrain: 'dirt', kind: 'crop' };
    layout['4,4'] = { terrain: 'grass', kind: 'fence' };
    layout['4,5'] = { terrain: 'grass', kind: 'fence' };
    layout['5,3'] = { terrain: 'grass', kind: 'fence' };
    layout['6,3'] = { terrain: 'grass', kind: 'fence' };
    layout['1,6'] = { terrain: 'grass', kind: 'tuft' };
    layout['4,6'] = { terrain: 'grass', kind: 'tuft' };
    layout['0,2'] = { terrain: 'grass', kind: 'tuft' };
    layout['6,7'] = { terrain: 'grass', kind: 'tuft' };

    // Diagonal sweep — small (x+z) lands first, far corner lands last.
    // Objects land slightly after their tile so it feels like layers stacking.
    const TILE_STAGGER = 0.035;
    const OBJECT_OFFSET = 0.22;
    for (let x = 0; x < GRID; x++) {
      for (let z = 0; z < GRID; z++) {
        const cell = layout[x + ',' + z];
        const baseDelay = (x + z) * TILE_STAGGER;
        setCell(x, z, {
          terrain: cell.terrain,
          kind: cell.kind,
          tileDelay: baseDelay,
          objectDelay: baseDelay + OBJECT_OFFSET,
        });
      }
    }
  }

  // -------- hover indicator --------
  const hoverGeo = roundedSlab(TILE * 1.0, 0.04, 0.07);
  const hoverMesh = new THREE.Mesh(hoverGeo, M.hover);
  hoverMesh.position.y = TOP_H + 0.01;
  hoverMesh.visible = false;
  scene.add(hoverMesh);

  let currentHover = null;

  // -------- raycaster --------
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();

  function pickTile(clientX, clientY) {
    ndc.x = (clientX / window.innerWidth) * 2 - 1;
    ndc.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(ndc, camera);
    const hits = raycaster.intersectObjects(worldGroup.children, true);
    for (const h of hits) {
      let n = h.object;
      while (n && (n.userData.gx === undefined)) n = n.parent;
      if (n && n.userData.gx !== undefined) return { x: n.userData.gx, z: n.userData.gz };
    }
    return null;
  }

  // -------- tools --------
  const TOOLS = [
    { id: 'grass',  label: 'Grass',  terrain: 'grass', color: '#9ec74b' },
    { id: 'path',   label: 'Path',   terrain: 'path',  color: '#e8d5a8' },
    { id: 'dirt',   label: 'Dirt',   terrain: 'dirt',  color: '#5a3b27' },
    { id: 'water',  label: 'Water',  terrain: 'water', color: '#4a90c2' },
    { id: 'house',  label: 'House',  kind: 'house', color: '#3a72c8' },
    { id: 'barn',   label: 'Barn',   kind: 'barn',  color: '#a83828' },
    { id: 'tree',   label: 'Tree',   kind: 'tree',  color: '#6fb442' },
    { id: 'fence',  label: 'Fence',  kind: 'fence', color: '#8a5a3b' },
    { id: 'crop',   label: 'Crop',   kind: 'crop',  terrainOverride: 'dirt', color: '#86c544' },
    { id: 'tuft',   label: 'Tuft',   kind: 'tuft',  color: '#86b53e' },
    { id: 'mill',   label: 'Mill',   kind: 'windmill', color: '#e8dfc8' },
    { id: 'erase',  label: 'Erase',  erase: true, color: 'transparent', eraser: true },
  ];

  let selectedTool = TOOLS[8]; // start on Crop — matches the first goal

  function buildToolbar() {
    const bar = document.getElementById('toolbar');
    bar.innerHTML = '';
    TOOLS.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = 'tool';
      btn.dataset.id = t.id;
      const swatch = document.createElement('div');
      swatch.className = 'swatch' + (t.eraser ? ' eraser' : '');
      if (!t.eraser) swatch.style.background = t.color;
      btn.appendChild(swatch);
      const lbl = document.createElement('span');
      lbl.textContent = t.label;
      btn.appendChild(lbl);
      const k = document.createElement('kbd');
      k.textContent = i < 9 ? String(i + 1) : 'E';
      btn.appendChild(k);
      btn.addEventListener('click', () => selectTool(t));
      if (t === selectedTool) btn.classList.add('active');
      bar.appendChild(btn);
    });
  }

  // Sin toolbar inferior — el catálogo es la UI principal.
  function buildToolbar() {}

  // -------- catálogo: panel lateral con previews 3D --------
  // Categorías para organizar el panel
  const CATEGORIES = [
    { id: 'terrain',    label: 'Terrain',     ids: ['grass', 'path', 'dirt', 'water'] },
    { id: 'buildings',  label: 'Buildings',   ids: ['house', 'barn', 'mill'] },
    { id: 'vegetation', label: 'Vegetation',  ids: ['tree', 'crop', 'tuft'] },
    { id: 'other',      label: 'Other',       ids: ['fence', 'erase'] },
  ];

  // Usamos UN único WebGLRenderer offscreen para todos los previews.
  // preserveDrawingBuffer=true es CRÍTICO: sin esto, cuando hacemos
  // ctx.drawImage(previewRenderer.domElement, ...) el navegador puede haber
  // limpiado el buffer entre el render y el copy, dejando los canvas de los
  // items en blanco.
  const previewRenderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    preserveDrawingBuffer: true,
  });
  previewRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  previewRenderer.setSize(120, 120);
  previewRenderer.outputEncoding = THREE.sRGBEncoding;

  const previewItems = [];   // [{ tool, scene, camera, group, canvas, ctx }]

  function makePreviewScene(tool) {
    const scn = new THREE.Scene();

    // Luz fuerte para que se vean los objetos sin sombras complicadas.
    // Los previews son pequeños, mejor sobre-iluminar.
    const hemi = new THREE.HemisphereLight(0xffffff, 0xb39879, 0.8);
    scn.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(3, 5, 2);
    scn.add(sun);
    const fill = new THREE.DirectionalLight(0xffffff, 0.4);
    fill.position.set(-2, 3, -2);
    scn.add(fill);

    // Cada preview tiene una tile de hierba como suelo, idéntica al juego
    const baseTile = makeTile('grass');
    baseTile.position.y = 0;
    scn.add(baseTile);

    // El mesh del item, encima del tile. Para terrenos puros (grass/path/dirt/
    // water), el tile YA es el preview, así que no añadimos nada encima.
    const group = new THREE.Group();
    group.position.y = TOP_H;
    let placedMesh = null;

    if (tool.kind === 'tree')          placedMesh = makeTree();
    else if (tool.kind === 'tuft')     placedMesh = makeTuft();
    else if (tool.kind === 'crop')     placedMesh = makeCrop();
    else if (tool.kind === 'fence')    placedMesh = makeFence({});
    else if (tool.kind === 'windmill') placedMesh = makeWindmill();
    else if (tool.kind === 'barn')     placedMesh = makeBarn(1, 1);
    else if (tool.kind === 'house')    placedMesh = makeHouse(1);
    else if (tool.terrain) {
      // Terreno: el tile del preview es el item, así que reemplazamos el base
      scn.remove(baseTile);
      const newTile = makeTile(tool.terrain);
      scn.add(newTile);
    }

    if (placedMesh) group.add(placedMesh);
    scn.add(group);

    // Cámara en perspectiva isométrica, mirando al origen. Encuadre más
    // cerrado para que el objeto ocupe gran parte del disco.
    const cam = new THREE.PerspectiveCamera(28, 1, 0.1, 50);
    const r = 2.8;
    const az = Math.PI * 0.25, po = Math.PI * 0.38;
    cam.position.set(
      r * Math.sin(po) * Math.cos(az),
      r * Math.cos(po) + 0.3,
      r * Math.sin(po) * Math.sin(az)
    );
    cam.lookAt(0, 0.35, 0);

    return { scene: scn, camera: cam, group };
  }

  // -------- Sims-style bottom dock --------
  // Tabs select a category; items for the active category are visible, the
  // rest are display:none. Every item keeps its 3D preview canvas alive so
  // switching tabs feels instant.
  let activeCategory = 'buildings';

  function buildCatalog() {
    const tabsEl = document.getElementById('dockTabs');
    const itemsEl = document.getElementById('dockItems');
    if (!tabsEl || !itemsEl) return;
    tabsEl.innerHTML = '';
    itemsEl.innerHTML = '';
    previewItems.length = 0;

    for (const cat of CATEGORIES) {
      const tab = document.createElement('button');
      tab.className = 'dock-tab';
      tab.textContent = cat.label;
      tab.dataset.cat = cat.id;
      tab.addEventListener('click', () => switchCategory(cat.id));
      tabsEl.appendChild(tab);
    }

    for (const cat of CATEGORIES) {
      for (const id of cat.ids) {
        const tool = TOOLS.find(t => t.id === id);
        if (!tool) continue;

        const item = document.createElement('button');
        item.className = 'dock-item' + (tool.eraser ? ' eraser' : '');
        item.dataset.id = tool.id;
        item.dataset.cat = cat.id;
        if (tool === selectedTool) item.classList.add('active');

        const disc = document.createElement('div');
        disc.className = 'disc';
        const canvas = document.createElement('canvas');
        canvas.width = 120;
        canvas.height = 120;
        disc.appendChild(canvas);
        item.appendChild(disc);

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = tool.label;
        item.appendChild(name);

        // Cost chip (top-right): price in coins; turns red when unaffordable.
        const cost = COSTS[tool.kind];
        if (cost) {
          const chip = document.createElement('span');
          chip.className = 'cost';
          chip.dataset.cost = cost;
          chip.textContent = cost + '🪙';
          item.appendChild(chip);
        }

        // Limit chip (top-left): currently only trees show "have/cap".
        // The chip element is always present so updateDockLimits can fill it.
        if (tool.kind === 'tree') {
          const limit = document.createElement('span');
          limit.className = 'limit tree-limit';
          limit.textContent = '0/0';
          item.appendChild(limit);
        }

        item.addEventListener('click', () => selectTool(tool));
        itemsEl.appendChild(item);

        if (!tool.eraser) {
          const { scene: scn, camera: cam, group } = makePreviewScene(tool);
          const ctx = canvas.getContext('2d');
          previewItems.push({ tool, scene: scn, camera: cam, group, canvas, ctx });
        }
      }
    }

    switchCategory(activeCategory);
  }

  function switchCategory(catId) {
    activeCategory = catId;
    document.querySelectorAll('.dock-tab').forEach(el => {
      el.classList.toggle('active', el.dataset.cat === catId);
    });
    document.querySelectorAll('.dock-item').forEach(el => {
      el.style.display = (el.dataset.cat === catId) ? '' : 'none';
    });
  }

  // The dock is always visible, so we always render previews. The shared
  // offscreen renderer is reused once per item per frame.
  function tickCatalogPreviews(t) {
    for (const item of previewItems) {
      item.group.rotation.y = t * 0.4;
      previewRenderer.render(item.scene, item.camera);
      const src = previewRenderer.domElement;
      item.ctx.clearRect(0, 0, item.canvas.width, item.canvas.height);
      try {
        item.ctx.drawImage(src, 0, 0, item.canvas.width, item.canvas.height);
      } catch (err) { /* ignore intermittent WebGL state errors */ }
    }
  }

  function updateCatalogActive() {
    document.querySelectorAll('.dock-item').forEach(el => {
      el.classList.toggle('active', el.dataset.id === selectedTool.id);
    });
    // Auto-switch tabs so the active item is visible after a keyboard shortcut
    const activeEl = document.querySelector('.dock-item.active');
    if (activeEl && activeEl.dataset.cat && activeEl.dataset.cat !== activeCategory) {
      switchCategory(activeEl.dataset.cat);
    }
  }

  function selectTool(t) {
    selectedTool = t;
    updateCatalogActive();
    hoverMesh.material = t.erase ? M.hoverErase : M.hover;
  }

  // -------- click → place / erase --------
  let lastClickPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

  function applyTool(x, z) {
    // Don't touch the world during combat — clicks shoot, not place.
    if (typeof COMBAT !== 'undefined' && COMBAT.active) return;
    const cell = world[x][z];
    const key = x + ',' + z;

    // Harvest-first: a click on a ready cell collects, regardless of tool —
    // except the eraser, which is meant to destroy whatever's there.
    if (!selectedTool.erase && isReady(key)) {
      harvestAt(x, z, lastClickPos.x, lastClickPos.y);
      return;
    }

    if (selectedTool.erase) {
      if (cell.kind) {
        unregisterHarvest(x, z);
        setCell(x, z, { terrain: cell.terrain, kind: null });
      } else if (cell.terrain !== 'grass') {
        setCell(x, z, { terrain: 'grass', kind: null });
      }
      updateHud(); checkGoals();
      return;
    }

    // Don't re-plant on top of a growing harvestable cell — show timer instead.
    // This stops accidental re-clicks from wasting coins on a cell that's
    // already mid-cycle.
    if (cell.kind && HARVEST[cell.kind] && harvestState.has(key)) {
      const st = harvestState.get(key);
      const cfg = HARVEST[cell.kind];
      const remain = Math.max(0, Math.ceil(cfg.growSec - (performance.now() / 1000 - st.plantedAt)));
      showFloatAt(lastClickPos.x, lastClickPos.y, remain + 's…', '#8a847a');
      return;
    }

    if (selectedTool.kind) {
      // Hard cap on trees (Sims-style: limited by housing) so the loop
      // requires balancing forestry against settlement.
      if (selectedTool.kind === 'tree' && countKind('tree') >= treeCap()) {
        showToast('Tree limit ' + treeCap() + ' — build more houses!', '🌳');
        return;
      }
      if (!canAfford(selectedTool)) {
        showToast('Not enough 🪙 — harvest crops!', '⚠️');
        return;
      }
      payFor(selectedTool);
      const newTerrain = selectedTool.terrainOverride || cell.terrain;
      setCell(x, z, { terrain: newTerrain, kind: selectedTool.kind });
      onPlace(selectedTool, x, z, lastClickPos.x, lastClickPos.y);
      updateHud(); checkGoals();
      return;
    }
    if (selectedTool.terrain) {
      setCell(x, z, { terrain: selectedTool.terrain, kind: cell.kind, floors: cell.floors });
    }
  }

  // -------- input: drag-to-orbit + click-to-place --------
  let pointerDown = null;     // {x, y}
  let lastPointer = null;
  let didDrag = false;
  const DRAG_THRESHOLD = 5;

  renderer.domElement.addEventListener('pointerdown', e => {
    // En modo walk dejamos pasar para que el sistema de "look drag" del modo
    // walk lo maneje. Pero también permitimos colocar items: si el toque no
    // se mueve (no es un drag), al soltarlo aplicamos la herramienta sobre el
    // tile que apunta el personaje.
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    pointerDown = { x: e.clientX, y: e.clientY };
    lastPointer = { x: e.clientX, y: e.clientY };
    didDrag = false;
    renderer.domElement.classList.add('dragging');
    renderer.domElement.setPointerCapture(e.pointerId);
  });

  renderer.domElement.addEventListener('pointermove', e => {
    if (fpsActive) return; // En FPS el hover se actualiza en tickFps
    // hover update always
    const cell = pickTile(e.clientX, e.clientY);
    if (cell) {
      const p = tilePos(cell.x, cell.z);
      hoverMesh.position.set(p.x, TOP_H + 0.02, p.z);
      hoverMesh.visible = true;
      currentHover = cell;
    } else {
      hoverMesh.visible = false;
      currentHover = null;
    }

    if (pointerDown) {
      const dx = e.clientX - pointerDown.x;
      const dy = e.clientY - pointerDown.y;
      if (!didDrag && Math.abs(dx) + Math.abs(dy) > DRAG_THRESHOLD) didDrag = true;
      if (didDrag) {
        const ddx = e.clientX - lastPointer.x;
        const ddy = e.clientY - lastPointer.y;
        targetAzimuth -= ddx * 0.005;
        targetPolar = Math.max(0.18, Math.min(1.25, targetPolar - ddy * 0.004));
      }
      lastPointer = { x: e.clientX, y: e.clientY };
    }
  });

  renderer.domElement.addEventListener('pointerup', e => {
    renderer.domElement.classList.remove('dragging');
    if (fpsActive) {
      // En modo walk: si el toque fue un tap (no drag) y hay tile bajo el
      // personaje, aplicamos la herramienta seleccionada en el tile DELANTE
      // del personaje (a 1 paso adelante).
      if (pointerDown && Math.abs(e.clientX - pointerDown.x) + Math.abs(e.clientY - pointerDown.y) < DRAG_THRESHOLD) {
        if (currentHover) {
          lastClickPos = { x: e.clientX, y: e.clientY };
          applyTool(currentHover.x, currentHover.z);
        }
      }
      pointerDown = null;
      lastPointer = null;
      return;
    }
    if (pointerDown && !didDrag && currentHover) {
      lastClickPos = { x: e.clientX, y: e.clientY };
      applyTool(currentHover.x, currentHover.z);
    }
    pointerDown = null;
    lastPointer = null;
  });

  renderer.domElement.addEventListener('pointercancel', () => {
    renderer.domElement.classList.remove('dragging');
    pointerDown = null;
  });

  renderer.domElement.addEventListener('wheel', e => {
    if (fpsActive) return; // wheel del modo walk se maneja aparte
    e.preventDefault();
    const delta = Math.max(-100, Math.min(100, e.deltaY));
    targetViewSize = Math.max(5, Math.min(22, targetViewSize + delta * 0.015));
  }, { passive: false });

  // keyboard shortcuts (sólo cuando NO estamos en modo FPS)
  window.addEventListener('keydown', e => {
    if (fpsActive) return;
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k >= '1' && k <= '9') {
      const idx = parseInt(k, 10) - 1;
      if (TOOLS[idx]) selectTool(TOOLS[idx]);
    } else if (k === 'e') selectTool(TOOLS[11]);
    else if (k === 'r') doReset();
    else if (k === 'c') doClear();
  });

  // Helper: solo añade el listener si el elemento existe
  function on(id, event, handler) {
    const el = document.getElementById(id);
    if (el) el.addEventListener(event, handler);
  }

  on('reset', 'click', doReset);
  on('clear', 'click', doClear);

  function doReset() {
    loadInitialScene();
    if (typeof resetEcon === 'function') resetEcon();
  }
  function doClear() {
    const TILE_STAGGER = 0.022;
    for (let x = 0; x < GRID; x++)
      for (let z = 0; z < GRID; z++)
        setCell(x, z, {
          terrain: 'grass',
          kind: null,
          tileDelay: (x + z) * TILE_STAGGER,
          forceTile: true,
        });
    if (typeof resetEcon === 'function') resetEcon();
  }

  // -------- chimney smoke --------
  const smokeMat = new THREE.MeshBasicMaterial({ color: 0xd4cfc2, transparent: true, opacity: 0.65, depthWrite: false });
  const smokeGeo = new THREE.SphereGeometry(0.06, 6, 6);
  const smokeParticles = [];

  function spawnSmoke(houseObj) {
    const tops = houseObj.userData.chimneyTops
      || (houseObj.userData.chimneyTop ? [houseObj.userData.chimneyTop] : []);
    for (const top of tops) {
      const s = new THREE.Mesh(smokeGeo, smokeMat.clone());
      s.position.set(
        houseObj.position.x + top.x + (Math.random() - 0.5) * 0.02,
        houseObj.position.y + top.y,
        houseObj.position.z + top.z + (Math.random() - 0.5) * 0.02
      );
      s.userData = {
        life: 0,
        maxLife: 2.4 + Math.random() * 0.6,
        vy: 0.45 + Math.random() * 0.2,
        vx: (Math.random() - 0.5) * 0.15,
        vz: (Math.random() - 0.5) * 0.15,
      };
      scene.add(s);
      smokeParticles.push(s);
    }
  }

  function updateSmoke(dt) {
    for (let i = smokeParticles.length - 1; i >= 0; i--) {
      const s = smokeParticles[i];
      s.userData.life += dt;
      const t = s.userData.life / s.userData.maxLife;
      s.position.y += s.userData.vy * dt;
      s.position.x += s.userData.vx * dt;
      s.position.z += s.userData.vz * dt;
      s.material.opacity = (1 - t) * 0.65;
      const sc = 1 + t * 1.4;
      s.scale.set(sc, sc, sc);
      if (t >= 1) {
        scene.remove(s);
        s.material.dispose();
        smokeParticles.splice(i, 1);
      }
    }
  }

  // -------- animation loop --------
  let prevT = 0;
  let smokeTimer = 0;
  function animate(now) {
    requestAnimationFrame(animate);
    const t = now / 1000;
    const dt = prevT ? Math.min(t - prevT, 0.05) : 0;
    prevT = t;

    // Suavizado de cámara: interpola valores renderizados hacia los targets.
    // Usamos exponential smoothing dependiente de dt para que el resultado
    // sea independiente del framerate. El factor efectivo en cada frame es
    // 1 - exp(-damping_rate * dt), que tiende al damping constante cuando
    // dt ≈ 1/60. snap final cuando estamos suficientemente cerca para evitar
    // que el render se rerenderice indefinidamente por diferencias ínfimas.
    const orbitRate = -Math.log(1 - ORBIT_DAMPING) * 60;
    const zoomRate  = -Math.log(1 - ZOOM_DAMPING)  * 60;
    const orbitK = 1 - Math.exp(-orbitRate * dt);
    const zoomK  = 1 - Math.exp(-zoomRate  * dt);

    const dAz = targetAzimuth - azimuth;
    const dPo = targetPolar   - polar;
    const dVs = targetViewSize - viewSize;
    let cameraDirty = false;
    if (Math.abs(dAz) > 1e-5) { azimuth += dAz * orbitK; cameraDirty = true; }
    else if (azimuth !== targetAzimuth) { azimuth = targetAzimuth; cameraDirty = true; }
    if (Math.abs(dPo) > 1e-5) { polar += dPo * orbitK; cameraDirty = true; }
    else if (polar !== targetPolar) { polar = targetPolar; cameraDirty = true; }
    if (Math.abs(dVs) > 1e-4) { viewSize += dVs * zoomK; onResize(); }
    else if (viewSize !== targetViewSize) { viewSize = targetViewSize; onResize(); }
    if (cameraDirty) updateCamera();

    // tile/object drop-in animations (load + placement)
    if (dropAnims.length) tickDropAnims(dt);

    // sway trees / bob crops / wiggle tufts
    for (const key in cellMeshes) {
      const obj = cellMeshes[key].object;
      if (!obj) continue;
      const k = obj.userData.kind;
      if (k === 'tree') {
        obj.rotation.z = Math.sin(t * 0.85 + obj.userData.swayPhase) * 0.022;
        obj.rotation.x = Math.cos(t * 0.65 + obj.userData.swayPhase) * 0.012;
      } else if (k === 'crop') {
        if (!obj.userData.landing)
          obj.position.y = obj.userData.baseY + Math.sin(t * 1.6 + obj.userData.bobPhase) * 0.03;
      } else if (k === 'tuft') {
        obj.rotation.z = Math.sin(t * 1.2 + (obj.userData.gx + obj.userData.gz)) * 0.05;
      } else if (k === 'windmill') {
        // Las aspas giran sobre su propio eje Z local (perpendicular al techo)
        obj.userData.blades.rotation.z = t * obj.userData.spinSpeed;
      }
    }

    // chimney smoke — skip while the house is still landing (origin would be airborne)
    smokeTimer += dt;
    if (smokeTimer > 0.18) {
      smokeTimer = 0;
      for (const key in cellMeshes) {
        const o = cellMeshes[key].object;
        if (o && o.userData.kind === 'house' && !o.userData.landing) spawnSmoke(o);
      }
    }
    updateSmoke(dt);

    // Switch camera based on mode: combat/walk uses the third-person fpsCam,
    // otherwise the orbital build camera.
    if (fpsActive) tickFps(dt);
    if (typeof tickCombat === 'function') tickCombat(dt);
    const renderCam = fpsActive ? fpsCam : camera;
    renderer.render(scene, renderCam);

    tickCatalogPreviews(t);
    if (typeof tickHarvest === 'function') tickHarvest(t);
  }

  // -------- resize --------
  function onResize() {
    const w = window.innerWidth, h = window.innerHeight;
    const aspect = w / h;

    persCam.aspect = aspect;
    persCam.updateProjectionMatrix();

    fpsCam.aspect = aspect;
    fpsCam.updateProjectionMatrix();

    renderer.setSize(w, h);
    updateCamera();
  }
  window.addEventListener('resize', onResize);

  // -------- modo FPS: lógica de control --------
  // Verifica si una posición (cx, cz) en mundo colisiona con algún edificio o
  // valla. Tratamos cada celda como un AABB cuya extensión depende del kind:
  //   - house, barn, mill, tree (tronco), fence: bloqueantes
  //   - terrain water: bloqueante (no se camina sobre agua)
  //   - todo lo demás: caminable
  // Recibe coordenadas mundo y devuelve true si hay colisión.
  function fpsCollides(cx, cz) {
    // De coordenadas mundo a grid: invertimos tilePos()
    const gx = Math.floor(cx + GRID / 2);
    const gz = Math.floor(cz + GRID / 2);
    // Fuera del mapa: bloqueamos para que el jugador no se vaya al infinito
    if (gx < 0 || gx >= GRID || gz < 0 || gz >= GRID) return true;

    const cell = world[gx][gz];
    if (cell.terrain === 'water') return true;

    const k = cell.kind;
    if (!k) return false;

    // Para edificios y árboles, tratamos toda la celda como bloqueada (con un
    // pequeño margen para que la pared no esté justo en el borde del tile).
    if (k === 'house' || k === 'barn' || k === 'windmill') return true;
    if (k === 'tree') {
      // El tronco es chico — bloqueamos solo si estamos cerca del centro del tile
      const cellCx = gx - GRID / 2 + 0.5;
      const cellCz = gz - GRID / 2 + 0.5;
      const dx = cx - cellCx, dz = cz - cellCz;
      return Math.sqrt(dx * dx + dz * dz) < 0.30;
    }
    if (k === 'fence') return true;
    // crop, tuft: caminable
    return false;
  }

  // Mueve el jugador `dx, dz` con sliding contra colisiones. La técnica es
  // mover cada eje por separado: si el movimiento en X colisiona, anulamos solo
  // ese componente y dejamos pasar el Z. Esto permite deslizarse a lo largo de
  // las paredes en lugar de quedarse pegado.
  function fpsTryMove(dx, dz) {
    const r = fpsState.radius;
    let nx = fpsState.pos.x + dx;
    // Probamos las 4 esquinas del bounding circle para el nuevo X
    if (!fpsCollides(nx + r, fpsState.pos.z + r) &&
        !fpsCollides(nx + r, fpsState.pos.z - r) &&
        !fpsCollides(nx - r, fpsState.pos.z + r) &&
        !fpsCollides(nx - r, fpsState.pos.z - r)) {
      fpsState.pos.x = nx;
    }
    let nz = fpsState.pos.z + dz;
    if (!fpsCollides(fpsState.pos.x + r, nz + r) &&
        !fpsCollides(fpsState.pos.x + r, nz - r) &&
        !fpsCollides(fpsState.pos.x - r, nz + r) &&
        !fpsCollides(fpsState.pos.x - r, nz - r)) {
      fpsState.pos.z = nz;
    }
  }

  // Encuentra un tile inicial caminable cercano al centro. Spawneamos al
  // jugador ahí cuando entra al modo FPS.
  function findFpsSpawn() {
    // Probamos tiles en espiral desde el centro
    const cx = Math.floor(GRID / 2), cz = Math.floor(GRID / 2);
    for (let r = 0; r < GRID; r++) {
      for (let dx = -r; dx <= r; dx++) {
        for (let dz = -r; dz <= r; dz++) {
          if (Math.abs(dx) !== r && Math.abs(dz) !== r) continue;
          const x = cx + dx, z = cz + dz;
          if (x < 0 || x >= GRID || z < 0 || z >= GRID) continue;
          const cell = world[x][z];
          if (cell.terrain !== 'water' && !cell.kind) {
            return { x, z };
          }
        }
      }
    }
    return { x: cx, z: cz };
  }

  function enterFps() {
    if (fpsActive) return;
    fpsActive = true;
    const spawn = findFpsSpawn();
    const p = tilePos(spawn.x, spawn.z);
    fpsState.pos.set(p.x, TOP_H, p.z);
    fpsState.yaw = 0;
    fpsState.velocityY = 0;
    fpsState.onGround = true;
    fpsState.camYaw = 0;
    fpsState.camPitch = 0.55;
    player.visible = true;

    document.getElementById('fpsOverlay').classList.add('active');
    document.getElementById('walk').classList.add('on');
    hoverMesh.visible = false;

    // Joystick + botón de salto en touch
    if ('ontouchstart' in window) {
      document.getElementById('fpsJoystick').classList.add('show');
      document.getElementById('fpsJumpBtn').classList.add('show');
    }
  }

  function exitFps() {
    if (!fpsActive) return;
    fpsActive = false;
    player.visible = false;
    document.getElementById('fpsOverlay').classList.remove('active');
    document.getElementById('walk').classList.remove('on');
    document.getElementById('fpsJoystick').classList.remove('show');
    document.getElementById('fpsJumpBtn').classList.remove('show');
    // Reset input
    fpsState.keys.w = fpsState.keys.a = fpsState.keys.s = fpsState.keys.d = false;
    fpsState.keys.shift = false;
    fpsState.touchMove.x = fpsState.touchMove.y = 0;
  }

  function toggleFps() { fpsActive ? exitFps() : enterFps(); }

  function tryJump() {
    if (fpsActive && fpsState.onGround) {
      fpsState.velocityY = fpsState.jumpSpeed;
      fpsState.onGround = false;
    }
  }

  document.getElementById('walk').addEventListener('click', toggleFps);

  // Keyboard del modo walk
  window.addEventListener('keydown', e => {
    if (!fpsActive) return;
    const k = e.key.toLowerCase();
    if (k === 'escape') { exitFps(); return; }
    if (k === 'w') fpsState.keys.w = true;
    if (k === 'a') fpsState.keys.a = true;
    if (k === 's') fpsState.keys.s = true;
    if (k === 'd') fpsState.keys.d = true;
    if (k === 'shift') fpsState.keys.shift = true;
    if (k === ' ' || e.code === 'Space') {
      e.preventDefault();
      tryJump();
    }
  });
  window.addEventListener('keyup', e => {
    if (!fpsActive) return;
    const k = e.key.toLowerCase();
    if (k === 'w') fpsState.keys.w = false;
    if (k === 'a') fpsState.keys.a = false;
    if (k === 's') fpsState.keys.s = false;
    if (k === 'd') fpsState.keys.d = false;
    if (k === 'shift') fpsState.keys.shift = false;
  });

  // Mouse para orbitar la cámara alrededor del personaje (drag con botón
  // izquierdo). NO usamos pointer lock — es más cómodo el drag suelto.
  // Esto es independiente del touch para que ambos funcionen.
  let camDragging = false;
  let camDragLast = null;
  renderer.domElement.addEventListener('mousedown', e => {
    if (!fpsActive) return;
    if (e.button !== 0) return;
    camDragging = true;
    camDragLast = { x: e.clientX, y: e.clientY };
    renderer.domElement.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!fpsActive || !camDragging) return;
    const dx = e.clientX - camDragLast.x;
    const dy = e.clientY - camDragLast.y;
    fpsState.camYaw   -= dx * fpsState.lookSensitivity;
    fpsState.camPitch -= dy * fpsState.lookSensitivity * 0.6;
    fpsState.camPitch = Math.max(0.15, Math.min(1.30, fpsState.camPitch));
    camDragLast = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener('mouseup', () => {
    camDragging = false;
    renderer.domElement.classList.remove('dragging');
  });

  // Zoom in/out con la rueda (acerca/aleja la cámara del personaje)
  renderer.domElement.addEventListener('wheel', e => {
    if (!fpsActive) return;
    e.preventDefault();
    const delta = Math.max(-50, Math.min(50, e.deltaY));
    fpsState.camDistance = Math.max(1.5, Math.min(6, fpsState.camDistance + delta * 0.005));
  }, { passive: false, capture: true });

  // Botón de salto en mobile
  const jumpBtn = document.getElementById('fpsJumpBtn');
  jumpBtn.addEventListener('pointerdown', e => { e.preventDefault(); tryJump(); });

  // -------- touch controls del modo walk --------
  (function setupFpsTouch() {
    const joy = document.getElementById('fpsJoystick');
    const knob = document.getElementById('fpsJoystickKnob');
    let joyPointer = null;
    let joyCenter = null;

    joy.addEventListener('pointerdown', e => {
      e.preventDefault();
      joyPointer = e.pointerId;
      const r = joy.getBoundingClientRect();
      joyCenter = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      joy.setPointerCapture(e.pointerId);
    });
    joy.addEventListener('pointermove', e => {
      if (e.pointerId !== joyPointer) return;
      const dx = e.clientX - joyCenter.x;
      const dy = e.clientY - joyCenter.y;
      const maxR = 42;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const cx = dist > maxR ? dx * maxR / dist : dx;
      const cy = dist > maxR ? dy * maxR / dist : dy;
      knob.style.transform = `translate(${cx}px, ${cy}px)`;
      fpsState.touchMove.x = cx / maxR;
      fpsState.touchMove.y = cy / maxR;
    });
    function release(e) {
      if (e.pointerId !== joyPointer) return;
      joyPointer = null;
      knob.style.transform = '';
      fpsState.touchMove.x = 0;
      fpsState.touchMove.y = 0;
    }
    joy.addEventListener('pointerup', release);
    joy.addEventListener('pointercancel', release);

    // Mirar con touch — arrastrar en el canvas (fuera del joystick) gira la cámara.
    let lookPointer = null;
    let lookLast = null;
    renderer.domElement.addEventListener('pointerdown', e => {
      if (!fpsActive || e.pointerType !== 'touch') return;
      if (lookPointer !== null) return;
      lookPointer = e.pointerId;
      lookLast = { x: e.clientX, y: e.clientY };
    });
    renderer.domElement.addEventListener('pointermove', e => {
      if (!fpsActive || e.pointerId !== lookPointer) return;
      const dx = e.clientX - lookLast.x;
      const dy = e.clientY - lookLast.y;
      fpsState.camYaw   -= dx * fpsState.lookSensitivity * 1.5;
      fpsState.camPitch -= dy * fpsState.lookSensitivity * 1.0;
      fpsState.camPitch = Math.max(0.15, Math.min(1.30, fpsState.camPitch));
      lookLast = { x: e.clientX, y: e.clientY };
    });
    function releaseLook(e) {
      if (e.pointerId === lookPointer) { lookPointer = null; lookLast = null; }
    }
    renderer.domElement.addEventListener('pointerup', releaseLook);
    renderer.domElement.addEventListener('pointercancel', releaseLook);
  })();

  // Loop del modo walk: input → movimiento → salto → cámara → animación
  function tickFps(dt) {
    if (!fpsActive) return;

    // 1) Dirección de movimiento en input space (-1..1 por eje)
    let mx = 0, mz = 0;
    if (fpsState.keys.w) mz -= 1;
    if (fpsState.keys.s) mz += 1;
    if (fpsState.keys.a) mx -= 1;
    if (fpsState.keys.d) mx += 1;
    mx += fpsState.touchMove.x;
    mz += fpsState.touchMove.y;
    const mag = Math.sqrt(mx * mx + mz * mz);
    if (mag > 1) { mx /= mag; mz /= mag; }
    const moving = mag > 0.05;

    // 2) Movimiento relativo a la CÁMARA (no al personaje). El input W siempre
    // apunta "hacia donde mira la cámara". Esto es lo más intuitivo en juegos
    // de tercera persona modernos.
    const cosC = Math.cos(fpsState.camYaw), sinC = Math.sin(fpsState.camYaw);
    const dx = (mx * cosC - mz * sinC);
    const dz = (mx * sinC + mz * cosC);

    if (moving) {
      const speed = fpsState.moveSpeed * (fpsState.keys.shift ? fpsState.runMul : 1);
      fpsTryMove(dx * speed * dt, dz * speed * dt);
      // El personaje gira hacia su dirección de movimiento (suavemente)
      const targetYaw = Math.atan2(dx, dz);
      let delta = targetYaw - fpsState.yaw;
      while (delta >  Math.PI) delta -= Math.PI * 2;
      while (delta < -Math.PI) delta += Math.PI * 2;
      fpsState.yaw += delta * Math.min(1, dt * 12);
    }

    // 3) Gravedad + salto
    fpsState.velocityY += fpsState.gravity * dt;
    fpsState.height += fpsState.velocityY * dt;
    if (fpsState.height <= 0) {
      fpsState.height = 0;
      fpsState.velocityY = 0;
      fpsState.onGround = true;
    } else {
      fpsState.onGround = false;
    }

    // 4) Animación: caminar y saltar
    if (moving && fpsState.onGround) {
      fpsState.walkPhase += dt * 9;
    } else {
      fpsState.walkPhase *= Math.max(0, 1 - dt * 4);
    }
    const swing = Math.sin(fpsState.walkPhase) * 0.7;
    const ud = player.userData;
    if (fpsState.onGround) {
      // Piernas y brazos oscilan alternados desde la cadera/hombro
      ud.legL.rotation.x =  swing;
      ud.legR.rotation.x = -swing;
      ud.armL.rotation.x = -swing * 0.8;
      ud.armR.rotation.x =  swing * 0.8;
    } else {
      // En el aire: piernas dobladas adelante, brazos elevados
      ud.legL.rotation.x = -0.5;
      ud.legR.rotation.x = -0.5;
      ud.armL.rotation.x = -1.2;
      ud.armR.rotation.x = -1.2;
    }
    const bob = (fpsState.onGround && moving) ? Math.abs(Math.cos(fpsState.walkPhase)) * 0.03 : 0;

    // 5) Aplicar transform al mesh del personaje
    player.position.set(fpsState.pos.x, fpsState.pos.y + fpsState.height + bob, fpsState.pos.z);
    player.rotation.y = fpsState.yaw + Math.PI; // el personaje "mira" hacia -z por construcción, sumamos π
    // La sombra queda en el suelo aunque el personaje salte (compensa la altura)
    ud.shadow.position.y = 0.005 - fpsState.height - bob;
    // La sombra también se achica cuanto más alto está
    const shadowScale = Math.max(0.3, 1 - fpsState.height * 0.4);
    ud.shadow.scale.set(shadowScale, shadowScale, shadowScale);

    // 6) Cámara orbital sobre el personaje
    const camR = fpsState.camDistance;
    const focusX = player.position.x;
    const focusY = player.position.y + 0.6;          // mira al pecho/cabeza
    const focusZ = player.position.z;
    fpsCam.position.set(
      focusX + camR * Math.sin(fpsState.camPitch) * Math.cos(fpsState.camYaw + Math.PI / 2),
      focusY + camR * Math.cos(fpsState.camPitch),
      focusZ + camR * Math.sin(fpsState.camPitch) * Math.sin(fpsState.camYaw + Math.PI / 2)
    );
    fpsCam.lookAt(focusX, focusY, focusZ);

    // 7) Tile "objetivo": el que está DELANTE del personaje (a 1 tile de
    //    distancia en la dirección a la que mira). Si está fuera del mapa,
    //    usamos el tile DEBAJO del personaje.
    const lookDist = 1.0;
    const ahead = {
      x: fpsState.pos.x + Math.sin(fpsState.yaw) * lookDist,
      z: fpsState.pos.z + Math.cos(fpsState.yaw) * lookDist,
    };
    let gx = Math.floor(ahead.x + GRID / 2);
    let gz = Math.floor(ahead.z + GRID / 2);
    if (gx < 0 || gx >= GRID || gz < 0 || gz >= GRID) {
      gx = Math.floor(fpsState.pos.x + GRID / 2);
      gz = Math.floor(fpsState.pos.z + GRID / 2);
    }
    if (gx >= 0 && gx < GRID && gz >= 0 && gz < GRID) {
      const tp = tilePos(gx, gz);
      hoverMesh.position.set(tp.x, TOP_H + 0.02, tp.z);
      hoverMesh.visible = true;
      currentHover = { x: gx, z: gz };
    } else {
      hoverMesh.visible = false;
      currentHover = null;
    }
  }

  // =====================================================================
  // Economy (FarmVille-style):
  //   - 🪙 coins are the single currency.
  //   - ⭐ XP accumulates from harvests; reaching the level threshold awards
  //     a coin bonus and bumps level. No hard unlocks — level is flavor.
  //   - Every placeable "kind" with a HARVEST entry grows for N seconds then
  //     becomes ready (a coin/fruit emoji sprite hovers over it). A click on
  //     a ready cell collects, ignoring the currently selected tool.
  //   - Crops are one-shot (become dirt). Trees / houses / mills / barns
  //     reset their timer and keep producing.
  // =====================================================================
  const ECON = { coins: 30, xp: 0, level: 1 };

  // Cost in coins to place each kind. Terrain + tuft are free.
  const COSTS = {
    crop: 2, tree: 8, fence: 1,
    house: 20, windmill: 50, barn: 80,
  };

  // Harvest spec per kind. growSec: seconds until ready. coins/xp: reward
  // on harvest. consume: if true, the placement is destroyed on harvest
  // (e.g. crops become dirt). label: floating text on collection.
  const HARVEST = {
    crop:     { growSec: 25,  coins: 6,  xp: 2,  consume: true,  emoji: '🌾', label: '+6 🪙' },
    tree:     { growSec: 60,  coins: 12, xp: 4,                  emoji: '🍎', label: '+12 🪙' },
    house:    { growSec: 45,  coins: 5,  xp: 2,                  emoji: '🪙', label: '+5 🪙' },
    windmill: { growSec: 90,  coins: 30, xp: 10,                 emoji: '🌾', label: '+30 🪙' },
    barn:     { growSec: 120, coins: 50, xp: 15,                 emoji: '🥛', label: '+50 🪙' },
  };

  // Per-cell harvest state: key 'x,z' → { kind, plantedAt }
  // plantedAt is in seconds (performance.now() / 1000).
  const harvestState = new Map();
  // key → THREE.Sprite hovering over the cell when ready
  const readySprites = new Map();
  // key → { sprite, lastSec, progress } shown while the cell is still growing
  const timerSprites = new Map();

  // Shared emoji sprite textures (one per kind).
  function makeEmojiTexture(emoji) {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const g = c.getContext('2d');
    g.font = '92px serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    // soft white halo so the emoji reads against any backdrop
    g.shadowColor = 'rgba(255,255,255,0.95)';
    g.shadowBlur = 14;
    g.fillText(emoji, 64, 68);
    g.shadowBlur = 0;
    g.fillText(emoji, 64, 68);
    return new THREE.CanvasTexture(c);
  }
  const READY_TEX = {};
  for (const k in HARVEST) READY_TEX[k] = makeEmojiTexture(HARVEST[k].emoji);

  function makeReadySprite(kind) {
    const mat = new THREE.SpriteMaterial({
      map: READY_TEX[kind] || READY_TEX.crop,
      transparent: true,
      depthTest: false,   // always on top
    });
    const sp = new THREE.Sprite(mat);
    sp.scale.set(0.55, 0.55, 0.55);
    sp.renderOrder = 999;
    return sp;
  }

  // Timer pill: dark rounded background with "Xs" text + thin progress bar
  // underneath. We redraw the canvas only when the integer second OR a
  // visible progress step (10% increments) changes — saves on texture
  // uploads while still feeling alive.
  function drawTimerCanvas(canvas, secs, progress01) {
    const g = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    g.clearRect(0, 0, w, h);
    // Pill
    const pillW = 110, pillH = 44, px = (w - pillW) / 2, py = 6;
    g.fillStyle = 'rgba(42, 39, 34, 0.88)';
    g.beginPath();
    const r = 22;
    g.moveTo(px + r, py);
    g.arcTo(px + pillW, py, px + pillW, py + pillH, r);
    g.arcTo(px + pillW, py + pillH, px, py + pillH, r);
    g.arcTo(px, py + pillH, px, py, r);
    g.arcTo(px, py, px + pillW, py, r);
    g.closePath();
    g.fill();
    // Inset progress bar
    const barW = pillW - 22, barH = 6, bx = px + 11, by = py + pillH - 12;
    g.fillStyle = 'rgba(255,255,255,0.18)';
    g.fillRect(bx, by, barW, barH);
    g.fillStyle = '#6fb442';
    g.fillRect(bx, by, barW * progress01, barH);
    // Text
    g.fillStyle = '#fff';
    g.font = '600 22px Inter, system-ui, -apple-system, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(secs + 's', w / 2, py + 16);
  }

  function makeTimerSprite() {
    const c = document.createElement('canvas');
    c.width = 160; c.height = 64;
    const tex = new THREE.CanvasTexture(c);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
    const sp = new THREE.Sprite(mat);
    // ~2.5:1 aspect; smaller than ready emoji so multiple cells read clearly
    sp.scale.set(0.95, 0.38, 1);
    sp.renderOrder = 998;
    sp.userData.canvas = c;
    sp.userData.texture = tex;
    return sp;
  }

  function clearTimerSprite(key) {
    const t = timerSprites.get(key);
    if (!t) return;
    worldGroup.remove(t.sprite);
    if (t.sprite.material) {
      if (t.sprite.material.map) t.sprite.material.map.dispose();
      t.sprite.material.dispose();
    }
    timerSprites.delete(key);
  }

  function countKind(k) {
    let n = 0;
    for (let x = 0; x < GRID; x++)
      for (let z = 0; z < GRID; z++)
        if (world[x][z].kind === k) n++;
    return n;
  }

  // Trees are not unlimited: each house unlocks 2 tree slots on top of a
  // small starting allowance. This forces the player to invest in housing
  // before scaling apple income — and prevents the screen from becoming a
  // pure forest.
  const TREE_BASE_CAP = 3;
  const TREE_PER_HOUSE = 2;
  function treeCap() { return TREE_BASE_CAP + countKind('house') * TREE_PER_HOUSE; }

  // Total villagers = sum over houses of 4 × floors. Pure flavor stat shown
  // in the HUD; the actual economy runs on coins/XP, not population.
  function popCount() {
    let n = 0;
    for (let x = 0; x < GRID; x++)
      for (let z = 0; z < GRID; z++) {
        const c = world[x][z];
        if (c.kind === 'house') n += 4 * (c.floors || 1);
      }
    return n;
  }

  // Total harvests collected this session — used as a session stat for goals.
  let totalHarvests = 0;
  // XP needed to reach (current level + 1). Slightly superlinear so each
  // level takes a touch longer than the last without feeling grindy.
  function xpForNext() { return 10 + 8 * ECON.level + 2 * ECON.level * ECON.level; }

  function tickHarvest(t) {
    // Pause growth visuals while in combat — the harvest sprites/pills would
    // clutter the screen during a firefight. Internal state keeps ticking
    // because plantedAt is relative time, so growth picks up where it left.
    if (typeof COMBAT !== 'undefined' && COMBAT.active) return;
    // t is in seconds (now / 1000) from the main animate loop.
    for (const [key, st] of harvestState) {
      const cfg = HARVEST[st.kind];
      if (!cfg) continue;
      const elapsed = t - st.plantedAt;
      const ready = elapsed >= cfg.growSec;
      const [xs, zs] = key.split(',').map(Number);
      const phase = (xs * 17 + zs * 31) * 0.13;

      if (ready) {
        // Drop the countdown pill if any, show the harvest emoji sprite.
        if (timerSprites.has(key)) clearTimerSprite(key);
        let sp = readySprites.get(key);
        if (!sp) {
          sp = makeReadySprite(st.kind);
          const p = tilePos(xs, zs);
          sp.position.set(p.x, 0, p.z);
          // pickTile() walks parents looking for userData.gx — give it to the
          // sprite so a click on the icon hits the cell.
          sp.userData.gx = xs;
          sp.userData.gz = zs;
          worldGroup.add(sp);
          readySprites.set(key, sp);
        }
        sp.position.y = 1.15 + Math.sin(t * 3 + phase) * 0.09;
      } else {
        // Still growing → countdown pill above the tile.
        if (readySprites.has(key)) clearReadySprite(key); // safety
        let entry = timerSprites.get(key);
        if (!entry) {
          const sp = makeTimerSprite();
          const p = tilePos(xs, zs);
          sp.position.set(p.x, 1.15, p.z);
          // Same picking trick: clicks on the pill resolve to the cell so
          // applyTool can show the "Xs…" floating hint.
          sp.userData.gx = xs;
          sp.userData.gz = zs;
          worldGroup.add(sp);
          entry = { sprite: sp, lastSec: -1, lastProgStep: -1 };
          timerSprites.set(key, entry);
        }
        const remain = Math.max(0, cfg.growSec - elapsed);
        const showSec = Math.max(1, Math.ceil(remain));
        const progress01 = Math.min(1, Math.max(0, elapsed / cfg.growSec));
        // Step progress in 5% increments to avoid redrawing every frame.
        const progStep = Math.round(progress01 * 20);
        if (entry.lastSec !== showSec || entry.lastProgStep !== progStep) {
          drawTimerCanvas(entry.sprite.userData.canvas, showSec, progress01);
          entry.sprite.userData.texture.needsUpdate = true;
          entry.lastSec = showSec;
          entry.lastProgStep = progStep;
        }
        // Very subtle bob — the pill is informational so we don't want it
        // dancing as much as the "ready" emoji.
        entry.sprite.position.y = 1.15 + Math.sin(t * 2 + phase) * 0.04;
      }
    }
  }

  function clearReadySprite(key) {
    const sp = readySprites.get(key);
    if (!sp) return;
    worldGroup.remove(sp);
    if (sp.material) sp.material.dispose();
    readySprites.delete(key);
  }

  function isReady(key) {
    const st = harvestState.get(key);
    if (!st) return false;
    const cfg = HARVEST[st.kind];
    if (!cfg) return false;
    return (performance.now() / 1000 - st.plantedAt) >= cfg.growSec;
  }

  function registerHarvest(x, z, kind) {
    if (!HARVEST[kind]) return;
    const key = x + ',' + z;
    clearReadySprite(key);
    clearTimerSprite(key);
    harvestState.set(key, { kind, plantedAt: performance.now() / 1000 });
  }

  function unregisterHarvest(x, z) {
    const key = x + ',' + z;
    clearReadySprite(key);
    clearTimerSprite(key);
    harvestState.delete(key);
  }

  // Sync harvestState ↔ world: when the initial scene loads or cells are
  // erased outside applyTool, the harvest map can drift. Rebuild it here
  // so a Reset starts every existing kind on a fresh growth cycle.
  function syncHarvestStateFromWorld() {
    for (const key of Array.from(harvestState.keys())) {
      clearReadySprite(key);
      clearTimerSprite(key);
    }
    harvestState.clear();
    const now = performance.now() / 1000;
    for (let x = 0; x < GRID; x++) {
      for (let z = 0; z < GRID; z++) {
        const k = world[x][z].kind;
        if (k && HARVEST[k]) {
          harvestState.set(x + ',' + z, { kind: k, plantedAt: now });
        }
      }
    }
  }

  function harvestAt(x, z, sx, sy) {
    const key = x + ',' + z;
    const st = harvestState.get(key);
    if (!st) return false;
    const cfg = HARVEST[st.kind];
    const now = performance.now() / 1000;
    if (now - st.plantedAt < cfg.growSec) return false;

    // Award rewards + visual feedback
    ECON.coins += cfg.coins;
    bumpRes('resCoins');
    showFloatAt(sx, sy, cfg.label, '#d4a017');
    gainXp(cfg.xp);
    totalHarvests++;

    if (cfg.consume) {
      // Crop: vanish, leaving dirt behind so re-planting is one click.
      unregisterHarvest(x, z);
      setCell(x, z, { terrain: 'dirt', kind: null });
    } else {
      // Repeating: reset the timer and clear the ready sprite — next frame
      // tickHarvest will spawn a fresh countdown pill.
      st.plantedAt = now;
      clearReadySprite(key);
      clearTimerSprite(key);
    }

    updateHud();
    checkGoals();
    saveState();
    return true;
  }

  function gainXp(amount) {
    ECON.xp += amount;
    let leveled = false;
    while (ECON.xp >= xpForNext()) {
      ECON.xp -= xpForNext();
      ECON.level++;
      leveled = true;
      const bonus = ECON.level * 10;
      ECON.coins += bonus;
      showToast('Level ' + ECON.level + '! +' + bonus + ' 🪙', '⭐');
    }
    if (leveled) bumpRes('resLevel');
    bumpRes('resXp');
  }

  function bumpRes(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('bump');
    void el.offsetWidth; // force reflow to restart anim
    el.classList.add('bump');
  }

  function updateHud() {
    const coinsEl = document.getElementById('resCoins');
    if (coinsEl) coinsEl.querySelector('.val').textContent = ECON.coins;

    const lvlEl = document.getElementById('resLevel');
    if (lvlEl) lvlEl.querySelector('.val').textContent = ECON.level;

    const popEl = document.getElementById('resPop');
    if (popEl) popEl.querySelector('.val').textContent = popCount();

    const need = xpForNext();
    const xpVal = document.getElementById('xpVal');
    const xpNext = document.getElementById('xpNext');
    const xpFill = document.getElementById('xpBarFill');
    if (xpVal) xpVal.textContent = ECON.xp;
    if (xpNext) xpNext.textContent = need;
    if (xpFill) xpFill.style.width = (100 * ECON.xp / need) + '%';

    updateCatalogCosts();
  }

  function updateCatalogCosts() {
    document.querySelectorAll('.dock-item .cost').forEach(chip => {
      const c = parseInt(chip.dataset.cost, 10);
      chip.classList.toggle('cant', ECON.coins < c);
    });
    // Tree slot indicator on the tree card
    const haveTrees = countKind('tree');
    const cap = treeCap();
    document.querySelectorAll('.tree-limit').forEach(el => {
      el.textContent = haveTrees + '/' + cap;
      el.classList.toggle('full', haveTrees >= cap);
    });
  }

  function canAfford(tool) {
    const cost = COSTS[tool.kind] || 0;
    return ECON.coins >= cost;
  }

  function payFor(tool) {
    const cost = COSTS[tool.kind] || 0;
    if (cost > 0) {
      ECON.coins -= cost;
      bumpRes('resCoins');
    }
  }

  function onPlace(tool, x, z, sx, sy) {
    // Register growth timer for harvestable kinds
    if (HARVEST[tool.kind]) {
      registerHarvest(x, z, tool.kind);
      const cfg = HARVEST[tool.kind];
      showFloatAt(sx, sy, 'planted · ' + cfg.growSec + 's', '#6fb442');
    }
  }

  function showFloatAt(x, y, text, color) {
    const el = document.createElement('div');
    el.className = 'float-text';
    el.textContent = text;
    if (color) el.style.color = color;
    el.style.left = x + 'px';
    el.style.top  = (y - 10) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function showToast(text, icon) {
    const host = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = (icon ? '<span class="icon">' + icon + '</span>' : '') + text;
    host.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  // -------- Missions: linear chain with rewards + hints --------
  // Each mission completes when progress() reaches target. The completion
  // grants `reward.coins` and `reward.xp`, and the next mission unlocks.
  // The panel shows the current mission expanded + the next 2 dimmed so the
  // player always sees what's coming.
  const MISSIONS = [
    { id: 'plant_crop',
      icon: '🌾', name: 'Plant your first crop',
      hint: 'Open the Vegetation tab in the dock and click Crop, then tap a tile.',
      target: 1, progress: () => countKind('crop'),
      reward: { coins: 20, xp: 5 } },
    { id: 'harvest_3',
      icon: '🪙', name: 'Harvest 3 times',
      hint: 'Wait for the 🌾 icon to float above a crop, then click it.',
      target: 3, progress: () => totalHarvests,
      reward: { coins: 30, xp: 10 } },
    { id: 'plant_tree',
      icon: '🌳', name: 'Plant your first tree',
      hint: 'Trees produce apples 🍎 every minute. They cost 8 🪙.',
      target: 1, progress: () => countKind('tree'),
      reward: { coins: 15, xp: 5 } },
    { id: 'build_house',
      icon: '🏠', name: 'Build a house',
      hint: 'Houses cost 20 🪙 and unlock 2 more tree slots each.',
      target: 1, progress: () => countKind('house'),
      reward: { coins: 50, xp: 15 } },
    { id: 'level3',
      icon: '⭐', name: 'Reach level 3',
      hint: 'Keep harvesting to earn XP. Every harvest gives ⭐.',
      target: 3, progress: () => ECON.level,
      reward: { coins: 50, xp: 0 } },
    { id: 'harvest_10',
      icon: '🌾', name: 'Harvest 10 times in total',
      hint: 'Crops are quick (25s) — plant a row of them.',
      target: 10, progress: () => totalHarvests,
      reward: { coins: 60, xp: 15 } },
    { id: 'build_mill',
      icon: '🌬️', name: 'Build a windmill',
      hint: 'Mills cost 50 🪙 and pay 30 🪙 every 90s. Save up!',
      target: 1, progress: () => countKind('windmill'),
      reward: { coins: 80, xp: 25 } },
    { id: 'plant_5_trees',
      icon: '🌳', name: 'Plant 5 trees',
      hint: 'You need at least 1 house to plant more than 3 trees.',
      target: 5, progress: () => countKind('tree'),
      reward: { coins: 60, xp: 20 } },
    { id: 'level5',
      icon: '⭐', name: 'Reach level 5',
      hint: 'Mills and barns give big XP — chase those harvests.',
      target: 5, progress: () => ECON.level,
      reward: { coins: 100, xp: 0 } },
    { id: 'build_barn',
      icon: '🏚️', name: 'Build a barn',
      hint: 'Barns cost 80 🪙 and pay 50 🪙 every 2 minutes.',
      target: 1, progress: () => countKind('barn'),
      reward: { coins: 150, xp: 40 } },
    { id: 'pop_12',
      icon: '👥', name: 'Reach 12 villagers',
      hint: 'Each house = 4 villagers. Build more (or stack floors).',
      target: 12, progress: () => popCount(),
      reward: { coins: 120, xp: 30 } },
    { id: 'harvest_30',
      icon: '🪙', name: 'Harvest 30 times',
      hint: 'Keep that loop running.',
      target: 30, progress: () => totalHarvests,
      reward: { coins: 150, xp: 50 } },
    { id: 'coins_500',
      icon: '💰', name: 'Save up 500 coins',
      hint: 'Mills and barns are your big earners.',
      target: 500, progress: () => ECON.coins,
      reward: { coins: 200, xp: 50 } },
    { id: 'level8',
      icon: '⭐', name: 'Reach level 8',
      hint: 'Almost there!',
      target: 8, progress: () => ECON.level,
      reward: { coins: 200, xp: 0 } },
    { id: 'level10',
      icon: '👑', name: 'Reach level 10 — Master Builder',
      hint: 'The final milestone. Your town is thriving.',
      target: 10, progress: () => ECON.level,
      reward: { coins: 500, xp: 0 } },
    { id: 'done',
      icon: '👑', name: 'You built a thriving farm!',
      hint: 'Keep building for fun — there are no more missions to complete.',
      target: 1, progress: () => 1,
