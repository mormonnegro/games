      reward: { coins: 0, xp: 0 } },
  ];

  // Back-compat: legacy name in save schema.
  let goalIdx = 0;

  function checkGoals() {
    // Try to advance through any missions whose target is already satisfied.
    // We loop because completing a "+coins" mission can immediately satisfy
    // a "save up X coins" mission, etc.
    let advanced = false;
    while (goalIdx < MISSIONS.length - 1) {
      const m = MISSIONS[goalIdx];
      if (m.progress() < m.target) break;
      const r = m.reward || { coins: 0, xp: 0 };
      if (r.coins) { ECON.coins += r.coins; bumpRes('resCoins'); }
      if (r.xp)    gainXp(r.xp);
      showToast(m.name + ' ✓  +' + (r.coins || 0) + ' 🪙', m.icon);
      goalIdx++;
      advanced = true;
    }
    renderMissions();
    if (advanced) { updateHud(); saveState(); }
  }

  // Render up to 3 missions: current + next 2 (locked). When the last is
  // reached we just show it on its own. Hint is visible only on the active
  // mission to keep the panel compact.
  function renderMissions() {
    const list = document.getElementById('missionsList');
    const counter = document.getElementById('missionsCounter');
    if (!list || !counter) return;
    counter.textContent = goalIdx + ' / ' + (MISSIONS.length - 1);

    const slice = [];
    for (let i = 0; i < 3; i++) {
      const m = MISSIONS[goalIdx + i];
      if (m) slice.push({ m, locked: i > 0 });
    }

    list.innerHTML = '';
    slice.forEach(({ m, locked }, i) => {
      const el = document.createElement('div');
      el.className = 'mission ' + (locked ? 'locked' : 'active');
      const p = Math.min(m.target, m.progress());
      const pct = Math.round(100 * p / m.target);
      const r = m.reward || {};
      const rewardChip = (r.coins || r.xp)
        ? '<span class="mission-reward">+' + (r.coins || 0) + '🪙' + (r.xp ? ' +' + r.xp + '⭐' : '') + '</span>'
        : '';
      const lockIcon = locked ? '<span class="lock-icon">🔒</span>' : '';
      el.innerHTML =
        '<div class="mission-row">' +
          '<div class="mission-icon">' + m.icon + '</div>' +
          '<div class="mission-body">' +
            '<div class="mission-name">' + escapeHtml(m.name) + '</div>' +
            (locked ? '' :
              '<div class="mission-hint">' + escapeHtml(m.hint || '') + '</div>' +
              '<div class="mission-bar"><div class="mission-bar-fill" style="width:' + pct + '%"></div></div>' +
              '<div class="mission-meta">' +
                '<span class="mission-progress">' + p + ' / ' + m.target + '</span>' +
                rewardChip +
              '</div>') +
          '</div>' +
          lockIcon +
        '</div>';
      list.appendChild(el);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  // Save / load: serialize coins/xp/level/goalIdx and the harvest timers
  // (relative to "seconds ago") so a refresh doesn't reset growth progress.
  const SAVE_KEY = 'tinyworld_v2';
  function saveState() {
    try {
      const now = performance.now() / 1000;
      const timers = [];
      for (const [key, st] of harvestState) {
        timers.push([key, st.kind, now - st.plantedAt]);
      }
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        coins: ECON.coins, xp: ECON.xp, level: ECON.level,
        goalIdx, totalHarvests, timers,
      }));
    } catch (e) {}
  }

  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
      if (typeof s.coins === 'number') ECON.coins = s.coins;
      if (typeof s.xp    === 'number') ECON.xp    = s.xp;
      if (typeof s.level === 'number') ECON.level = s.level;
      if (typeof s.goalIdx === 'number') goalIdx = s.goalIdx;
      if (typeof s.totalHarvests === 'number') totalHarvests = s.totalHarvests;
      if (Array.isArray(s.timers)) {
        const now = performance.now() / 1000;
        for (const [key, kind, elapsed] of s.timers) {
          if (HARVEST[kind]) {
            harvestState.set(key, { kind, plantedAt: now - elapsed });
          }
        }
      }
    } catch (e) {}
  }

  function resetEcon() {
    ECON.coins = 30; ECON.xp = 0; ECON.level = 1;
    goalIdx = 0; totalHarvests = 0;
    for (const key of Array.from(readySprites.keys())) clearReadySprite(key);
    for (const key of Array.from(timerSprites.keys())) clearTimerSprite(key);
    harvestState.clear();
    syncHarvestStateFromWorld();
    updateHud();
    checkGoals();
    saveState();
  }

  // =====================================================================
  // Combat mode: walk + shoot + waves of enemies.
  // Reuses the existing third-person walk system (`fpsActive`, `tickFps`,
  // `fpsCam`). Adds shooting on click, enemies that path toward the player,
  // wave progression, HP, and a game-over screen.
  // =====================================================================
  const COMBAT = {
    active: false,
    gameOver: false,
    hp: 5, maxHp: 5,
    score: 0, kills: 0,
    wave: 1,
    waveTarget: 5,        // kills needed to advance wave
    waveDone: 0,
    spawnTimer: 0.5,
    spawnEvery: 2.2,
    enemies: [],
    projectiles: [],
    hitCooldown: 0,       // i-frames after being touched
  };

  // Geometry/material caches so we don't allocate per shot/per enemy.
  const _projGeom = new THREE.SphereGeometry(0.07, 8, 8);
  const _projMat  = new THREE.MeshBasicMaterial({ color: 0xffe55c });
  const _enemyBodyGeom = new THREE.BoxGeometry(0.45, 0.60, 0.45);
  const _enemyEyeGeom  = new THREE.SphereGeometry(0.05, 6, 6);
  const _enemyEyeMat   = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const _enemyPupilGeom= new THREE.SphereGeometry(0.025, 6, 6);
  const _enemyPupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

  function makeEnemyMesh(tinted) {
    const mat = new THREE.MeshLambertMaterial({
      color: tinted ? 0x6b2a82 : 0xc94848,
    });
    const body = new THREE.Mesh(_enemyBodyGeom, mat);
    body.castShadow = true;
    const e1 = new THREE.Mesh(_enemyEyeGeom, _enemyEyeMat);
    const e2 = new THREE.Mesh(_enemyEyeGeom, _enemyEyeMat);
    e1.position.set(-0.10, 0.16, 0.23);
    e2.position.set( 0.10, 0.16, 0.23);
    body.add(e1); body.add(e2);
    const p1 = new THREE.Mesh(_enemyPupilGeom, _enemyPupilMat);
    const p2 = new THREE.Mesh(_enemyPupilGeom, _enemyPupilMat);
    p1.position.set(-0.10, 0.16, 0.27);
    p2.position.set( 0.10, 0.16, 0.27);
    body.add(p1); body.add(p2);
    return body;
  }

  function spawnEnemy() {
    // Pick a random edge cell so enemies emerge from the perimeter.
    const edge = Math.floor(Math.random() * 4);
    const off = Math.floor(Math.random() * GRID);
    let x = 0, z = 0;
    if (edge === 0) { x = 0;        z = off; }
    else if (edge === 1) { x = GRID-1; z = off; }
    else if (edge === 2) { x = off;    z = 0; }
    else                 { x = off;    z = GRID-1; }
    const p = tilePos(x, z);
    // Tougher elites every few waves
    const elite = COMBAT.wave >= 3 && Math.random() < 0.2;
    const mesh = makeEnemyMesh(elite);
    mesh.position.set(p.x, TOP_H + 0.30, p.z);
    scene.add(mesh);
    COMBAT.enemies.push({
      mesh,
      hp: elite ? 3 : 1 + Math.floor((COMBAT.wave - 1) / 3),
      speed: (elite ? 1.0 : 1.5) + COMBAT.wave * 0.08,
      bobPhase: Math.random() * Math.PI * 2,
    });
  }

  // Aim direction: the camera's forward vector, flattened to the horizontal
  // plane. This is the "look forward" axis from third-person camera, which
  // matches the crosshair the player sees.
  const _aimDir = new THREE.Vector3();
  function getAimDir() {
    fpsCam.getWorldDirection(_aimDir);
    _aimDir.y = 0;
    if (_aimDir.lengthSq() < 1e-6) _aimDir.set(0, 0, -1);
    _aimDir.normalize();
    return _aimDir;
  }

  function spawnProjectile() {
    if (!COMBAT.active || COMBAT.gameOver || !fpsActive) return;
    const dir = getAimDir();
    const sp = new THREE.Mesh(_projGeom, _projMat);
    // Start in front of the player so we don't immediately collide with
    // the player mesh.
    sp.position.set(
      fpsState.pos.x + dir.x * 0.45,
      TOP_H + 0.55,
      fpsState.pos.z + dir.z * 0.45
    );
    sp.userData = { vx: dir.x * 22, vz: dir.z * 22, life: 1.4 };
    scene.add(sp);
    COMBAT.projectiles.push(sp);
    // Tiny muzzle flash effect via float text
    if (typeof showFloatAt === 'function') {
      // skip — too noisy
    }
  }

  function flashDamage() {
    const v = document.getElementById('damageVignette');
    v.classList.add('flash');
    setTimeout(() => v.classList.remove('flash'), 220);
  }

  function bumpHeart(idx) {
    const list = document.querySelectorAll('#hearts .heart');
    const h = list[idx];
    if (!h) return;
    h.classList.remove('bump');
    void h.offsetWidth;
    h.classList.add('bump');
  }

  function updateCombatHud() {
    const hearts = document.getElementById('hearts');
    if (hearts) {
      hearts.innerHTML = '';
      for (let i = 0; i < COMBAT.maxHp; i++) {
        const h = document.createElement('span');
        h.className = 'heart' + (i < COMBAT.hp ? '' : ' lost');
        h.textContent = '❤️';
        hearts.appendChild(h);
      }
    }
    const w = document.getElementById('waveVal');  if (w) w.textContent = COMBAT.wave;
    const k = document.getElementById('killsVal'); if (k) k.textContent = COMBAT.waveDone + '/' + COMBAT.waveTarget;
    const s = document.getElementById('scoreVal'); if (s) s.textContent = COMBAT.score;
  }

  function advanceWave() {
    COMBAT.wave++;
    COMBAT.waveDone = 0;
    COMBAT.waveTarget = 5 + Math.floor(COMBAT.wave * 1.8);
    COMBAT.spawnEvery = Math.max(0.55, 2.2 - COMBAT.wave * 0.12);
    COMBAT.spawnTimer = 1.2; // short breather between waves
    showToast('Wave ' + COMBAT.wave + ' — incoming!', '⚔️');
    updateCombatHud();
  }

  function tickCombat(dt) {
    if (!COMBAT.active || COMBAT.gameOver) return;

    // Spawn budget: while we still owe this wave more enemies, drip them
    // in at intervals. The wave advances when all spawned ones are killed.
    if (COMBAT.waveDone < COMBAT.waveTarget) {
      const spawnedThisWave = COMBAT.waveDone + COMBAT.enemies.length;
      if (spawnedThisWave < COMBAT.waveTarget) {
        COMBAT.spawnTimer -= dt;
        if (COMBAT.spawnTimer <= 0) {
          spawnEnemy();
          COMBAT.spawnTimer = COMBAT.spawnEvery;
        }
      }
    }

    // Update enemies: walk toward player; on contact, damage player.
    const px = fpsState.pos.x, pz = fpsState.pos.z;
    for (const en of COMBAT.enemies) {
      const dx = px - en.mesh.position.x;
      const dz = pz - en.mesh.position.z;
      const d = Math.hypot(dx, dz);
      if (d > 0.001) {
        en.mesh.position.x += (dx / d) * en.speed * dt;
        en.mesh.position.z += (dz / d) * en.speed * dt;
        en.mesh.rotation.y = Math.atan2(dx, dz);
      }
      // Subtle bob so they don't look static
      en.bobPhase += dt * 6;
      en.mesh.position.y = TOP_H + 0.30 + Math.abs(Math.sin(en.bobPhase)) * 0.05;

      if (d < 0.55 && COMBAT.hitCooldown <= 0) {
        COMBAT.hp--;
        COMBAT.hitCooldown = 0.9;
        flashDamage();
        // Knock the enemy back so it doesn't camp on the player
        en.mesh.position.x -= (dx / d) * 0.6;
        en.mesh.position.z -= (dz / d) * 0.6;
        bumpHeart(COMBAT.hp);
        updateCombatHud();
        if (COMBAT.hp <= 0) { onGameOver(); return; }
      }
    }
    COMBAT.hitCooldown = Math.max(0, COMBAT.hitCooldown - dt);

    // Update projectiles: move, age, check enemy hits.
    const alive = [];
    for (const p of COMBAT.projectiles) {
      p.userData.life -= dt;
      if (p.userData.life <= 0) { scene.remove(p); continue; }
      p.position.x += p.userData.vx * dt;
      p.position.z += p.userData.vz * dt;

      let hit = null;
      for (const en of COMBAT.enemies) {
        const dx = p.position.x - en.mesh.position.x;
        const dz = p.position.z - en.mesh.position.z;
        if (dx*dx + dz*dz < 0.30*0.30) { hit = en; break; }
      }
      if (hit) {
        hit.hp--;
        scene.remove(p);
        if (hit.hp <= 0) {
          scene.remove(hit.mesh);
          if (hit.mesh.material) hit.mesh.material.dispose();
          COMBAT.enemies = COMBAT.enemies.filter(e => e !== hit);
          COMBAT.kills++;
          COMBAT.waveDone++;
          COMBAT.score += 10 * COMBAT.wave;
          updateCombatHud();
          if (COMBAT.waveDone >= COMBAT.waveTarget && COMBAT.enemies.length === 0) {
            advanceWave();
          }
        } else {
          // Hit flash via material tint — quick and dirty.
          hit.mesh.material.emissive = new THREE.Color(0xffffff);
          setTimeout(() => {
            if (hit.mesh.material) hit.mesh.material.emissive = new THREE.Color(0x000000);
          }, 80);
        }
        continue;
      }
      alive.push(p);
    }
    COMBAT.projectiles = alive;
  }

  function clearCombatEntities() {
    for (const en of COMBAT.enemies) {
      scene.remove(en.mesh);
      if (en.mesh.material) en.mesh.material.dispose();
    }
    for (const p of COMBAT.projectiles) scene.remove(p);
    COMBAT.enemies = [];
    COMBAT.projectiles = [];
  }

  function setHarvestSpritesVisible(v) {
    if (typeof readySprites !== 'undefined') {
      for (const sp of readySprites.values()) sp.visible = v;
    }
    if (typeof timerSprites !== 'undefined') {
      for (const entry of timerSprites.values()) entry.sprite.visible = v;
    }
  }

  function startCombat() {
    if (COMBAT.active) return;
    COMBAT.active = true;
    COMBAT.gameOver = false;
    COMBAT.hp = COMBAT.maxHp;
    COMBAT.score = 0; COMBAT.kills = 0;
    COMBAT.wave = 1;
    COMBAT.waveTarget = 5; COMBAT.waveDone = 0;
    COMBAT.spawnTimer = 0.6;
    COMBAT.spawnEvery = 2.2;
    COMBAT.hitCooldown = 1.0; // grace period at start
    clearCombatEntities();
    setHarvestSpritesVisible(false);
    document.body.classList.add('combat');
    if (typeof enterFps === 'function') enterFps();
    updateCombatHud();
    showToast('Wave 1 — survive the swarm!', '⚔️');
  }

  function endCombat() {
    COMBAT.active = false;
    COMBAT.gameOver = false;
    clearCombatEntities();
    setHarvestSpritesVisible(true);
    document.body.classList.remove('combat');
    document.getElementById('gameOver').classList.remove('show');
    if (typeof exitFps === 'function') exitFps();
  }

  function onGameOver() {
    COMBAT.gameOver = true;
    document.getElementById('finalWave').textContent  = COMBAT.wave;
    document.getElementById('finalKills').textContent = COMBAT.kills;
    document.getElementById('finalScore').textContent = COMBAT.score;
    document.getElementById('gameOver').classList.add('show');
  }

  // UI wiring
  on('combatBtn',  'click', startCombat);
  on('combatExit', 'click', endCombat);
  on('restart',    'click', () => {
    document.getElementById('gameOver').classList.remove('show');
    // restart by re-entering combat
    clearCombatEntities();
    COMBAT.gameOver = false;
    COMBAT.hp = COMBAT.maxHp;
    COMBAT.score = 0; COMBAT.kills = 0;
    COMBAT.wave = 1;
    COMBAT.waveTarget = 5; COMBAT.waveDone = 0;
    COMBAT.spawnTimer = 0.6;
    COMBAT.spawnEvery = 2.2;
    COMBAT.hitCooldown = 1.0;
    updateCombatHud();
    showToast('Wave 1 — go!', '⚔️');
  });
  on('exitCombat', 'click', endCombat);

  // Shoot on pointerdown anywhere on the canvas while in combat.
  // This fires alongside the build-mode pointerdown which is gated by
  // fpsActive (it only does drag/orbit), so no double-action occurs.
  renderer.domElement.addEventListener('pointerdown', e => {
    if (COMBAT.active && !COMBAT.gameOver && fpsActive) {
      if (e.button === 0 || e.pointerType !== 'mouse') spawnProjectile();
    }
  });

  // Esc exits combat (also caught by the existing keydown for non-FPS,
  // but Escape in FPS triggers exitFps which we wrap to also clean up).
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && COMBAT.active) endCombat();
  });

  // -------- boot --------
  buildToolbar();
  if (typeof buildCatalog === 'function') buildCatalog();
  selectTool(TOOLS[8]);
  targetViewSize = viewSize;
  loadInitialScene();
  onResize();
  // Seed harvest timers for every kind that's part of the starter scene
  // before loadState overrides them with the player's saved progress.
  syncHarvestStateFromWorld();
  loadState();
  updateHud();
  checkGoals();
  requestAnimationFrame(animate);
  </script>
</body>
</html>
